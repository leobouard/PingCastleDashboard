<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
/* ===================== Themes ===================== */
:root,[data-theme="midnight"]{
  --bg:#0b1020;--surface:#121a2e;--surface2:#0f1627;--text:#e6ebf5;--text2:#b7c0d4;--muted:#7f8aa3;--border:#1f2a44;--rowline:#1a233a;
  --accent:#22d3ee;--onaccent:#05222a;--good:#34d399;--bad:#fb7185;--hibg:linear-gradient(135deg,#0e2a3a,#121a2e);--hiborder:#155e75;
  --hardbg:linear-gradient(180deg,#0f2233,#121a2e);--thbg:#0f1627;--zebra:#10182b;--fixbg:#0e1f2c;--codebg:#070b16;--codefg:#7dd3fc;
  --lv1:#f43f5e;--lv2:#f97316;--lv3:#facc15;--lv3t:#1a1400;--lv4:#10b981;--lv5:#3b82f6;
  --c1:#22d3ee;--c2:#a78bfa;--c3:#fbbf24;--c4:#34d399;--grid:#1f2a44;--track:#1f2a44;--empty:#1b2438;--resolved:#5b6580;
  --s-lowest:#22d3ee;--s-low:#34d399;--s-medium:#facc15;--s-high:#fb923c;--s-highest:#f43f5e;
  --r:14px;--br:6px;--shadow:0 1px 0 #ffffff08 inset;--font:Inter,"Segoe UI",system-ui,sans-serif;--hfont:var(--font);--numfont:var(--font);
  --mono:"Cascadia Code",Consolas,"DejaVu Sans Mono",monospace;--ktt:uppercase;--kls:.06em;--tabfg:#9aa5bd;--tabon:#22d3ee1f;--tabonfg:#67e8f9;
  --header:linear-gradient(90deg,#0b1020,#101b33 60%,#0b2a3a);--headerline:#1f2a44;--brandbg:linear-gradient(135deg,#22d3ee,#6366f1);--h3size:15px;--cardtop:var(--border);
}
[data-theme="slate"]{
  --bg:#f5f6fa;--surface:#ffffff;--surface2:#f8f9fc;--text:#111827;--text2:#374151;--muted:#6b7280;--border:#e5e7eb;--rowline:#f0f1f4;
  --accent:#4f46e5;--onaccent:#fff;--good:#059669;--bad:#dc2626;--hibg:#eef2ff;--hiborder:#c7d2fe;--hardbg:#fff;--thbg:#f9fafb;--zebra:#fcfcfd;
  --fixbg:#f5f7ff;--codebg:#0f172a;--codefg:#c7d2fe;--lv1:#dc2626;--lv2:#ea580c;--lv3:#eab308;--lv3t:#3b2f00;--lv4:#16a34a;--lv5:#2563eb;
  --c1:#4f46e5;--c2:#db2777;--c3:#d97706;--c4:#0891b2;--grid:#eef0f4;--track:#eef0f4;--empty:#eceef2;--resolved:#a3a9b5;
  --s-lowest:#0891b2;--s-low:#15803d;--s-medium:#b8860b;--s-high:#ea580c;--s-highest:#b91c1c;
  --r:12px;--br:6px;--shadow:0 1px 2px rgba(16,24,40,.05);--font:"DM Sans",Inter,"Segoe UI",system-ui,sans-serif;--hfont:var(--font);--numfont:var(--font);
  --ktt:none;--kls:0;--tabfg:#4b5563;--tabon:#fff;--tabonfg:#4f46e5;--header:#fff;--headerline:#e5e7eb;--brandbg:#4f46e5;--h3size:15px;--cardtop:var(--border);
}
[data-theme="report"]{
  --bg:#faf7f0;--surface:#fff;--surface2:#fbf9f4;--text:#1b2a4a;--text2:#3a4663;--muted:#7b8299;--border:#e8e2d4;--rowline:#f0ebe0;
  --accent:#1b2a4a;--onaccent:#fff;--good:#2f7d4f;--bad:#b4342d;--hibg:#1b2a4a;--hiborder:#1b2a4a;--hardbg:#fff;--thbg:#f6f2e9;--zebra:#fdfcf8;
  --fixbg:#fbf7ec;--codebg:#1b2a4a;--codefg:#f1dca7;--lv1:#a8322b;--lv2:#c8702a;--lv3:#d4a73a;--lv3t:#2e2200;--lv4:#3d7d5a;--lv5:#3d5f91;
  --c1:#1b2a4a;--c2:#b08d3c;--c3:#a8322b;--c4:#3d7d5a;--grid:#efe9dc;--track:#efe9dc;--empty:#f1ece1;--resolved:#a9adba;
  --s-lowest:#3d5f91;--s-low:#3d7d5a;--s-medium:#a07b1e;--s-high:#c8702a;--s-highest:#a8322b;
  --r:4px;--br:3px;--shadow:none;--font:"Open Sans","Segoe UI",system-ui,sans-serif;--hfont:Lora,Georgia,serif;--numfont:Lora,Georgia,serif;
  --ktt:uppercase;--kls:.1em;--tabfg:#7b8299;--tabon:transparent;--tabonfg:#1b2a4a;--header:#faf7f0;--headerline:#e8e2d4;--brandbg:#1b2a4a;--h3size:18px;--cardtop:#1b2a4a;
}
/* ===================== Base ===================== */
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
h1,h2,h3{font-family:var(--hfont);margin:0}
h3{font-size:var(--h3size);font-weight:600}
a{color:var(--accent)}
.wrap{max-width:__MAXWIDTH__px;margin:0 auto;padding:0 28px}
header{background:var(--header);border-bottom:1px solid var(--headerline)}
.top{display:flex;align-items:center;gap:14px;padding:18px 0 14px;flex-wrap:wrap}
.top>div:not(.right){min-width:0;flex:1 1 360px}
.top h1,.kicker,.meta{overflow-wrap:anywhere}
.themes{flex-wrap:wrap}
.brand{display:flex;align-items:center;justify-content:center;background:var(--brandbg);border-radius:10px;padding:8px 12px;min-height:42px;text-decoration:none;color:#fff;font-weight:700}
.brand img{height:24px;display:block}
.kicker{font-size:11px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.top h1{font-size:22px}
.meta{font-size:12px;color:var(--muted);margin-top:2px}
.right{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.themes{display:flex;gap:4px;background:var(--surface2);border:1px solid var(--border);padding:4px;border-radius:10px}
.themes button{font:inherit;font-size:12px;border:0;background:transparent;color:var(--muted);padding:6px 10px;border-radius:7px;cursor:pointer;display:flex;align-items:center;gap:6px}
.themes button i{width:12px;height:12px;border-radius:50%;display:inline-block;border:1px solid #0003}
.themes button.on{background:var(--accent);color:var(--onaccent);font-weight:600}
.langrow{display:flex;justify-content:flex-start;padding-top:12px}.langrow+.top{padding-top:10px}
.langs{display:inline-flex;gap:2px;background:var(--surface2);border:1px solid var(--border);padding:3px;border-radius:9px}
.langs button{font:inherit;font-size:11.5px;font-weight:700;letter-spacing:.04em;border:0;background:transparent;color:var(--muted);padding:4px 10px;border-radius:6px;cursor:pointer;transition:background .2s,color .2s}
.langs button.on{background:var(--accent);color:var(--onaccent)}
.langs button:not(.on):hover{color:var(--text)}
.pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pill{font-size:11.5px;color:var(--muted);border:1px solid var(--border);padding:3px 9px;border-radius:99px;white-space:nowrap}
.pill.good{color:var(--good);border-color:var(--good)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;padding-bottom:14px}
.tabs button{font:inherit;font-size:12.5px;padding:7px 13px;border-radius:var(--br);color:var(--tabfg);background:transparent;border:1px solid transparent;cursor:pointer}
.tabs button.on{background:var(--tabon);color:var(--tabonfg);font-weight:600}
.tabs button.hz{border:1px dashed var(--accent);color:var(--accent);margin-left:6px}
[data-theme="slate"] .tabs{background:#f3f4f6;display:inline-flex;padding:4px;border-radius:9px;margin-bottom:14px}
[data-theme="slate"] .tabs button.on{box-shadow:0 1px 3px rgba(0,0,0,.1)}
[data-theme="report"] .tabs button.on{border-bottom:2px solid #b08d3c;border-radius:0}
[data-theme="report"] .top{border-bottom:3px double #1b2a4a;margin-bottom:10px;padding-top:26px}
[data-theme="report"] .top h1{font-size:30px;font-weight:600}
[data-theme="report"] .kicker{color:#b08d3c;font-weight:700;letter-spacing:.22em}
main.wrap{padding-top:22px;padding-bottom:10px}
.pane{display:none}.pane.on{display:block}
.card{background:var(--surface);border:1px solid var(--border);border-top-color:var(--cardtop);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);margin-bottom:16px;min-width:0}
[data-theme="report"] .card{border-top-width:3px}
.c-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px;flex-wrap:wrap}
.tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;background:var(--accent);color:var(--onaccent);padding:2px 6px;border-radius:4px;vertical-align:middle;margin-left:4px}
[data-theme="report"] .tag{background:#b08d3c;color:#fff}
.note{color:var(--muted);font-size:13px;margin:-4px 0 12px;line-height:1.5}
.g{display:grid;gap:16px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}.g6{grid-template-columns:repeat(6,1fr)}
.g>.card{margin-bottom:0}.gwrap{margin-bottom:16px}
.g>*,.hz-grid>*,.qw-proj>*{min-width:0}.g-gr{grid-template-columns:1fr 1.2fr}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.kpi.hi{background:var(--hibg);border-color:var(--hiborder)}
[data-theme="report"] .kpi.hi,[data-theme="report"] .kpi.hi .k-v{color:#fff}
[data-theme="report"] .kpi.hi .k-t,[data-theme="report"] .kpi.hi .k-s,[data-theme="report"] .kpi.hi small{color:#c9cfdd}
[data-theme="report"] .kpi.hi .dn{color:#9ae6b4}[data-theme="report"] .kpi.hi .up{color:#fca5a5}
.k-t{font-size:12px;color:var(--muted);text-transform:var(--ktt);letter-spacing:var(--kls);font-weight:600}
.k-v{font-size:32px;font-weight:700;font-family:var(--numfont);margin:6px 0 4px;line-height:1}
.k-v small{font-size:14px;color:var(--muted);font-weight:500;margin-left:3px}
.k-s{font-size:12px;color:var(--muted);line-height:1.45}
.up{color:var(--bad);font-weight:600}.dn{color:var(--good);font-weight:600}.eq{color:var(--muted)}
.cs{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px 16px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow)}
.cs-v{font-size:22px;font-weight:700;font-family:var(--numfont);margin-right:auto}.cs-v small{font-size:12px;color:var(--muted)}.cs-d{font-size:12px}
.mini{padding:14px 16px}
.m-h{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--muted);font-weight:600}
.m-h b{font-size:20px;color:var(--text);font-family:var(--numfont)}.m-h b small{font-size:11px;color:var(--muted)}
.m-f{font-size:11.5px;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px}
.lg{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px}.lg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.gauges{display:grid;grid-template-columns:1fr 1fr;gap:22px 10px;justify-items:center;padding-top:6px}
.gauges.row{grid-template-columns:repeat(4,1fr)}
.gauge{text-align:center}.g-label{font-weight:600;margin-top:2px}.g-sub{font-size:11.5px;color:var(--muted);max-width:190px;margin:0 auto}
.lv{display:inline-block;min-width:26px;text-align:center;font-size:11px;font-weight:700;padding:2px 6px;border-radius:var(--br);color:#fff;background:var(--muted)}
.lv1{background:var(--lv1)}.lv2{background:var(--lv2)}.lv3{background:var(--lv3);color:var(--lv3t)}.lv4{background:var(--lv4)}.lv5{background:var(--lv5)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--mono);font-size:11.5px;border:1px solid var(--border);background:var(--surface2);padding:5px 9px;border-radius:99px;display:flex;align-items:center;gap:6px}
.chip .lv{min-width:20px;padding:1px 4px;font-size:10px}.chip em{color:var(--muted);font-style:normal;font-size:10.5px}
/* tables */
.tbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.tbar input{font:inherit;font-size:12.5px;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:6px 10px;min-width:0;width:220px;max-width:100%}
.tbar button,.btn{font:inherit;font-size:12px;background:transparent;color:var(--accent);border:1px solid var(--border);border-radius:8px;padding:6px 10px;cursor:pointer}
.tscroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--border);background:var(--thbg);cursor:pointer;white-space:nowrap;user-select:none}
th.s-asc:after{content:" ▲";font-size:9px}th.s-desc:after{content:" ▼";font-size:9px}
td{padding:8px 10px;border-bottom:1px solid var(--rowline);vertical-align:top}
tbody tr:nth-child(even) td{background:var(--zebra)}
td.num{font-weight:700;font-family:var(--numfont);white-space:nowrap}
td.rid{font-family:var(--mono);font-size:12px;white-space:nowrap;color:var(--accent)}
td.rat{color:var(--text2);min-width:220px}
td.fix{color:var(--text2);min-width:260px;font-size:12px;border-left:2px solid var(--accent);background:var(--fixbg)!important}
td.empty{background:var(--empty)!important}
tr.resolved td{color:var(--resolved)}tr.resolved td.rid{color:var(--resolved)}
td.c{text-align:center}
.sc{font-weight:700}.sc-lowest{color:var(--s-lowest)}.sc-low{color:var(--s-low)}.sc-medium{color:var(--s-medium)}.sc-high{color:var(--s-high)}.sc-highest{color:var(--s-highest)}
.new{font-size:9.5px;font-weight:800;background:var(--bad);color:#fff;padding:1px 5px;border-radius:3px;margin-left:5px;font-family:var(--font)}
.nodata{color:var(--muted);font-size:13px;padding:8px 0}
/* hardening */
.harden{border:1px solid var(--hiborder);background:var(--hardbg)}
[data-theme="report"] .harden{border-top:3px solid #b08d3c}
.hz-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.hz-grid.wide{grid-template-columns:repeat(2,1fr)}
.hz{background:var(--surface2);border:1px solid var(--border);border-radius:calc(var(--r) - 2px);padding:14px;display:flex;flex-direction:column}
.hz-h{display:flex;align-items:center;gap:7px;font-size:12.5px;flex-wrap:wrap}
.hz-h b{font-family:var(--mono);font-size:11.5px;word-break:break-all}
.hz-p{margin-left:auto;color:var(--good);font-weight:700;font-size:12px;white-space:nowrap}
.hz-n{width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--onaccent);display:grid;place-items:center;font-size:11px;font-weight:700;flex-shrink:0}
.hz .why{font-size:12px;color:var(--muted);margin:8px 0 0}
.hz p{font-size:12.5px;line-height:1.5;margin:8px 0 10px;color:var(--text2)}
.hz p.miss{color:var(--muted);font-style:italic}
.hz p,.hz .why,.qw-f,.qw-t,td.fix,td.rat,.note{overflow-wrap:anywhere}
.code{position:relative}
.code code{display:block;font-family:var(--mono);font-size:10.5px;background:var(--codebg);color:var(--codefg);padding:8px 9px;padding-right:46px;border-radius:6px;white-space:pre-wrap;word-break:break-all;line-height:1.45}
.code button{position:absolute;top:5px;right:5px;font:inherit;font-size:10px;background:#ffffff1a;color:var(--codefg);border:0;border-radius:4px;padding:2px 6px;cursor:pointer}
.hz-l{display:flex;gap:10px;margin-top:auto;padding-top:10px;font-size:11.5px;align-items:center;flex-wrap:wrap}
.hz-l a{text-decoration:none}
.hz-l label{color:var(--muted);margin-left:auto;cursor:pointer;display:flex;align-items:center;gap:5px}
.hz.done{opacity:.55}
.lvl-h{display:flex;align-items:center;gap:8px;margin:18px 0 10px;font-size:13px;color:var(--muted)}
/* report tab */
.info td:first-child{color:var(--muted);width:45%}
.pclogo{height:32px;margin:6px auto 14px;display:block}
.center{text-align:center}
.big{font-size:24px;font-weight:700;font-family:var(--numfont)}
.arrow{font-size:18px;margin-right:6px}
details>summary{cursor:pointer;list-style:none}details>summary::-webkit-details-marker{display:none}
details>summary h3:before{content:"▸ ";color:var(--muted)}details[open]>summary h3:before{content:"▾ "}
.posh{background:color-mix(in srgb,var(--good) 14%,transparent);padding:8px 12px;border-radius:8px;margin-bottom:10px;font-weight:600}
.negh{background:color-mix(in srgb,var(--bad) 14%,transparent);padding:8px 12px;border-radius:8px;margin-bottom:10px;font-weight:600}
footer{text-align:center;color:var(--muted);font-size:12px;padding:20px 0 34px;line-height:1.7}

/* ===================== Motion, depth & glow ===================== */
:root,[data-theme="midnight"]{--glow:1.5px;--glowa:28%;--lift:0 8px 22px -14px rgba(0,0,0,.7),0 0 0 1px rgba(34,211,238,.14);--depth:inset 0 1px 0 rgba(255,255,255,.05),0 8px 24px -16px rgba(0,0,0,.8);--tipbg:#0a1222ee;--tipfg:#e6ebf5}
[data-theme="slate"]{--glow:1px;--glowa:18%;--lift:0 10px 22px -14px rgba(16,24,40,.25),0 0 0 1px rgba(79,70,229,.1);--depth:inset 0 1px 0 #fff,0 6px 18px -14px rgba(16,24,40,.35);--tipbg:#111827f0;--tipfg:#fff}
[data-theme="report"]{--glow:0px;--glowa:0%;--lift:0 10px 24px -16px rgba(27,42,74,.45);--depth:0 4px 14px -12px rgba(27,42,74,.35);--tipbg:#1b2a4af2;--tipfg:#faf7f0}
.card,.kpi,.cs,.hz,.chip{transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .25s,background .25s}
.card,.kpi,.cs{box-shadow:var(--depth)}
.card:hover,.kpi:hover,.cs:hover{transform:translateY(-2px);box-shadow:var(--lift);border-color:color-mix(in srgb,var(--accent) 35%,var(--border))}
.hz:hover{transform:translateY(-2px);box-shadow:var(--lift)}
.chip:hover{transform:translateY(-1px);border-color:var(--accent)}
tbody tr td{transition:background .15s}
tbody tr:hover td{background:color-mix(in srgb,var(--accent) 9%,var(--surface))!important}
.tabs button,.themes button,.btn,.tbar button{transition:background .2s,color .2s,transform .15s,box-shadow .2s}
.tabs button:hover{color:var(--text);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.tabs button:active,.themes button:active{transform:scale(.96)}
.themes button.on{box-shadow:none}
.brand{transition:transform .3s,box-shadow .3s}.brand:hover{transform:scale(1.03)}
/* charts */
svg .ln{filter:drop-shadow(0 0 var(--glow) color-mix(in srgb,var(--gc) var(--glowa),transparent)) drop-shadow(0 2px 1.5px rgba(0,0,0,.12));stroke-dasharray:1;stroke-dashoffset:0}
svg .pt{transition:r .18s,stroke-width .18s;cursor:pointer}
svg .pt:hover{r:5.5;stroke-width:2.5}
svg .ga{filter:drop-shadow(0 0 var(--glow) color-mix(in srgb,var(--gc) var(--glowa),transparent));stroke-dasharray:1;cursor:pointer}
.gsvg{width:170px;max-width:100%;overflow:visible}
svg.donut{display:block;margin:0 auto;max-width:100%;overflow:visible}
svg .seg{transition:stroke-width .2s;cursor:pointer}
svg .seg:hover{stroke-width:28}
svg .barg{cursor:pointer;transition:filter .2s}
svg .barg .bar{filter:drop-shadow(0 3px 3px rgba(0,0,0,.16))}
svg .barg:hover{filter:brightness(1.08)}
#tip{position:fixed;z-index:100;pointer-events:none;background:var(--tipbg);color:var(--tipfg);font-size:12px;line-height:1.45;padding:7px 10px;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.3);opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;backdrop-filter:blur(6px);white-space:nowrap}
#tip.on{opacity:1;transform:none}
/* entry animations (replayed on every tab change) */
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;r:0}to{opacity:1}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes spin{from{opacity:0;transform:rotate(-120deg) scale(.8)}to{opacity:1;transform:none}}
.anim .card,.anim .kpi,.anim .cs{animation:rise .55s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:var(--d,0s)}
.anim svg .ln{animation:draw 1.2s cubic-bezier(.4,0,.2,1) backwards;animation-delay:calc(var(--d,0s) + .15s)}
.anim svg .ar{animation:fadein 1s ease both;animation-delay:calc(var(--d,0s) + .5s)}
.anim svg .pt{animation:fadein .4s ease both}

    var eCols = [{ title: t('Level'), key: 'Level', html: function (v) { return badge(v); } }, { title: t('Category'), key: 'Category' }, { title: t('Model'), key: 'Model' }, { title: 'RiskId', key: 'RiskId', cls: 'rid' }, { title: t('Rationale'), key: 'Rationale', cls: 'rat' }]
      .concat(revDates.map(function (r) { return { title: esc(r.Label), key: 'd:' + r.Label, cls: function (v) { return v === '' ? 'empty c' : 'num c'; } }; }));
    h += '<div class="card"><div class="c-h"><h3>' + t('Risk rules evolution') + '</h3><span class="pill">' + t('grey rows are solved in the last report') + '</span></div>' + table(eCols, evo, { sort: 0, rowClass: function (r) { return r['d:' + last.Label] === '' ? 'resolved' : ''; } }) + '</div>';
    return h;
  }

  // ---------- one tab per report ----------
  function reportTab(idx) {
    var cur = R[idx], prev = idx > 0 ? R[idx - 1] : null, h = '';
    var prevIds = prev ? ids(prev) : {}, curIds = ids(cur);
    var solved = prev ? prev.RiskRules.filter(function (x) { return !curIds[x.RiskId]; }).map(function (x) { return allRules[x.RiskId]; }) : [];
    var newer = prev ? cur.RiskRules.filter(function (x) { return !prevIds[x.RiskId]; }).map(function (x) { return allRules[x.RiskId]; }) : [];
    // report & domain info
    var info = [[t('PingCastle version'), cur.Version], [t('Generated on'), cur.LongDate], [t('Report age'), f('{0} day(s)', cur.AgeDays)], [t('Domain maturity'), cur.Maturity], [t('Domain mode'), cur.DomainMode], [t('Forest mode'), cur.ForestMode]];
    h += '<div class="g g3 gwrap"><div class="card"><div class="c-h"><h3>' + t('Report information') + '</h3></div><img class="pclogo" src="' + esc(D.pcLogo) + '" alt="PingCastle logo" onerror="this.style.display=\'none\'"><table class="info"><tbody>' + info.map(function (i) { return '<tr><td>' + i[0] + '</td><td><b>' + esc(i[1]) + '</b></td></tr>'; }).join('') + '</tbody></table></div>' +
      '<div class="card center"><div class="c-h"><h3>' + t('Global score') + '</h3></div>' + gauge(cur.Scores.Global, t('Global score'), t('The worst score out of the four items')) + '</div>' +
      '<div class="card"><div class="c-h"><h3>' + t('Rules per criticity') + '</h3></div>' + donut(LV.map(function (l) { return { v: critCount(cur, l), col: 'var(--lv' + l + ')', name: t('Criticity') + ' ' + l }; })) + legend(LV.map(function (l) { return [t('Criticity') + ' ' + l + ' (' + critCount(cur, l) + ')', 'var(--lv' + l + ')']; })) + '</div></div>';
    // total + criticity points
    h += '<div class="g g6 gwrap"><div class="kpi hi center"><div class="k-t">' + t('Total score') + '</div><div class="k-v">' + arrow(tot(cur), prev ? tot(prev) : null) + tot(cur) + '<small>pt(s)</small></div></div>' +
      LV.map(function (l) { return '<div class="kpi center"><div class="k-t">' + badge(l) + ' ' + t('Criticity') + ' ' + l + '</div><div class="k-v">' + arrow(critPts(cur, l), prev ? critPts(prev, l) : null) + critPts(cur, l) + '<small>pt(s)</small></div></div>'; }).join('') + '</div>';
    // per model
    var models = {}; cur.RiskRules.forEach(function (x) { var m = models[x.Model] || (models[x.Model] = { Category: x.Category, Model: x.Model, Points: 0, Count: 0 }); m.Points += x.Points; m.Count++; });
    var perModel = Object.keys(models).map(function (k) { return models[k]; }).filter(function (m) { return m.Points !== 0; }).sort(function (a, b) { return b.Points - a.Points; });
    var pal = ['var(--lv1)', 'var(--c1)', 'var(--c2)', 'var(--lv3)', 'var(--c3)', 'var(--lv4)', 'var(--lv5)', 'var(--c4)', 'var(--lv2)', 'var(--muted)'];
    h += '<details class="card"><summary class="c-h"><h3>' + t('Scores per model') + '</h3><span class="pill">' + f('{0} models', perModel.length) + '</span></summary><div class="g g2" style="margin-top:12px"><div>' +
      table([{ title: t('Category'), key: 'Category' }, { title: t('Model'), key: 'Model' }, { title: t('Points'), key: 'Points', cls: 'num' }, { title: t('Count'), key: 'Count' }], perModel, { tools: false }) + '</div><div>' +
      donut(perModel.map(function (m, i) { return { v: m.Points, col: pal[i % pal.length], name: m.Model }; }), 200) + legend(perModel.map(function (m, i) { return [m.Model + ' (' + m.Points + ')', pal[i % pal.length]]; })) + '</div></div></details>';
    // 4 scores
    h += '<div class="card"><div class="c-h"><h3>' + t('Scores') + '</h3><span class="pill">' + t('capped 0 to 100, lower is better') + '</span></div><div class="gauges row">' + CATS.map(function (c) { return gauge(cur.Scores[c.score], t(c.label), t(c.sub)); }).join('') + '</div></div>';
    // comparison
    h += '<div class="card"><div class="c-h"><h3>' + t('Comparison with previous reports') + '</h3></div><p class="note">' + t('The evolution of the uncapped score in each category. The score may vary from the normal PingCastle score (capped to 100), as some rules can be ignored using the exceptions.csv file. The list of ignored risk rules is available at the bottom of the page.') + '</p><div class="g g4">' +
      CATS.map(function (c) {
        var it = [];
        if (idx > 1) it.push({ name: t('Initial'), v: catPts(R[0], c.key), col: 'var(--muted)' });
        if (idx > 0) it.push({ name: t('Previous'), v: catPts(prev, c.key), col: 'color-mix(in srgb,' + c.col + ' 55%,transparent)' });

        return '<div><div class="m-h" style="margin-bottom:6px"><span>' + t(c.label) + '</span></div>' + bars(it) + '</div>';
      }).join('') + '</div></div>';
    // improvement & deterioration
    h += '<div class="g g2 gwrap"><div class="card"><div class="posh">✓ ' + t('Risk rules resolved') + '</div>' + table(RULECOLS(false), solved, { sort: 1, tools: false }) + '</div>' +
      '<div class="card"><div class="negh">⚠ ' + t('New risk rules triggered') + '</div>' + table(RULECOLS(true), newer, { sort: 1, tools: false }) + '</div></div>';
    // all current
    var rows = cur.RiskRules.map(function (x) { var o = Object.assign({}, x); o._new = prev && !prevIds[x.RiskId]; return o; });
    h += '<div class="card"><div class="c-h"><h3>' + t('All current risk rules') + '</h3><span class="pill">' + f('{0} rules', rows.length) + '</span></div>' + table(RULECOLS(true), rows, { sort: 1 }) + '</div>';
    if (cur.IgnoredRiskRules.length) h += '<div class="card"><div class="c-h"><h3>' + t('Ignored risk rules') + '</h3></div><p class="note">' + t('The following rules have been excluded from the calculated scores using the "exceptions.csv" file.') + '</p>' + table(RULECOLS(false), cur.IgnoredRiskRules, { sort: 1, tools: false }) + '</div>';
    return h;
  }

  // ---------- hardening guide tab ----------
  function guide() {
    var rules = byPriority(last.RiskRules), h = '';
    var covered = rules.filter(function (x) { return HD[x.RiskId] && fixText(HD[x.RiskId]); }).length;
    h += qwCard(last, 0);
    h += '<div class="card harden"><div class="c-h"><h3>' + t('🛡️ Hardening guide') + ' · ' + esc(last.Label) + ' <span class="tag">' + t('new') + '</span></h3><span class="pill">' + f('{0} rules · {1} with a fix text', rules.length, covered) + '</span></div>' +
      '<p class="note">' + t('All risk rules of the last report, most critical first. Run the PowerShell check, apply the fix, then tick "Planned" to track your work (saved in this browser only). Fix texts come from data\\hardening.csv (checked against the PingCastle rule code and current Microsoft docs), so you can edit or translate them.') + '</p>';
    LV.concat([null]).forEach(function (l) {
      var g = rules.filter(function (x) { return x.Level === l; }); if (!g.length) return;
      h += '<div class="lvl-h">' + badge(l) + ' <b style="color:var(--text)">' + (l ? t('Criticity') + ' ' + l : t('No criticity level')) + '</b> · ' + f('{0} rule(s)', g.length) + ' · ' + sum(g.map(function (x) { return x.Points; })) + ' pts</div>';
      h += '<div class="hz-grid wide">' + g.map(function (x) { return hzCard(x, 0, true); }).join('') + '</div>';
    });
    return h + '</div>';
  }

  // ---------- layout ----------
  var THEMES = [['midnight', 'Midnight', '#0b1020'], ['slate', 'Slate', '#f5f6fa'], ['report', 'Report', '#faf7f0']];
  var tabs = [{ id: 'home', name: '⌂ Home', fn: home }].concat(R.map(function (r, i) { return { id: 'r' + i, name: r.Label, fn: function () { return reportTab(i); } }; })).concat([{ id: 'guide', name: '🛡 Hardening guide', fn: guide, cls: 'hz' }]);
  var logo = D.logo ? '<img src="' + esc(D.logo) + '" alt="' + esc(D.author) + '" onerror="this.replaceWith(document.createTextNode(this.alt))">' : esc(D.author);
  function renderShell() {
  document.documentElement.lang = LANG;
  document.getElementById('app').innerHTML =
    '<header><div class="wrap"><div class="langrow"><div class="langs" role="group" aria-label="Language"><button data-lang="en"' + (LANG === 'en' ? ' class="on"' : '') + '>EN</button><button data-lang="fr"' + (LANG === 'fr' ? ' class="on"' : '') + '>FR</button></div></div><div class="top">' +
    '<a class="brand" href="' + esc(D.uri) + '" target="_blank" rel="noopener">' + logo + '</a>' +
    '<div><div class="kicker">' + t('PingCastle dashboard · Active Directory security review') + '</div><h1>' + esc(D.domain) + '</h1>' +
    '<div class="meta">' + f('{0} healthcheck(s)', R.length) + ' · ' + esc(first.Label) + ' → ' + esc(last.Label) + ' · ' + t('Engine') + ' ' + esc(last.Version) + '</div></div>' +
    '<div class="right"><div class="themes" role="group" aria-label="Theme">' + THEMES.map(function (x) { return '<button data-theme-btn="' + x[0] + '"><i style="background:' + x[2] + '"></i>' + t(x[1]) + '</button>'; }).join('') + '</div>' +
    '<div class="pills"><span class="pill">' + esc(last.DomainMode) + '</span><span class="pill">' + f('Last scan {0}', esc(last.Label)) + '</span></div></div></div>' +
    '<nav class="tabs">' + tabs.map(function (x) { return '<button data-tab="' + x.id + '" class="' + (x.cls || '') + '">' + esc(t(x.name)) + '</button>'; }).join('') + '</nav></div></header>' +
    '<main class="wrap">' + tabs.map(function (x) { return '<section class="pane" id="pane-' + x.id + '"></section>'; }).join('') + '</main>' +
    '<footer class="wrap">' + t('Made with ❤️ by METSYS') + ' · ' + t('Updated by') + ' <a href="https://github.com/karim852" target="_blank" rel="noopener">k0r1m</a> · ' + t('Powered by PingCastle') + '<br>' + f('Generated on {0} by {1}', esc(D.generatedAt), esc(D.author)) + '</footer>';
  }


  // ---------- motion helpers ----------
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function countUp(root) {
    if (reduce) return;
    root.querySelectorAll('.k-v,.cs-v,.m-h b,.big,text.cnt').forEach(function (el) {
      var node = null;
      for (var i = 0; i < el.childNodes.length; i++) { var c = el.childNodes[i]; if (c.nodeType === 3 && /^\s*\d+\s*$/.test(c.nodeValue)) { node = c; break; } }
      if (!node) return;
      var to = +node.nodeValue.trim(), t0 = null, dur = 900;
      if (!to) return;
      node.nodeValue = '0';
      var step = function (ts) { if (!t0) t0 = ts; var k = Math.min((ts - t0) / dur, 1), e = 1 - Math.pow(1 - k, 3); node.nodeValue = String(Math.round(to * e)); if (k < 1) requestAnimationFrame(step); };
      requestAnimationFrame(step);
    });
  }
  // redraw line charts at their real pixel size: text stays the same size, the chart grows with its window
  function refreshCharts(root) {
    root.querySelectorAll('.chart').forEach(function (el) {
      var C = CHARTS[el.getAttribute('data-chart')], W = Math.floor(el.clientWidth); if (!C || W < 50) return;
      var max = el.closest('.card.max'), h, room = Math.floor(el.clientHeight);
      if (C.type === 'bars') {
        h = max && room > 120 ? room : Math.round(Math.min(Math.max(W * 0.6, 170), 240));
        el.innerHTML = barsSvg(C.items, W, h, max ? 13 : 11); return;
      }
      if (max && room > 120) h = room;
      else if (C.o.axis === false) h = C.o.h || 70;
      else h = Math.round(Math.min(Math.max(W * 0.37, 190), 300));
      var o2 = Object.assign({}, C.o, { w: W, h: h, fs: max ? 12.5 : 10.5 });
      if (max && C.o.axis === false) { o2.axis = true; o2.dots = true; }
      el.innerHTML = lineSvg(C.series, o2);
    });
  }
  function animatePane(pane) {
    if (!pane || reduce) return;
    pane.classList.remove('anim'); void pane.offsetWidth;
    var i = 0;
    pane.querySelectorAll('.card,.kpi,.cs').forEach(function (el) { if (el.closest('.card') !== el && el.closest('.card')) return; el.style.setProperty('--d', Math.min(i++ * 0.045, 0.6).toFixed(3) + 's'); });
    pane.classList.add('anim');
    countUp(pane);
  }
  function addExpand(root) {
    root.querySelectorAll('.card').forEach(function (card) {
      if (card.querySelector(':scope > .c-h .xbtn, :scope > summary .xbtn, :scope > .m-h .xbtn')) return;
      var head = card.querySelector(':scope > .c-h, :scope > summary.c-h, :scope > .m-h');
      var b = document.createElement('button'); b.className = 'xbtn'; b.type = 'button'; b.title = t('Expand'); b.setAttribute('data-expand', ''); b.textContent = '⤢';
      if (head) {
        var pill = head.querySelector(':scope > .pill');
        var w = document.createElement('span'); w.className = 'xwrap';
        if (head.classList.contains('m-h')) { var bb = head.querySelector(':scope > b'); w.style.marginLeft = 'auto'; if (bb) w.appendChild(bb); w.appendChild(b); head.appendChild(w); }
        else { if (pill) w.appendChild(pill); w.appendChild(b); head.appendChild(w); }
      } else { b.style.cssText = 'position:absolute;top:12px;right:12px'; card.classList.add('xrel'); card.appendChild(b); }
    });
  }
  var maxCard = null, ph = null;
  function toggleMax(card) {
    var veil = document.getElementById('veil');
    if (maxCard) {
      maxCard.classList.remove('max'); var btn = maxCard.querySelector('[data-expand]'); if (btn) { btn.textContent = '⤢'; btn.title = t('Expand'); }
      if (ph) ph.remove(); ph = null; veil.classList.remove('on'); document.body.classList.remove('has-max');
      var was = maxCard; maxCard = null; was.classList.remove('anim'); refreshCharts(was); if (was === card) return;
    }
    if (!card) return;
    if (card.tagName === 'DETAILS') card.open = true;
    ph = document.createElement('div'); ph.className = 'ph'; ph.style.height = card.offsetHeight + 'px'; ph.style.marginBottom = getComputedStyle(card).marginBottom;
    card.parentNode.insertBefore(ph, card);
    card.classList.add('max'); maxCard = card; veil.classList.add('on'); document.body.classList.add('has-max');
    var b = card.querySelector('[data-expand]'); if (b) { b.textContent = '✕'; b.title = t('Close (Esc)'); }
    if (!reduce) { card.classList.remove('anim'); void card.offsetWidth; card.classList.add('anim'); }
    refreshCharts(card); if (!reduce) countUp(card);
  }
  // tooltip
  var tip = document.createElement('div'); tip.id = 'tip'; document.body.appendChild(tip);
  var veilEl = document.createElement('div'); veilEl.id = 'veil'; document.body.appendChild(veilEl);
  veilEl.addEventListener('click', function () { toggleMax(null); });
  var rz = null;
  window.addEventListener('resize', function () { clearTimeout(rz); rz = setTimeout(function () { var p = document.querySelector('.pane.on'); if (!p) return; p.classList.remove('anim'); if (maxCard) maxCard.classList.remove('anim'); refreshCharts(p); }, 120); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && maxCard) toggleMax(null); });
  document.addEventListener('mousemove', function (e) {
    var t = e.target.closest && e.target.closest('[data-tip]');
    if (!t) { tip.classList.remove('on'); return; }
    tip.innerHTML = t.getAttribute('data-tip'); tip.classList.add('on');
    var x = e.clientX + 14, y = e.clientY + 14, r = tip.getBoundingClientRect();
    if (x + r.width > window.innerWidth - 8) x = e.clientX - r.width - 14;
    if (y + r.height > window.innerHeight - 8) y = e.clientY - r.height - 14;
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  });
  var built = {}, current = 'home';
  function showTab(id) {
    var tb = tabs.filter(function (x) { return x.id === id; })[0] || tabs[0]; current = tb.id;
    if (!built[tb.id]) {
      var before = uid, pane = document.getElementById('pane-' + tb.id);
      pane.innerHTML = tb.fn();
      Object.keys(TABLES).forEach(function (k) { if (+k.slice(1) > before) drawTable(k); });
      addExpand(pane);
      built[tb.id] = 1;
    }
    document.querySelectorAll('.pane').forEach(function (p) { p.classList.toggle('on', p.id === 'pane-' + tb.id); });
    refreshCharts(document.getElementById('pane-' + tb.id));
    animatePane(document.getElementById('pane-' + tb.id));
    document.querySelectorAll('[data-tab]').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-tab') === tb.id); });
  }
  function setLang(l) {
    LANG = l === 'fr' ? 'fr' : 'en'; store.set('pcd-lang', LANG);
    if (maxCard) toggleMax(null);
    renderShell(); built = {}; TABLES = {};
    setTheme(document.documentElement.getAttribute('data-theme') || D.theme || 'midnight');
    showTab(current);
  }
  function setTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    document.querySelectorAll('[data-theme-btn]').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-theme-btn') === t); });
    store.set('pcd-theme', t);
  }

  document.addEventListener('click', function (e) {
    var xb = e.target.closest('[data-expand]'); if (xb) { e.preventDefault(); e.stopPropagation(); toggleMax(xb.closest('.card')); return; }
    var b = e.target.closest('[data-tab]'); if (b) { if (maxCard) toggleMax(null); showTab(b.getAttribute('data-tab')); window.scrollTo(0, 0); return; }
    var th = e.target.closest('[data-theme-btn]'); if (th) { setTheme(th.getAttribute('data-theme-btn')); return; }
    var lb = e.target.closest('[data-lang]'); if (lb) { if (lb.getAttribute('data-lang') !== LANG) setLang(lb.getAttribute('data-lang')); return; }
    var hd = e.target.closest('th[data-i]');
    if (hd) { var id = hd.closest('table').id, T = TABLES[id], i = +hd.getAttribute('data-i'); T.dir = T.sort === i ? -T.dir : 1; T.sort = i; drawTable(id); return; }
    var cv = e.target.closest('[data-csv]'); if (cv) { exportCsv(cv.getAttribute('data-csv')); return; }
    var cp = e.target.closest('[data-copy]');
    if (cp) { var txt = cp.getAttribute('data-copy'); try { navigator.clipboard.writeText(txt); var old = cp.getAttribute('data-label') || cp.textContent; cp.setAttribute('data-label', old); cp.textContent = t('Copied ✓'); } catch (err) { } setTimeout(function () { cp.textContent = cp.getAttribute('data-label') || t('Copy'); }, 1200); }
  });
  document.addEventListener('input', function (e) { var id = e.target.getAttribute && e.target.getAttribute('data-t'); if (id) { TABLES[id].q = e.target.value; drawTable(id); } });
  document.addEventListener('change', function (e) {
    var rid = e.target.getAttribute && e.target.getAttribute('data-plan');
    if (rid) {
      store.set(planKey(rid), e.target.checked ? '1' : '0');
      document.querySelectorAll('[data-plan="' + rid.replace(/"/g, '\\"') + '"]').forEach(function (c) { c.checked = e.target.checked; var box = c.closest('.hz,.qw-row'); if (box) box.classList.toggle('done', e.target.checked); });
    }
  });

  var savedLang = store.get('pcd-lang');
  LANG = savedLang === 'fr' || savedLang === 'en' ? savedLang : (D.lang === 'fr' ? 'fr' : 'en');
  renderShell();
  var saved = store.get('pcd-theme');
  setTheme(THEMES.some(function (x) { return x[0] === saved; }) ? saved : (D.theme || 'midnight'));
  showTab('home');
})();
