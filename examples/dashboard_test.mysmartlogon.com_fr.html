<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>test.mysmartlogon.com - PingCastle dashboard</title>
<style>
/* ===================== Themes ===================== */
:root,[data-theme="midnight"]{
  --bg:#0b1020;--surface:#121a2e;--surface2:#0f1627;--text:#e6ebf5;--text2:#b7c0d4;--muted:#7f8aa3;--border:#1f2a44;--rowline:#1a233a;
  --accent:#22d3ee;--onaccent:#05222a;--good:#34d399;--bad:#fb7185;--hibg:linear-gradient(135deg,#0e2a3a,#121a2e);--hiborder:#155e75;
  --hardbg:linear-gradient(180deg,#0f2233,#121a2e);--thbg:#0f1627;--zebra:#10182b;--fixbg:#0e1f2c;--codebg:#070b16;--codefg:#7dd3fc;
  --lv1:#f43f5e;--lv2:#f97316;--lv3:#facc15;--lv3t:#1a1400;--lv4:#10b981;--lv5:#3b82f6;
  --c1:#22d3ee;--c2:#a78bfa;--c3:#fbbf24;--c4:#34d399;--grid:#1f2a44;--track:#1f2a44;--empty:#1b2438;--resolved:#5b6580;
  --s-lowest:#22d3ee;--s-low:#34d399;--s-medium:#facc15;--s-high:#fb923c;--s-highest:#f43f5e;
  --r:14px;--br:6px;--shadow:0 1px 0 #ffffff08 inset;--font:Inter,"Segoe UI",system-ui,sans-serif;--hfont:var(--font);--numfont:var(--font);
  --mono:"Cascadia Code",Consolas,"DejaVu Sans Mono",monospace;--ktt:uppercase;--kls:.06em;--tabfg:#9aa5bd;--tabon:#22d3ee1f;--tabonfg:#67e8f9;
  --header:linear-gradient(90deg,#0b1020,#101b33 60%,#0b2a3a);--headerline:#1f2a44;--brandbg:linear-gradient(135deg,#22d3ee,#6366f1);--h3size:15px;--cardtop:var(--border);
}
[data-theme="slate"]{
  --bg:#f5f6fa;--surface:#ffffff;--surface2:#f8f9fc;--text:#111827;--text2:#374151;--muted:#6b7280;--border:#e5e7eb;--rowline:#f0f1f4;
  --accent:#4f46e5;--onaccent:#fff;--good:#059669;--bad:#dc2626;--hibg:#eef2ff;--hiborder:#c7d2fe;--hardbg:#fff;--thbg:#f9fafb;--zebra:#fcfcfd;
  --fixbg:#f5f7ff;--codebg:#0f172a;--codefg:#c7d2fe;--lv1:#dc2626;--lv2:#ea580c;--lv3:#eab308;--lv3t:#3b2f00;--lv4:#16a34a;--lv5:#2563eb;
  --c1:#4f46e5;--c2:#db2777;--c3:#d97706;--c4:#0891b2;--grid:#eef0f4;--track:#eef0f4;--empty:#eceef2;--resolved:#a3a9b5;
  --s-lowest:#0891b2;--s-low:#15803d;--s-medium:#b8860b;--s-high:#ea580c;--s-highest:#b91c1c;
  --r:12px;--br:6px;--shadow:0 1px 2px rgba(16,24,40,.05);--font:"DM Sans",Inter,"Segoe UI",system-ui,sans-serif;--hfont:var(--font);--numfont:var(--font);
  --ktt:none;--kls:0;--tabfg:#4b5563;--tabon:#fff;--tabonfg:#4f46e5;--header:#fff;--headerline:#e5e7eb;--brandbg:#4f46e5;--h3size:15px;--cardtop:var(--border);
}
[data-theme="report"]{
  --bg:#faf7f0;--surface:#fff;--surface2:#fbf9f4;--text:#1b2a4a;--text2:#3a4663;--muted:#7b8299;--border:#e8e2d4;--rowline:#f0ebe0;
  --accent:#1b2a4a;--onaccent:#fff;--good:#2f7d4f;--bad:#b4342d;--hibg:#1b2a4a;--hiborder:#1b2a4a;--hardbg:#fff;--thbg:#f6f2e9;--zebra:#fdfcf8;
  --fixbg:#fbf7ec;--codebg:#1b2a4a;--codefg:#f1dca7;--lv1:#a8322b;--lv2:#c8702a;--lv3:#d4a73a;--lv3t:#2e2200;--lv4:#3d7d5a;--lv5:#3d5f91;
  --c1:#1b2a4a;--c2:#b08d3c;--c3:#a8322b;--c4:#3d7d5a;--grid:#efe9dc;--track:#efe9dc;--empty:#f1ece1;--resolved:#a9adba;
  --s-lowest:#3d5f91;--s-low:#3d7d5a;--s-medium:#a07b1e;--s-high:#c8702a;--s-highest:#a8322b;
  --r:4px;--br:3px;--shadow:none;--font:"Open Sans","Segoe UI",system-ui,sans-serif;--hfont:Lora,Georgia,serif;--numfont:Lora,Georgia,serif;
  --ktt:uppercase;--kls:.1em;--tabfg:#7b8299;--tabon:transparent;--tabonfg:#1b2a4a;--header:#faf7f0;--headerline:#e8e2d4;--brandbg:#1b2a4a;--h3size:18px;--cardtop:#1b2a4a;
}
/* ===================== Base ===================== */
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
h1,h2,h3{font-family:var(--hfont);margin:0}
h3{font-size:var(--h3size);font-weight:600}
a{color:var(--accent)}
.wrap{max-width:1400px;margin:0 auto;padding:0 28px}
header{background:var(--header);border-bottom:1px solid var(--headerline)}
.top{display:flex;align-items:center;gap:14px;padding:18px 0 14px;flex-wrap:wrap}
.top>div:not(.right){min-width:0;flex:1 1 360px}
.top h1,.kicker,.meta{overflow-wrap:anywhere}
.themes{flex-wrap:wrap}
.brand{display:flex;align-items:center;justify-content:center;background:var(--brandbg);border-radius:10px;padding:8px 12px;min-height:42px;text-decoration:none;color:#fff;font-weight:700}
.brand img{height:24px;display:block}
.kicker{font-size:11px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.top h1{font-size:22px}
.meta{font-size:12px;color:var(--muted);margin-top:2px}
.right{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.themes{display:flex;gap:4px;background:var(--surface2);border:1px solid var(--border);padding:4px;border-radius:10px}
.themes button{font:inherit;font-size:12px;border:0;background:transparent;color:var(--muted);padding:6px 10px;border-radius:7px;cursor:pointer;display:flex;align-items:center;gap:6px}
.themes button i{width:12px;height:12px;border-radius:50%;display:inline-block;border:1px solid #0003}
.themes button.on{background:var(--accent);color:var(--onaccent);font-weight:600}
.langrow{display:flex;justify-content:flex-start;padding-top:12px}.langrow+.top{padding-top:10px}
.langs{display:inline-flex;gap:2px;background:var(--surface2);border:1px solid var(--border);padding:3px;border-radius:9px}
.langs button{font:inherit;font-size:11.5px;font-weight:700;letter-spacing:.04em;border:0;background:transparent;color:var(--muted);padding:4px 10px;border-radius:6px;cursor:pointer;transition:background .2s,color .2s}
.langs button.on{background:var(--accent);color:var(--onaccent)}
.langs button:not(.on):hover{color:var(--text)}
.pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pill{font-size:11.5px;color:var(--muted);border:1px solid var(--border);padding:3px 9px;border-radius:99px;white-space:nowrap}
.pill.good{color:var(--good);border-color:var(--good)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;padding-bottom:14px}
.tabs button{font:inherit;font-size:12.5px;padding:7px 13px;border-radius:var(--br);color:var(--tabfg);background:transparent;border:1px solid transparent;cursor:pointer}
.tabs button.on{background:var(--tabon);color:var(--tabonfg);font-weight:600}
.tabs button.hz{border:1px dashed var(--accent);color:var(--accent);margin-left:6px}
[data-theme="slate"] .tabs{background:#f3f4f6;display:inline-flex;padding:4px;border-radius:9px;margin-bottom:14px}
[data-theme="slate"] .tabs button.on{box-shadow:0 1px 3px rgba(0,0,0,.1)}
[data-theme="report"] .tabs button.on{border-bottom:2px solid #b08d3c;border-radius:0}
[data-theme="report"] .top{border-bottom:3px double #1b2a4a;margin-bottom:10px;padding-top:26px}
[data-theme="report"] .top h1{font-size:30px;font-weight:600}
[data-theme="report"] .kicker{color:#b08d3c;font-weight:700;letter-spacing:.22em}
main.wrap{padding-top:22px;padding-bottom:10px}
.pane{display:none}.pane.on{display:block}
.card{background:var(--surface);border:1px solid var(--border);border-top-color:var(--cardtop);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);margin-bottom:16px;min-width:0}
[data-theme="report"] .card{border-top-width:3px}
.c-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px;flex-wrap:wrap}
.tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;background:var(--accent);color:var(--onaccent);padding:2px 6px;border-radius:4px;vertical-align:middle;margin-left:4px}
[data-theme="report"] .tag{background:#b08d3c;color:#fff}
.note{color:var(--muted);font-size:13px;margin:-4px 0 12px;line-height:1.5}
.g{display:grid;gap:16px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}.g6{grid-template-columns:repeat(6,1fr)}
.g>.card{margin-bottom:0}.gwrap{margin-bottom:16px}
.g>*,.hz-grid>*,.qw-proj>*{min-width:0}.g-gr{grid-template-columns:1fr 1.2fr}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.kpi.hi{background:var(--hibg);border-color:var(--hiborder)}
[data-theme="report"] .kpi.hi,[data-theme="report"] .kpi.hi .k-v{color:#fff}
[data-theme="report"] .kpi.hi .k-t,[data-theme="report"] .kpi.hi .k-s,[data-theme="report"] .kpi.hi small{color:#c9cfdd}
[data-theme="report"] .kpi.hi .dn{color:#9ae6b4}[data-theme="report"] .kpi.hi .up{color:#fca5a5}
.k-t{font-size:12px;color:var(--muted);text-transform:var(--ktt);letter-spacing:var(--kls);font-weight:600}
.k-v{font-size:32px;font-weight:700;font-family:var(--numfont);margin:6px 0 4px;line-height:1}
.k-v small{font-size:14px;color:var(--muted);font-weight:500;margin-left:3px}
.k-s{font-size:12px;color:var(--muted);line-height:1.45}
.up{color:var(--bad);font-weight:600}.dn{color:var(--good);font-weight:600}.eq{color:var(--muted)}
.cs{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px 16px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow)}
.cs-v{font-size:22px;font-weight:700;font-family:var(--numfont);margin-right:auto}.cs-v small{font-size:12px;color:var(--muted)}.cs-d{font-size:12px}
.mini{padding:14px 16px}
.m-h{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--muted);font-weight:600}
.m-h b{font-size:20px;color:var(--text);font-family:var(--numfont)}.m-h b small{font-size:11px;color:var(--muted)}
.m-f{font-size:11.5px;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px}
.lg{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px}.lg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.gauges{display:grid;grid-template-columns:1fr 1fr;gap:22px 10px;justify-items:stretch;padding-top:6px}
.gauges.row{grid-template-columns:repeat(4,1fr)}
.gauge{text-align:center}.g-label{font-weight:600;margin-top:2px}.g-sub{font-size:11.5px;color:var(--muted);max-width:190px;margin:0 auto}
.lv{display:inline-block;min-width:26px;text-align:center;font-size:11px;font-weight:700;padding:2px 6px;border-radius:var(--br);color:#fff;background:var(--muted)}
.lv1{background:var(--lv1)}.lv2{background:var(--lv2)}.lv3{background:var(--lv3);color:var(--lv3t)}.lv4{background:var(--lv4)}.lv5{background:var(--lv5)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--mono);font-size:11.5px;border:1px solid var(--border);background:var(--surface2);padding:5px 9px;border-radius:99px;display:flex;align-items:center;gap:6px}
.chip .lv{min-width:20px;padding:1px 4px;font-size:10px}.chip em{color:var(--muted);font-style:normal;font-size:10.5px}
/* tables */
.tbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.tbar input{font:inherit;font-size:12.5px;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:6px 10px;min-width:0;width:220px;max-width:100%}
.tbar button,.btn{font:inherit;font-size:12px;background:transparent;color:var(--accent);border:1px solid var(--border);border-radius:8px;padding:6px 10px;cursor:pointer}
.tscroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--border);background:var(--thbg);cursor:pointer;white-space:nowrap;user-select:none}
th.s-asc:after{content:" ▲";font-size:9px}th.s-desc:after{content:" ▼";font-size:9px}
td{padding:8px 10px;border-bottom:1px solid var(--rowline);vertical-align:top}
tbody tr:nth-child(even) td{background:var(--zebra)}
td.num{font-weight:700;font-family:var(--numfont);white-space:nowrap}
td.rid{font-family:var(--mono);font-size:12px;white-space:nowrap;color:var(--accent)}
td.rat{color:var(--text2);min-width:220px}
td.fix{color:var(--text2);min-width:260px;font-size:12px;border-left:2px solid var(--accent);background:var(--fixbg)!important}
td.empty{background:var(--empty)!important}
tr.resolved td{color:var(--resolved)}tr.resolved td.rid{color:var(--resolved)}
td.c{text-align:center}
.sc{font-weight:700}.sc-lowest{color:var(--s-lowest)}.sc-low{color:var(--s-low)}.sc-medium{color:var(--s-medium)}.sc-high{color:var(--s-high)}.sc-highest{color:var(--s-highest)}
.new{font-size:9.5px;font-weight:800;background:var(--bad);color:#fff;padding:1px 5px;border-radius:3px;margin-left:5px;font-family:var(--font)}
.nodata{color:var(--muted);font-size:13px;padding:8px 0}
/* hardening */
.harden{border:1px solid var(--hiborder);background:var(--hardbg)}
[data-theme="report"] .harden{border-top:3px solid #b08d3c}
.hz-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.hz-grid.wide{grid-template-columns:repeat(2,1fr)}
.hz{background:var(--surface2);border:1px solid var(--border);border-radius:calc(var(--r) - 2px);padding:14px;display:flex;flex-direction:column}
.hz-h{display:flex;align-items:center;gap:7px;font-size:12.5px;flex-wrap:wrap}
.hz-h b{font-family:var(--mono);font-size:11.5px;word-break:break-all}
.hz-p{margin-left:auto;color:var(--good);font-weight:700;font-size:12px;white-space:nowrap}
.hz-n{width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--onaccent);display:grid;place-items:center;font-size:11px;font-weight:700;flex-shrink:0}
.hz .why{font-size:12px;color:var(--muted);margin:8px 0 0}
.hz p{font-size:12.5px;line-height:1.5;margin:8px 0 10px;color:var(--text2)}
.hz p.miss{color:var(--muted);font-style:italic}
.hz p,.hz .why,.qw-f,.qw-t,td.fix,td.rat,.note{overflow-wrap:anywhere}
.code{position:relative}
.code code{display:block;font-family:var(--mono);font-size:10.5px;background:var(--codebg);color:var(--codefg);padding:8px 9px;padding-right:46px;border-radius:6px;white-space:pre-wrap;word-break:break-all;line-height:1.45}
.code button{position:absolute;top:5px;right:5px;font:inherit;font-size:10px;background:#ffffff1a;color:var(--codefg);border:0;border-radius:4px;padding:2px 6px;cursor:pointer}
.hz-l{display:flex;gap:10px;margin-top:auto;padding-top:10px;font-size:11.5px;align-items:center;flex-wrap:wrap}
.hz-l a{text-decoration:none}
.hz-l label{color:var(--muted);margin-left:auto;cursor:pointer;display:flex;align-items:center;gap:5px}
.hz.done{opacity:.55}
.lvl-h{display:flex;align-items:center;gap:8px;margin:18px 0 10px;font-size:13px;color:var(--muted)}
/* report tab */
.info td:first-child{color:var(--muted);width:45%}
.pclogo{height:32px;margin:6px auto 14px;display:block}
.center{text-align:center}
.big{font-size:24px;font-weight:700;font-family:var(--numfont)}
.arrow{font-size:18px;margin-right:6px}
details>summary{cursor:pointer;list-style:none}details>summary::-webkit-details-marker{display:none}
details>summary h3:before{content:"▸ ";color:var(--muted)}details[open]>summary h3:before{content:"▾ "}
.posh{background:color-mix(in srgb,var(--good) 14%,transparent);padding:8px 12px;border-radius:8px;margin-bottom:10px;font-weight:600}
.negh{background:color-mix(in srgb,var(--bad) 14%,transparent);padding:8px 12px;border-radius:8px;margin-bottom:10px;font-weight:600}
footer{text-align:center;color:var(--muted);font-size:12px;padding:20px 0 34px;line-height:1.7}

/* ===================== Motion, depth & glow ===================== */
:root,[data-theme="midnight"]{--glow:1.5px;--glowa:28%;--lift:0 8px 22px -14px rgba(0,0,0,.7),0 0 0 1px rgba(34,211,238,.14);--depth:inset 0 1px 0 rgba(255,255,255,.05),0 8px 24px -16px rgba(0,0,0,.8);--tipbg:#0a1222ee;--tipfg:#e6ebf5}
[data-theme="slate"]{--glow:1px;--glowa:18%;--lift:0 10px 22px -14px rgba(16,24,40,.25),0 0 0 1px rgba(79,70,229,.1);--depth:inset 0 1px 0 #fff,0 6px 18px -14px rgba(16,24,40,.35);--tipbg:#111827f0;--tipfg:#fff}
[data-theme="report"]{--glow:0px;--glowa:0%;--lift:0 10px 24px -16px rgba(27,42,74,.45);--depth:0 4px 14px -12px rgba(27,42,74,.35);--tipbg:#1b2a4af2;--tipfg:#faf7f0}
.card,.kpi,.cs,.hz,.chip{transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .25s,background .25s}
.card,.kpi,.cs{box-shadow:var(--depth)}
.card:hover,.kpi:hover,.cs:hover{transform:translateY(-2px);box-shadow:var(--lift);border-color:color-mix(in srgb,var(--accent) 35%,var(--border))}
.hz:hover{transform:translateY(-2px);box-shadow:var(--lift)}
.chip:hover{transform:translateY(-1px);border-color:var(--accent)}
tbody tr td{transition:background .15s}
tbody tr:hover td{background:color-mix(in srgb,var(--accent) 9%,var(--surface))!important}
.tabs button,.themes button,.btn,.tbar button{transition:background .2s,color .2s,transform .15s,box-shadow .2s}
.tabs button:hover{color:var(--text);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.tabs button:active,.themes button:active{transform:scale(.96)}
.themes button.on{box-shadow:none}
.brand{transition:transform .3s,box-shadow .3s}.brand:hover{transform:scale(1.03)}
/* charts */
svg .ln{filter:drop-shadow(0 0 var(--glow) color-mix(in srgb,var(--gc) var(--glowa),transparent)) drop-shadow(0 2px 1.5px rgba(0,0,0,.12));stroke-dasharray:1;stroke-dashoffset:0}
svg .pt{transition:r .18s,stroke-width .18s;cursor:pointer}
svg .pt:hover{r:5.5;stroke-width:2.5}
svg .ga{filter:drop-shadow(0 0 var(--glow) color-mix(in srgb,var(--gc) var(--glowa),transparent));stroke-dasharray:1;cursor:pointer}
.gsvg{width:170px;max-width:100%;overflow:visible}
svg.donut{display:block;margin:0 auto;max-width:100%;overflow:visible}
/* charts fill their box: the .fill box grows with the card, the chart takes the biggest size that fits it */
.fc{display:flex;flex-direction:column}
.fc>.fill,.fc>.gauge,.fc>.gauges{flex:1 0 auto}
.gauge{display:flex;flex-direction:column}
.gauges{grid-auto-rows:1fr}
.fill{flex:1 0 var(--fb,170px);min-height:var(--fb,170px);container-type:size;display:grid;place-items:center;min-width:0}
.gauge>.fill{--fb:100px;align-items:end}
.card:has(>.chart){display:flex;flex-direction:column}.card:has(>.chart)>.chart{flex:1 0 auto}
.m-h .xwrap{display:flex;align-items:center;gap:6px;flex-shrink:0}.m-h>span:first-child{min-width:0}
.gauges.row .gauge>.fill{--fb:150px}
.fill.big{--fb:200px}
@media (max-width:760px){.fill,.fill.big{--fb:240px}.fc>.gauge>.fill{--fb:150px}}
.fill>svg.donut{width:170px;width:min(100cqw,100cqh);height:auto;max-width:none}
.fill>.gsvg{width:170px;width:min(100cqw,calc(100cqh * 1.7));height:auto;max-width:none}
[data-theme="midnight"] .pclogo{filter:invert(1) hue-rotate(180deg) brightness(1.15)}
svg .seg{transition:stroke-width .2s;cursor:pointer}
svg .seg:hover{stroke-width:28}
svg .barg{cursor:pointer;transition:filter .2s}
svg .barg .bar{filter:drop-shadow(0 3px 3px rgba(0,0,0,.16))}
svg .barg:hover{filter:brightness(1.08)}
#tip{position:fixed;z-index:100;pointer-events:none;background:var(--tipbg);color:var(--tipfg);font-size:12px;line-height:1.45;padding:7px 10px;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.3);opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;backdrop-filter:blur(6px);white-space:nowrap}
#tip.on{opacity:1;transform:none}
/* entry animations (replayed on every tab change) */
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;r:0}to{opacity:1}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes spin{from{opacity:0;transform:rotate(-120deg) scale(.8)}to{opacity:1;transform:none}}
.anim .card,.anim .kpi,.anim .cs{animation:rise .55s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:var(--d,0s)}
.anim svg .ln{animation:draw 1.2s cubic-bezier(.4,0,.2,1) backwards;animation-delay:calc(var(--d,0s) + .15s)}
.anim svg .ar{animation:fadein 1s ease both;animation-delay:calc(var(--d,0s) + .5s)}
.anim svg .pt{animation:fadein .4s ease both}
.anim svg .ga{animation:draw 1.1s cubic-bezier(.3,0,.2,1) backwards;animation-delay:calc(var(--d,0s) + .2s)}
.anim svg .barg{animation:grow .8s cubic-bezier(.2,.9,.3,1.15) both}
.anim svg.donut{animation:spin .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d,0s) + .1s)}
/* expand (maximize) any panel */
.xbtn{font:inherit;font-size:13px;line-height:1;width:28px;height:28px;display:inline-grid;place-items:center;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--muted);cursor:pointer;opacity:.55;transition:opacity .2s,color .2s,border-color .2s,transform .2s;margin-left:6px;flex-shrink:0}
.card:hover .xbtn{opacity:1}.xbtn:hover{color:var(--accent);border-color:var(--accent);transform:scale(1.08)}
.c-h .xwrap{display:flex;align-items:center;gap:6px;margin-left:auto;min-width:0;max-width:100%}
.c-h .pill{white-space:normal;text-align:right}
#veil{position:fixed;inset:0;background:rgba(5,8,16,.55);backdrop-filter:blur(4px);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
#veil.on{opacity:1;pointer-events:auto}
.card.max{position:fixed;inset:3vh 3vw;z-index:50;margin:0;overflow:auto;animation:zoomin .3s cubic-bezier(.2,.8,.2,1) both;box-shadow:0 30px 80px -20px rgba(0,0,0,.6)}
@keyframes zoomin{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.card.max:hover{transform:none}
.chart{width:100%}.chart svg{display:block}
.card.max{display:flex;flex-direction:column}
.card.max>*{flex-shrink:0}
.card.max>.chart{flex:1 1 0;min-height:160px}
.card.max>.gauges{flex:1 1 0}
.card.max>.g{flex:1 1 0;min-height:0;grid-auto-rows:1fr}
details.card.max>.g{min-height:calc(94vh - 104px)}
.card.max>.g>div{display:flex;flex-direction:column;min-height:0}
.card.max>.g>div>.chart{flex:1 1 0;min-height:120px}
.card.max .gauges.row{grid-template-columns:1fr 1fr}
.card.max>.gauge,.card.max>.fill,.card.max .gauge>.fill,.card.max .fc>.fill{flex:1 1 0}
.card.max .fill>svg.donut{width:min(100cqw,100cqh)}
.card.max .fill>.gsvg{width:min(100cqw,calc(100cqh * 1.7))}
.card.max .g-label{font-size:17px}.card.max .g-sub{font-size:13px;max-width:none}
.card.max .legend{justify-content:center;font-size:13px}
.card.max .gauges{gap:40px}
.card.max .xbtn{opacity:1}
body.has-max{overflow:hidden}
.ph{visibility:hidden}
.eff{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:99px;border:1px solid var(--border);color:var(--muted)}
.eff-low{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,transparent);background:color-mix(in srgb,var(--good) 9%,transparent)}
.eff-high{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.qw{border-color:color-mix(in srgb,var(--good) 40%,var(--border))}
[data-theme="report"] .qw{border-top-color:var(--good)}
.qw-proj{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}
.qw-p{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.qw-p span{font-size:11.5px;color:var(--muted);font-weight:600}.qw-p div{font-size:20px;font-family:var(--numfont);color:var(--muted)}.qw-p div b{color:var(--text)}.qw-p div b.dn{color:var(--good)}
.qw-p em{font-style:normal;font-size:11px;color:var(--muted)}
.qw-list{display:flex;flex-direction:column;gap:6px}
.qw-row{display:grid;grid-template-columns:22px minmax(0,1fr) 150px 64px 44px 96px 82px;gap:12px;align-items:center;padding:9px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface2);transition:transform .2s,border-color .2s,background .2s}
.qw-row:hover{transform:translateX(3px);border-color:color-mix(in srgb,var(--good) 45%,var(--border))}
.qw-row.done{opacity:.5}.qw-row.done .qw-t b{text-decoration:line-through}
.qw-t{font-size:12.5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}.qw-t b{font-family:var(--mono);font-size:12px}.qw-c{font-size:11px;color:var(--muted)}.qw-src{font-size:11px;text-decoration:none}
.qw-f{font-size:12px;color:var(--text2);margin-top:3px;line-height:1.4}
.qw-bar{height:8px;border-radius:99px;background:var(--track);overflow:hidden}.qw-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,color-mix(in srgb,var(--good) 60%,transparent),var(--good));transition:width .8s cubic-bezier(.2,.8,.2,1)}
.anim .qw-bar i{animation:barx .9s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes barx{from{width:0}}
.qw-time{font-size:12px;color:var(--muted);white-space:nowrap}.qw-pts{font-weight:700;color:var(--good);font-family:var(--numfont);text-align:right}
.qw-copy{font-size:11px;padding:5px 8px;white-space:nowrap}.qw-ck{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px;cursor:pointer;white-space:nowrap}
@media (max-width:1100px){.qw-row{grid-template-columns:22px minmax(0,1fr) 70px 44px;}.qw-bar,.qw-copy,.qw-ck{display:none}.qw-proj{grid-template-columns:repeat(3,1fr)}}
.xrel:not(.max){position:relative}
.m-h .xbtn{width:24px;height:24px;font-size:12px}
.card.max .m-h{font-size:15px}.card.max .m-h b{font-size:30px}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

@media (max-width:1100px){.g5,.g6{grid-template-columns:repeat(3,1fr)}.hz-grid{grid-template-columns:1fr 1fr}.g4{grid-template-columns:1fr 1fr}}
@media (max-width:760px){.top h1,[data-theme="report"] .top h1{font-size:20px}.g2,.g3,.g4,.g5,.g6,.g-gr,.hz-grid,.hz-grid.wide{grid-template-columns:1fr}.gauges.row{grid-template-columns:1fr 1fr}.gauges>*{min-width:0}.top{flex-wrap:wrap}.right{margin-left:0;align-items:flex-start}}
@media print{.themes,.tbar,.tabs,.code button{display:none!important}body{background:#fff}.card,.kpi,.cs{break-inside:avoid}}
</style>

<script id="pc-data" type="application/json">{"domain":"test.mysmartlogon.com","author":"METSYS","uri":"https://blog.metsys.fr","logo":"https://www.metsys.fr/wp-content/themes/metsys/images/svg/metsys-logo-white.svg","theme":"midnight","lang":"fr","invert":false,"generatedAt":"23/11/2026 08:57:04","pcLogo":"https://raw.githubusercontent.com/leobouard/PingCastleDashboard/refs/heads/main/data/ping-castle-logo.png","hardening":{"P-AdminLogin":{"Fix":"The built-in Administrator account (RID 500) was used recently. Use named admin accounts for daily work and keep this one as a break glass account: long random password stored in a safe, used only in an emergency, and an alert on its logons (event 4624 on the DCs).","Check":"$s = (Get-ADDomain).DomainSID; Get-ADUser -Identity \"$s-500\" -Properties LastLogonDate, PasswordLastSet | Select-Object Name, Enabled, LastLogonDate, PasswordLastSet","Effort":"Low","Minutes":30,"Ref":"https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/plan/security-best-practices/appendix-d--securing-built-in-administrator-accounts-in-active-directory","FixFR":"Le compte Administrateur intégré (RID 500) a été utilisé récemment. Utilisez des comptes admin nominatifs pour le travail quotidien et gardez celui-ci comme compte de secours : mot de passe long et aléatoire rangé dans un coffre, utilisé seulement en urgence, avec une alerte sur ses connexions (événement 4624 sur les DC)."},"T-TGTDelegation":{"Fix":"TGT delegation is allowed over this forest trust, so a server with unconstrained delegation in the other forest can capture TGTs of your users, admins included. Turn it off (it is off by default since 2019 updates): netdom trust <OtherForest> /domain:<YourForest> /EnableTGTDelegation:No. Only keep it during a migration that needs it.","Check":"Get-ADTrust -Filter * | Select-Object Name, Direction, ForestTransitive, TGTDelegation","Effort":"Low","Minutes":15,"Ref":"https://support.microsoft.com/en-us/help/4490425/updates-to-tgt-delegation-across-incoming-trusts-in-windows-server","FixFR":"La délégation de TGT est autorisée sur cette approbation de forêt : un serveur avec délégation non contrainte dans l'autre forêt peut donc capturer les TGT de vos utilisateurs, admins compris. Désactivez-la (elle est désactivée par défaut depuis les mises à jour de 2019) : netdom trust <AutreForêt> /domain:<VotreForêt> /EnableTGTDelegation:No. Gardez-la seulement pendant une migration qui en a besoin."},"S-Reversible":{"Fix":"These user accounts store their password with reversible encryption, so it can be read in clear text from AD. Remove the option: Set-ADUser <name> -AllowReversiblePasswordEncryption $false, then force a password change (the clear text copy stays until the next change). Also check fine grained password policies for ReversibleEncryptionEnabled.","Check":"Get-ADUser -LDAPFilter '(userAccountControl:1.2.840.113556.1.4.803:=128)' | Select-Object SamAccountName, Enabled; Get-ADFineGrainedPasswordPolicy -Filter { ReversibleEncryptionEnabled -eq $true } | Select-Object Name","Effort":"Low","Minutes":15,"Ref":"https://learn.microsoft.com/en-us/windows/security/threat-protection/security-policy-settings/store-passwords-using-reversible-encryption","FixFR":"Ces comptes utilisateurs stockent leur mot de passe avec un chiffrement réversible : il peut donc être lu en clair dans l'AD. Retirez l'option : Set-ADUser <nom> -AllowReversiblePasswordEncryption $false, puis forcez un changement de mot de passe (la copie en clair reste jusqu'au prochain changement). Vérifiez aussi les stratégies de mot de passe affinées pour ReversibleEncryptionEnabled."},"P-RODCDeniedGroup":{"Fix":"Put back the members PingCastle expects in the 'Denied RODC Password Replication Group': Domain Controllers, Read-only Domain Controllers, Domain Admins, Group Policy Creator Owners, Cert Publishers and krbtgt, plus Enterprise Admins and Schema Admins in the forest root domain.","Check":"$s = (Get-ADDomain).DomainSID; Get-ADGroupMember -Identity \"$s-572\" | Select-Object Name","Effort":"Low","Minutes":10,"Ref":"","FixFR":"Remettez les membres attendus par PingCastle dans le groupe 'Denied RODC Password Replication Group' : Domain Controllers, Read-only Domain Controllers, Domain Admins, Group Policy Creator Owners, Cert Publishers et krbtgt, plus Enterprise Admins et Schema Admins dans le domaine racine de la forêt."},"S-DC-2000":{"Fix":"Add new DCs on a supported Windows Server version (2022 or 2025), move the FSMO roles, then demote and remove the Windows 2000 DC. On old versions you may need an intermediate DC version first. Raise the functional levels when all old DCs are gone.","Check":"Get-ADComputer -Filter { PrimaryGroupID -eq 516 -and OperatingSystem -like '*Windows 2000*' } -Properties OperatingSystem, LastLogonDate | Select-Object Name, OperatingSystem, LastLogonDate","Effort":"High","Minutes":960,"Ref":"","FixFR":"Ajoutez de nouveaux DC sur une version de Windows Server supportée (2022 ou 2025), transférez les rôles FSMO, puis rétrogradez et retirez le DC Windows 2000. Avec les très anciennes versions, il faut parfois passer d'abord par une version intermédiaire. Montez les niveaux fonctionnels quand tous les anciens DC sont partis."},"S-Inactive":{"Fix":"Too many user accounts are inactive (no logon for 6 months). Former staff accounts are an easy way in. Disable the inactive accounts, move them to a dedicated OU, delete them after a waiting period, and set up a regular process with HR for leavers.","Check":"Search-ADAccount -AccountInactive -UsersOnly -TimeSpan 180.00:00:00 | Where-Object Enabled | Select-Object SamAccountName, LastLogonDate","Effort":"Medium","Minutes":120,"Ref":"https://learn.microsoft.com/en-us/powershell/module/activedirectory/search-adaccount","FixFR":"Trop de comptes utilisateurs sont inactifs (aucune connexion depuis 6 mois). Les comptes d'anciens employés sont une entrée facile. Désactivez les comptes inactifs, déplacez-les dans une OU dédiée, supprimez-les après un délai, et mettez en place un processus régulier avec les RH pour les départs."},"S-DC-2008":{"Fix":"Add new DCs on a supported Windows Server (2022 or 2025), move the FSMO roles, then demote and remove the 2008 DC. Don't pick Windows Server 2016 as the target: its support ends on January 12, 2027.","Check":"Get-ADDomainController -Filter * | Select-Object Name, OperatingSystem","Effort":"High","Minutes":960,"Ref":"https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/deploy/upgrade-domain-controllers","FixFR":"Ajoutez de nouveaux DC sur une version de Windows Server supportée (2022 ou 2025), transférez les rôles FSMO, puis rétrogradez et retirez le DC 2008. Ne choisissez pas Windows Server 2016 comme cible : son support se termine le 12 janvier 2027."},"A-MD4RootCert":{"Fix":"A MD4 signed root certificate is pushed by a GPO (Public Key Policies) or stored in NTAuth; the report gives the source and the subject. Remove it there. If it is still in use, replace it with a new certificate (SHA-256 signature, RSA 2048 bits or more) first, then reissue the certificates that depend on it.","Check":"Get-ChildItem Cert:\\LocalMachine\\Root, Cert:\\LocalMachine\\CA | Where-Object { $_.SignatureAlgorithm.FriendlyName -notmatch 'sha256|sha384|sha512|ecdsa' } | Select-Object PSParentPath, Subject, Thumbprint, NotAfter; certutil -enterprise -store NTAuth","Effort":"Medium","Minutes":120,"Ref":"https://tools.ietf.org/html/rfc6150","FixFR":"Un certificat racine signé en MD4 est poussé par une GPO (Public Key Policies) ou présent dans NTAuth ; le rapport donne la source et le sujet. Retirez-le à cet endroit. S'il sert encore, remplacez-le d'abord par un nouveau certificat (signature SHA-256, RSA 2048 bits ou plus), puis réémettez les certificats qui en dépendent."},"A-SmartCardRequired":{"Fix":"Turn on automatic hash rolling: at domain functional level 2016 or higher, set msDS-ExpirePasswordsOnSmartCardOnlyAccounts to True on the domain object, and don't disable the GPO 'Enable rolling of expiring NTLM secrets during sign on...'. Quick one-off fix: untick, then tick again 'Smart card is required for interactive logon' on each account.","Check":"Get-ADObject (Get-ADDomain).DistinguishedName -Properties msDS-ExpirePasswordsOnSmartCardOnlyAccounts | Select-Object msDS-ExpirePasswordsOnSmartCardOnlyAccounts; Get-ADUser -Filter {SmartcardLogonRequired -eq $true} -Properties PasswordLastSet | Select-Object SamAccountName, PasswordLastSet","Effort":"Low","Minutes":10,"Ref":"https://learn.microsoft.com/en-us/archive/blogs/positivesecurity/smartcard-and-pass-the-hash","FixFR":"Activez le renouvellement automatique des empreintes : au niveau fonctionnel de domaine 2016 ou plus, mettez msDS-ExpirePasswordsOnSmartCardOnlyAccounts à True sur l'objet domaine, et ne désactivez pas la GPO 'Enable rolling of expiring NTLM secrets during sign on...'. Correction ponctuelle rapide : décochez puis recochez 'Smart card is required for interactive logon' sur chaque compte."},"S-WSUS-UserProxy":{"Fix":"A GPO lets Windows Update use the user proxy as a fallback, so a user (or malware running as the user) can redirect update detection. Edit the GPO named in the report (Specify intranet Microsoft update service location) and set 'Select the proxy behavior' to 'Only use system proxy for detecting updates (default)'.","Check":"Get-ItemProperty HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\WindowsUpdate -ErrorAction SilentlyContinue | Select-Object WUServer, WUStatusServer, DoNotEnforceEnterpriseTLSCertPinningForUpdateDetection, SetProxyBehaviorForUpdateDetection","Effort":"Low","Minutes":10,"Ref":"https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-csp-update#update-setproxybehaviorforupdatedetection","FixFR":"Une GPO laisse Windows Update utiliser le proxy de l'utilisateur en secours : un utilisateur (ou un malware qui tourne en tant qu'utilisateur) peut donc rediriger la détection des mises à jour. Modifiez la GPO citée dans le rapport (Specify intranet Microsoft update service location) et réglez 'Select the proxy behavior' sur 'Only use system proxy for detecting updates (default)'."},"A-DCLdapsChannelBinding":{"Fix":"This DC does not enforce LDAPS channel binding, so NTLM relay to LDAPS works. Turn on LDAP diagnostic logging ('16 LDAP Interface Events' = 2), set channel binding to 'When supported' first and watch events 3039 to 3041 to find old clients. Then in a GPO linked to the Domain Controllers OU set 'Domain controller: LDAP server channel binding token requirements' to Always (LdapEnforceChannelBinding = 2).","Check":"Invoke-Command -ComputerName (Get-ADDomainController -Filter *).HostName -ScriptBlock { Get-ItemProperty HKLM:\\SYSTEM\\CurrentControlSet\\Services\\NTDS\\Parameters | Select-Object PSComputerName, LdapEnforceChannelBinding }","Effort":"Medium","Minutes":120,"Ref":"https://support.microsoft.com/en-us/topic/use-the-ldapenforcechannelbinding-registry-entry-to-make-ldap-authentication-over-ssl-tls-more-secure-e9ecfa27-5e57-8519-6ba3-d2c06b21812e","FixFR":"Ce DC n'impose pas la liaison de canal LDAPS : un relais NTLM vers LDAPS fonctionne donc. Activez la journalisation LDAP ('16 LDAP Interface Events' = 2), mettez d'abord la liaison de canal sur 'When supported' et surveillez les événements 3039 à 3041 pour trouver les anciens clients. Ensuite, dans une GPO liée à l'OU Domain Controllers, mettez 'Domain controller: LDAP server channel binding token requirements' sur Always (LdapEnforceChannelBinding = 2)."},"A-LAPS-Joined-Computers":{"Fix":"These computers were joined by a normal user, who is still the owner (ms-DS-CreatorSID) and can read their LAPS password or take them over. For each one, set the owner to Domain Admins (Security > Advanced > Owner) and remove the creator's extra permissions (All extended rights, Write, Full control). Then set ms-DS-MachineAccountQuota to 0 and join computers with a dedicated delegated account.","Check":"Get-ADComputer -LDAPFilter '(ms-DS-CreatorSID=*)' -Properties ms-DS-CreatorSID, nTSecurityDescriptor | Select-Object Name, @{ n = 'Creator'; e = { $_.'ms-DS-CreatorSID' } }, @{ n = 'Owner'; e = { $_.nTSecurityDescriptor.Owner } }","Effort":"Medium","Minutes":60,"Ref":"https://learn.microsoft.com/en-us/windows-server/identity/laps/laps-concepts-overview","FixFR":"Ces ordinateurs ont été joints par un utilisateur normal, qui en est toujours propriétaire (ms-DS-CreatorSID) et peut lire leur mot de passe LAPS ou en prendre le contrôle. Pour chacun, mettez Domain Admins comme propriétaire (Sécurité > Avancé > Propriétaire) et retirez au créateur ses permissions en plus (Tous les droits étendus, Écriture, Contrôle total). Mettez ensuite ms-DS-MachineAccountQuota à 0 et joignez les ordinateurs avec un compte dédié délégué."},"A-LMHashAuthorized":{"Fix":"A GPO sets 'Network security: LAN Manager authentication level' to 'Send LM & NTLM responses' or disables 'Network security: Do not store LAN Manager hash value on next password change'. Edit that GPO: enable 'Do not store LAN Manager hash...' and set the level to at least 'Send NTLMv2 response only', ideally 'Send NTLMv2 response only. Refuse LM & NTLM' after checking NTLM audit logs.","Check":"Get-GPO -All | Where-Object { (Get-GPOReport -Guid $_.Id -ReportType Xml) -match 'LmCompatibilityLevel|NoLMHash' } | Select-Object DisplayName","Effort":"Low","Minutes":15,"Ref":"https://learn.microsoft.com/en-us/windows/security/threat-protection/security-policy-settings/network-security-lan-manager-authentication-level","FixFR":"Une GPO règle 'Network security: LAN Manager authentication level' sur 'Send LM & NTLM responses' ou désactive 'Network security: Do not store LAN Manager hash value on next password change'. Modifiez cette GPO : activez 'Do not store LAN Manager hash...' et réglez le niveau au moins sur 'Send NTLMv2 response only', idéalement 'Send NTLMv2 response only. Refuse LM & NTLM' après avoir vérifié les journaux d'audit NTLM."},"A-MD5IntermediateCert":{"Fix":"A MD5 signed intermediate CA certificate is pushed by a GPO (Public Key Policies) or stored in NTAuth; the report gives the source and the subject. Remove it there. If it is still in use, replace it with a new certificate (SHA-256 signature, RSA 2048 bits or more) first, then reissue the certificates that depend on it.","Check":"Get-ChildItem Cert:\\LocalMachine\\Root, Cert:\\LocalMachine\\CA | Where-Object { $_.SignatureAlgorithm.FriendlyName -notmatch 'sha256|sha384|sha512|ecdsa' } | Select-Object PSParentPath, Subject, Thumbprint, NotAfter; certutil -enterprise -store NTAuth","Effort":"Medium","Minutes":120,"Ref":"https://www.kb.cert.org/vuls/id/836068","FixFR":"Un certificat d'AC intermédiaire signé en MD5 est poussé par une GPO (Public Key Policies) ou présent dans NTAuth ; le rapport donne la source et le sujet. Retirez-le à cet endroit. S'il sert encore, remplacez-le d'abord par un nouveau certificat (signature SHA-256, RSA 2048 bits ou plus), puis réémettez les certificats qui en dépendent."},"P-Delegated":{"Fix":"These admin accounts can be impersonated through Kerberos delegation. On each one, tick 'Account is sensitive and cannot be delegated' (Set-ADUser <name> -AccountNotDelegated $true), or add it to Protected Users (functional level 2012 R2 or higher) after testing. Do not do this on service accounts that need delegation; use gMSA for them.","Check":"Get-ADGroupMember -Identity 'S-1-5-32-544' -Recursive | Where-Object objectClass -eq 'user' | Get-ADUser -Properties AccountNotDelegated | Where-Object { $_.Enabled -and -not $_.AccountNotDelegated } | Select-Object SamAccountName","Effort":"Low","Minutes":15,"Ref":"https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/how-to-configure-protected-accounts","FixFR":"Ces comptes admin peuvent être usurpés via la délégation Kerberos. Sur chacun, cochez 'Account is sensitive and cannot be delegated' (Set-ADUser <nom> -AccountNotDelegated $true), ou ajoutez-le à Protected Users (niveau fonctionnel 2012 R2 ou plus) après un test. Ne le faites pas sur les comptes de service qui ont besoin de délégation ; utilisez des gMSA pour eux."},"P-RODCNeverReveal":{"Fix":"An RODC is missing one of the default groups in its denied list (msDS-NeverRevealGroup), so admin passwords could be cached on it. Add them back: Add-ADDomainControllerPasswordReplicationPolicy -Identity <RODC> -DeniedList 'S-1-5-32-544','S-1-5-32-549','S-1-5-32-548','S-1-5-32-551','<domain SID>-572' (Administrators, Server Operators, Account Operators, Backup Operators, Denied RODC Password Replication Group).","Check":"Get-ADDomainController -Filter { IsReadOnly -eq $true } | ForEach-Object { Get-ADDomainControllerPasswordReplicationPolicy -Identity $_ -Denied | Select-Object Name, SID }","Effort":"Low","Minutes":10,"Ref":"https://learn.microsoft.com/en-us/openspecs/windows_protocols/ms-adts/8dfc81be-7461-48f2-8caf-07402bccb0ea","FixFR":"Il manque à un RODC un des groupes par défaut de sa liste refusée (msDS-NeverRevealGroup) : des mots de passe d'admin pourraient donc y être mis en cache. Remettez-les : Add-ADDomainControllerPasswordReplicationPolicy -Identity <RODC> -DeniedList 'S-1-5-32-544','S-1-5-32-549','S-1-5-32-548','S-1-5-32-551','<SID du domaine>-572' (Administrators, Server Operators, Account Operators, Backup Operators, Denied RODC Password Replication Group)."},"A-Krbtgt":{"Fix":"Reset the krbtgt password twice. Wait at least 10 hours between the two resets (the default max ticket lifetime; wait longer if you raised it) and make sure replication is done. Microsoft's New-KrbtgtKeys.ps1 script helps you do each reset safely. PingCastle alerts after 1 year, so plan it at least once a year.","Check":"Get-ADUser krbtgt -Properties PasswordLastSet | Select-Object Name, PasswordLastSet","Effort":"Medium","Minutes":60,"Ref":"https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/ad-forest-recovery-resetting-the-krbtgt-password","FixFR":"Réinitialisez le mot de passe du compte krbtgt deux fois. Attendez au moins 10 heures entre les deux (la durée de vie maximale des tickets par défaut ; attendez plus si vous l'avez augmentée) et vérifiez que la réplication est terminée. Le script Microsoft New-KrbtgtKeys.ps1 aide à faire chaque réinitialisation sans risque. PingCastle alerte après 1 an : prévoyez-le au moins une fois par an."},"A-CertWeakDSA":{"Fix":"A DSA key certificate is pushed by a GPO (Public Key Policies) or stored in NTAuth; the report gives the source and the subject. Remove it there. If it is still in use, replace it with a new certificate (SHA-256 signature, RSA 2048 bits or more) first, then reissue the certificates that depend on it.","Check":"Get-ChildItem Cert:\\LocalMachine\\Root, Cert:\\LocalMachine\\CA | Where-Object { $_.PublicKey.Oid.FriendlyName -eq 'DSA' } | Select-Object PSParentPath, Subject, Thumbprint, NotAfter; certutil -enterprise -store NTAuth","Effort":"Medium","Minutes":120,"Ref":"https://csrc.nist.gov/publications/detail/fips/186/5/draft","FixFR":"Un certificat à clé DSA est poussé par une GPO (Public Key Policies) ou présent dans NTAuth ; le rapport donne la source et le sujet. Retirez-le à cet endroit. S'il sert encore, remplacez-le d'abord par un nouveau certificat (signature SHA-256, RSA 2048 bits ou plus), puis réémettez les certificats qui en dépendent."},"A-DC-WebClient":{"Fix":"The WebClient service (WebDAV) is present on a DC, so the DC can be forced to authenticate over HTTP, which is easy to relay. Unless an application really needs it, uninstall it (Uninstall-WindowsFeature WebDAV-Redirector) or set the WebClient service to Disabled by GPO (System Services) on the Domain Controllers OU.","Check":"Get-CimInstance Win32_Service -Filter \"Name='WebClient'\" -ComputerName (Get-ADDomainController -Filter *).HostName | Select-Object PSComputerName, State, StartMode","Effort":"Low","Minutes":10,"Ref":"https://learn.microsoft.com/en-us/windows-server/security/windows-services/security-guidelines-for-disabling-system-services-in-windows-server","FixFR":"Le service WebClient (WebDAV) est présent sur un DC : le DC peut donc être forcé à s'authentifier en HTTP, ce qui se relaie facilement. Sauf si une application en a vraiment besoin, désinstallez-le (Uninstall-WindowsFeature WebDAV-Redirector) ou mettez le service WebClient sur Disabled par GPO (System Services) sur l'OU Domain Controllers."},"A-DsHeuristicsDoNotVerifyUniqueness":{"Fix":"The 21st character of dSHeuristics turns off the UPN and SPN uniqueness check, so duplicates can be created and abused for Kerberos attacks. Edit CN=Directory Service,CN=Windows NT,CN=Services,CN=Configuration,... with ADSI Edit and set the 21st character to 0 (the 10th must stay 1 and the 20th must stay 2). Then look for duplicate UPN and SPN with setspn -X.","Check":"Get-ADObject \"CN=Directory Service,CN=Windows NT,CN=Services,$((Get-ADRootDSE).configurationNamingContext)\" -Properties dSHeuristics, msDS-Other-Settings | Select-Object dSHeuristics, msDS-Other-Settings","Effort":"Low","Minutes":15,"Ref":"https://support.microsoft.com/en-us/topic/kb5008382-verification-of-uniqueness-for-user-principal-name-service-principal-name-and-the-service-principal-name-alias-cve-2021-42282-4651b175-290c-4e59-8fcb-e4e5cd0cdb29","FixFR":"Le 21e caractère de dSHeuristics désactive le contrôle d'unicité des UPN et SPN : des doublons peuvent donc être créés et utilisés pour des attaques Kerberos. Modifiez CN=Directory Service,CN=Windows NT,CN=Services,CN=Configuration,... avec ADSI Edit et mettez le 21e caractère à 0 (le 10e doit rester 1 et le 20e doit rester 2). Cherchez ensuite les UPN et SPN en double avec setspn -X."},"P-LogonDenied":{"Fix":"No GPO stops domain admins from logging on to workstations and member servers, so their credentials end up on machines that are easy to compromise. Create a GPO linked to the workstation and member server OUs (not the Domain Controllers OU) that adds Domain Admins and Enterprise Admins to 'Deny log on locally', 'Deny log on through Remote Desktop Services', 'Deny access to this computer from the network', 'Deny log on as a batch job' and 'Deny log on as a service'.","Check":"Get-GPO -All | Where-Object { (Get-GPOReport -Guid $_.Id -ReportType Xml) -match 'SeDenyInteractiveLogonRight|SeDenyRemoteInteractiveLogonRight' } | Select-Object DisplayName","Effort":"Medium","Minutes":60,"Ref":"https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/plan/security-best-practices/appendix-f--securing-domain-admins-groups-in-active-directory","FixFR":"Aucune GPO n'empêche les admins du domaine de se connecter aux postes et aux serveurs membres : leurs identifiants finissent donc sur des machines faciles à compromettre. Créez une GPO liée aux OU des postes et des serveurs membres (pas à l'OU Domain Controllers) qui ajoute Domain Admins et Enterprise Admins dans 'Deny log on locally', 'Deny log on through Remote Desktop Services', 'Deny access to this computer from the network', 'Deny log on as a batch job' et 'Deny log on as a service'."},"S-C-PrimaryGroup":{"Fix":"Set the primary group of the listed computers back to 'Domain Computers' (515): ADUC > the computer > Member Of > Set Primary Group. DCs use 516 (521 for RODCs). This rule also triggers when a DC is outside the 'Domain Controllers' OU: move it back there.","Check":"Get-ADComputer -Filter * -Properties PrimaryGroupID | Where-Object { $_.PrimaryGroupID -notin 514, 515, 516, 521 } | Select-Object Name, PrimaryGroupID; Get-ADDomainController -Filter * | Where-Object { $_.ComputerObjectDN -notlike \"*,$((Get-ADDomain).DomainControllersContainer)\" } | Select-Object Name","Effort":"Low","Minutes":10,"Ref":"","FixFR":"Remettez le groupe principal des ordinateurs listés sur 'Domain Computers' (515) : ADUC > l'ordinateur > Member Of > Set Primary Group. Les DC utilisent 516 (521 pour les RODC). Cette règle se déclenche aussi quand un DC est hors de l'OU 'Domain Controllers' : remettez-le dedans."},"S-TerminalServicesGPO":{"Fix":"Remote Desktop sessions have no time limits or allow printer redirection, so idle and disconnected sessions keep credentials in memory. In a GPO, under Computer Configuration > Policies > Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Session Host, set 'Session Time Limits > Set time limit for active but idle Remote Desktop Services sessions' and 'Set time limit for disconnected sessions' (for example 2 hours, never Never), and enable 'Printer Redirection > Do not allow client printer redirection'.","Check":"Get-GPO -All | Where-Object { (Get-GPOReport -Guid $_.Id -ReportType Xml) -match 'Set time limit for disconnected sessions|Set time limit for active but idle|Do not allow client printer redirection' } | Select-Object DisplayName","Effort":"Low","Minutes":20,"Ref":"https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-csp-admx-terminalserver","FixFR":"Les sessions Bureau à distance n'ont pas de limite de temps ou autorisent la redirection d'imprimantes : les sessions inactives et déconnectées gardent donc des identifiants en mémoire. Dans une GPO, sous Computer Configuration > Policies > Administrative Templates > Windows Components > Remote Desktop Services > Remote Desktop Session Host, réglez 'Session Time Limits > Set time limit for active but idle Remote Desktop Services sessions' et 'Set time limit for disconnected sessions' (par exemple 2 heures, jamais Never), et activez 'Printer Redirection > Do not allow client printer redirection'."},"A-SHA1IntermediateCert":{"Fix":"A SHA-1 signed intermediate CA certificate is pushed by a GPO (Public Key Policies) or stored in NTAuth; the report gives the source. Remove it there. If it is still in use, issue a new SHA-256 CA certificate first and reissue the certificates that depend on it.","Check":"Get-ChildItem Cert:\\LocalMachine\\CA | Where-Object { $_.SignatureAlgorithm.FriendlyName -eq 'sha1RSA' } | Select-Object Subject, Thumbprint, NotAfter; certutil -enterprise -store NTAuth","Effort":"Medium","Minutes":120,"Ref":"https://tools.ietf.org/html/rfc6194","FixFR":"Un certificat d'AC intermédiaire signé en SHA-1 est poussé par une GPO (Public Key Policies) ou présent dans NTAuth ; le rapport donne la source. Retirez-le à cet endroit. S'il sert encore, émettez d'abord un nouveau certificat d'AC en SHA-256 puis réémettez les certificats qui en dépendent."},"A-NoServicePolicy":{"Fix":"Move service accounts to gMSA (or dMSA on Windows Server 2025) so their passwords rotate by themselves. For the others, create a fine grained password policy with a minimum length of 20+ and apply it to a service accounts group.","Check":"Get-ADFineGrainedPasswordPolicy -Filter * | Select-Object Name, MinPasswordLength, AppliesTo","Effort":"Low","Minutes":30,"Ref":"https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/group-managed-service-accounts/group-managed-service-accounts/group-managed-service-accounts-overview","FixFR":"Passez les comptes de service en gMSA (ou dMSA sur Windows Server 2025) pour que leurs mots de passe changent tout seuls. Pour les autres, créez une stratégie de mot de passe affinée avec une longueur minimale de 20+ et appliquez-la à un groupe de comptes de service."},"S-WSUS-NoPinning":{"Fix":"A GPO turns off WSUS TLS certificate pinning, so a fake update server with any trusted certificate can be accepted. Edit the GPO named in the report (Computer Configuration > Policies > Administrative Templates > Windows Components > Windows Update > Specify intranet Microsoft update service location) and untick 'Do not enforce TLS certificate pinning for Windows Update client for detecting updates'.","Check":"Get-ItemProperty HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\WindowsUpdate -ErrorAction SilentlyContinue | Select-Object WUServer, WUStatusServer, DoNotEnforceEnterpriseTLSCertPinningForUpdateDetection, SetProxyBehaviorForUpdateDetection","Effort":"Low","Minutes":10,"Ref":"https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-csp-update#update-donotenforceenterprisetlscertpinningforupdatedetection","FixFR":"Une GPO désactive l'épinglage du certificat TLS de WSUS : un faux serveur de mises à jour avec n'importe quel certificat approuvé peut donc être accepté. Modifiez la GPO citée dans le rapport (Computer Configuration > Policies > Administrative Templates > Windows Components > Windows Update > Specify intranet Microsoft update service location) et décochez 'Do not enforce TLS certificate pinning for Windows Update client for detecting updates'."},"P-RODCAllowedGroup":{"Fix":"Empty the 'Allowed RODC Password Replication Group'. If some passwords must be cached on an RODC, add a dedicated group to that RODC's own Password Replication Policy instead.","Check":"$s = (Get-ADDomain).DomainSID; Get-ADGroupMember -Identity \"$s-571\"","Effort":"Low","Minutes":10,"Ref":"","FixFR":"Videz le groupe 'Allowed RODC Password Replication Group'. Si certains mots de passe doivent être mis en cache sur un RODC, ajoutez plutôt un groupe dédié à la stratégie de réplication de mots de passe propre à ce RODC."},"A-WSUS-SslProtocol":{"Fix":"The WSUS server still offers SSL 2.0 or SSL 3.0. On the WSUS server, create the SCHANNEL keys 'SSL 2.0\\Server' and 'SSL 3.0\\Server' with Enabled = 0 and DisabledByDefault = 1, then reboot. Plan to turn off TLS 1.0 and 1.1 too. Run the check on the WSUS server (an empty value means the Windows default).","Check":"'SSL 2.0','SSL 3.0' | ForEach-Object { [pscustomobject]@{ Protocol = $_; Enabled = (Get-ItemProperty \"HKLM:\\SYSTEM\\CurrentControlSet\\Control\\SecurityProviders\\SCHANNEL\\Protocols\\$_\\Server\" -ErrorAction SilentlyContinue).Enabled } }","Effort":"Low","Minutes":30,"Ref":"https://learn.microsoft.com/en-us/dotnet/framework/network-programming/tls#configuring-schannel-protocols-in-the-windows-registry","FixFR":"Le serveur WSUS propose encore SSL 2.0 ou SSL 3.0. Sur le serveur WSUS, créez les clés SCHANNEL 'SSL 2.0\\Server' et 'SSL 3.0\\Server' avec Enabled = 0 et DisabledByDefault = 1, puis redémarrez. Prévoyez aussi de désactiver TLS 1.0 et 1.1. Lancez la vérification sur le serveur WSUS (une valeur vide signifie le comportement par défaut de Windows)."},"A-UpnSamCollision":{"Fix":"An account has a UPN equal to the sAMAccountName of another account, which can be used to get a Kerberos ticket in the name of that account. Treat it as an attack: install the update for CVE-2026-27912 on the DCs, reset the password of the targeted account, fix the UPN, then find who set it. Limit who can change userPrincipalName.","Check":"$sam = @{}; Get-ADObject -LDAPFilter '(sAMAccountName=*)' -Properties sAMAccountName | ForEach-Object { $sam[$_.sAMAccountName.ToLower()] = $_.Name }; Get-ADObject -LDAPFilter '(userPrincipalName=*)' -Properties userPrincipalName, sAMAccountName | Where-Object { $k = ($_.userPrincipalName -split '@')[0].ToLower(); $sam.ContainsKey($k) -and $k -ne \"$($_.sAMAccountName)\".ToLower() } | Select-Object Name, sAMAccountName, userPrincipalName","Effort":"Medium","Minutes":60,"Ref":"https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-27912","FixFR":"Un compte a un UPN égal au sAMAccountName d'un autre compte, ce qui peut servir à obtenir un ticket Kerberos au nom de ce compte. Traitez-le comme une attaque : installez la mise à jour de la CVE-2026-27912 sur les DC, réinitialisez le mot de passe du compte visé, corrigez l'UPN, puis cherchez qui l'a mis. Limitez qui peut modifier userPrincipalName."},"S-Domain$$$":{"Fix":"If no SID History migration is running, delete the '<DOMAIN>$$$' group. If a migration is running, finish it first.","Check":"Get-ADGroup -LDAPFilter '(sAMAccountName=*$$$)'","Effort":"Low","Minutes":5,"Ref":"","FixFR":"Si aucune migration SID History n'est en cours, supprimez le groupe '<DOMAINE>$$$'. Si une migration est en cours, terminez-la d'abord."},"A-NullSession":{"Fix":"A DC answers requests without any account. Fix the causes listed by the other rules of the report (A-PreWin2000Anonymous, A-DsHeuristicsAnonymous). On DCs, keep 'Network access: Let Everyone permissions apply to anonymous users' Disabled and 'Network access: Do not allow anonymous enumeration of SAM accounts' Enabled. Then rerun PingCastle to confirm.","Check":"Get-ItemProperty HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Lsa | Select-Object RestrictAnonymous, RestrictAnonymousSAM, EveryoneIncludesAnonymous","Effort":"Low","Minutes":30,"Ref":"https://learn.microsoft.com/en-us/windows/security/threat-protection/security-policy-settings/network-access-let-everyone-permissions-apply-to-anonymous-users","FixFR":"Un DC répond à des requêtes sans aucun compte. Corrigez les causes signalées par les autres règles du rapport (A-PreWin2000Anonymous, A-DsHeuristicsAnonymous). Sur les DC, laissez 'Network access: Let Everyone permissions apply to anonymous users' sur Disabled et 'Network access: Do not allow anonymous enumeration of SAM accounts' sur Enabled. Relancez ensuite PingCastle pour confirmer."},"A-CertTempAgent":{"Fix":"A Certificate Request Agent template can be requested by any user without manager approval (ESC3). In certtmpl.msc, open the template: on the Security tab remove Enroll from Domain Users, Domain Computers, Authenticated Users and Everyone and give it to a small dedicated group; on Issuance Requirements tick CA certificate manager approval. If no one uses it, remove it from the CA (certsrv.msc > Certificate Templates > Delete).","Check":"$cfg = (Get-ADRootDSE).configurationNamingContext; Get-ADObject -SearchBase \"CN=Certificate Templates,CN=Public Key Services,CN=Services,$cfg\" -Filter * -Properties pKIExtendedKeyUsage, msPKI-Enrollment-Flag, msPKI-RA-Signature | Select-Object Name, pKIExtendedKeyUsage, msPKI-Enrollment-Flag, msPKI-RA-Signature | Where-Object { $_.pKIExtendedKeyUsage -contains '1.3.6.1.4.1.311.20.2.1' }","Effort":"Low","Minutes":30,"Ref":"https://posts.specterops.io/certified-pre-owned-d95910965cd2","FixFR":"Un modèle Certificate Request Agent peut être demandé par n'importe quel utilisateur sans approbation (ESC3). Dans certtmpl.msc, ouvrez le modèle : dans l'onglet Sécurité, retirez Inscrire à Domain Users, Domain Computers, Authenticated Users et Everyone et donnez-le à un petit groupe dédié ; dans Conditions d'émission, cochez l'approbation du gestionnaire de certificats de l'AC. Si personne ne l'utilise, retirez-le de l'AC (certsrv.msc > Modèles de certificats > Supprimer)."},"S-OS-Win8":{"Fix":"Replace or upgrade the Windows 8 / 8.1 machines to a supported version (Windows 11 for workstations, Windows Server 2022 or 2025 for servers). Until then, isolate them on the network and disable the accounts of the machines that are gone.","Check":"Get-ADComputer -Filter { Enabled -eq $true -and OperatingSystem -like '*Windows 8*' } -Properties OperatingSystem, LastLogonDate | Select-Object Name, OperatingSystem, LastLogonDate","Effort":"High","Minutes":480,"Ref":"https://learn.microsoft.com/en-us/lifecycle/products/windows-81","FixFR":"Remplacez ou mettez à niveau les machines Windows 8 / 8.1 vers une version supportée (Windows 11 pour les postes, Windows Server 2022 ou 2025 pour les serveurs). En attendant, isolez-les sur le réseau et désactivez les comptes des machines qui n'existent plus."},"T-ScriptOutOfDomain":{"Fix":"A logon script (user scriptPath or GPO script) is stored in another domain. Whoever controls that domain can change it and run code as your users. Copy the script to your own NETLOGON or SYSVOL and update the path in the accounts or GPO named in the report.","Check":"$me = (Get-ADDomain).DNSRoot; Get-ADUser -LDAPFilter '(scriptPath=\\5c\\5c*)' -Properties scriptPath | Where-Object { $_.scriptPath -notlike \"\\\\$me\\*\" } | Select-Object SamAccountName, scriptPath","Effort":"Low","Minutes":30,"Ref":"","FixFR":"Un script de connexion (scriptPath d'un utilisateur ou script de GPO) est stocké dans un autre domaine. Celui qui contrôle ce domaine peut le modifier et lancer du code au nom de vos utilisateurs. Copiez le script dans votre propre NETLOGON ou SYSVOL et mettez à jour le chemin dans les comptes ou la GPO cités dans le rapport."},"P-FakePwdChangeAdmin":{"Fix":"These admin accounts have a recent pwdLastSet but their real password (unicodePwd) did not change: the reset was faked with the 'User must change password' trick, so the old password still works. Reset the password for real now, find who did it (event 4738 on the DCs) and review everything the account did since then.","Check":"$dc = (Get-ADDomainController).HostName; Get-ADUser -LDAPFilter '(adminCount=1)' | ForEach-Object { $m = Get-ADReplicationAttributeMetadata -Object $_.DistinguishedName -Server $dc -Properties pwdLastSet, unicodePwd; $p = ($m | Where-Object AttributeName -eq 'pwdLastSet').LastOriginatingChangeTime; $u = ($m | Where-Object AttributeName -eq 'unicodePwd').LastOriginatingChangeTime; if ($p -gt $u.AddDays(1)) { [pscustomobject]@{ User = $_.SamAccountName; pwdLastSet = $p; RealPasswordChange = $u } } }","Effort":"Low","Minutes":30,"Ref":"https://learn.microsoft.com/en-us/powershell/module/activedirectory/get-adreplicationattributemetadata","FixFR":"Ces comptes admin ont un pwdLastSet récent mais leur vrai mot de passe (unicodePwd) n'a pas changé : la réinitialisation a été simulée avec l'astuce 'L'utilisateur doit changer le mot de passe', donc l'ancien mot de passe marche encore. Réinitialisez vraiment le mot de passe tout de suite, cherchez qui l'a fait (événement 4738 sur les DC) et vérifiez tout ce que le compte a fait depuis."},"S-C-Reversible":{"Fix":"These computer accounts store their password with reversible encryption. Remove the option: Set-ADComputer <name> -AllowReversiblePasswordEncryption $false, then reset the machine password (Test-ComputerSecureChannel -Repair on the machine) so the clear text copy goes away.","Check":"Get-ADComputer -LDAPFilter '(userAccountControl:1.2.840.113556.1.4.803:=128)' | Select-Object Name, Enabled","Effort":"Low","Minutes":15,"Ref":"https://learn.microsoft.com/en-us/windows/security/threat-protection/security-policy-settings/store-passwords-using-reversible-encryption","FixFR":"Ces comptes ordinateurs stockent leur mot de passe avec un chiffrement réversible. Retirez l'option : Set-ADComputer <nom> -AllowReversiblePasswordEncryption $false, puis réinitialisez le mot de passe machine (Test-ComputerSecureChannel -Repair sur la machine) pour que la copie en clair disparaisse."},"P-ProtectedUsers":{"Fix":"These admin accounts are not in Protected Users, so their credentials can be cached or used with NTLM, DES, RC4 and delegation. Add them to the group (Add-ADGroupMember -Identity <domain SID>-525 -Members <name>) after a test with one account. Do not add service or computer accounts, and keep one break glass admin outside the group.","Check":"$s = (Get-ADDomain).DomainSID; $pu = @(Get-ADGroupMember -Identity \"$s-525\").distinguishedName; Get-ADGroupMember -Identity 'S-1-5-32-544' -Recursive | Where-Object objectClass -eq 'user' | Get-ADUser -Properties Enabled | Where-Object { $_.Enabled -and $pu -notcontains $_.DistinguishedName } | Select-Object SamAccountName","Effort":"Medium","Minutes":60,"Ref":"https://learn.microsoft.com/en-us/windows-server/security/credentials-protection-and-management/protected-users-security-group","FixFR":"Ces comptes admin ne sont pas dans Protected Users : leurs identifiants peuvent donc être mis en cache ou utilisés avec NTLM, DES, RC4 et la délégation. Ajoutez-les au groupe (Add-ADGroupMember -Identity <SID du domaine>-525 -Members <nom>) après un test avec un seul compte. N'y mettez pas de comptes de service ou d'ordinateur, et gardez un admin de secours hors du groupe."},"A-BackupMetadata":{"Fix":"Back up the system state of at least one DC per domain on a regular schedule, with a tool that does a real AD backup (this updates the backup date PingCastle reads). Example: wbadmin start systemstatebackup -backuptarget:E: . Test a restore from time to time.","Check":"repadmin /showbackup *","Effort":"Low","Minutes":30,"Ref":"https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2008-R2-and-2008/jj130668(v=ws.10)","FixFR":"Sauvegardez l'état système d'au moins un DC par domaine de façon régulière, avec un outil qui fait une vraie sauvegarde AD (cela met à jour la date de sauvegarde lue par PingCastle). Exemple : wbadmin start systemstatebackup -backuptarget:E: . Testez une restauration de temps en temps."},"A-CertTempAnyPurpose":{"Fix":"A template that low privileged users can enroll in has the 'Any Purpose' EKU or no EKU at all, so the certificate can be used for client authentication or as a sub CA (ESC2). In certtmpl.msc, fix the template: on Extensions > Application Policies set only the EKUs really needed; or remove Enroll from wide groups on the Security tab; or tick CA certificate manager approval. If it is not used, remove it from the CA.","Check":"$cfg = (Get-ADRootDSE).configurationNamingContext; Get-ADObject -SearchBase \"CN=Certificate Templates,CN=Public Key Services,CN=Services,$cfg\" -Filter * -Properties pKIExtendedKeyUsage, msPKI-Certificate-Application-Policy | Select-Object Name, pKIExtendedKeyUsage | Where-Object { -not $_.pKIExtendedKeyUsage -or $_.pKIExtendedKeyUsage -contains '2.5.29.37.0' }","Effort":"Low","Minutes":30,"Ref":"https://posts.specterops.io/certified-pre-owned-d95910965cd2","FixFR":"Un modèle ouvert aux utilisateurs peu privilégiés a l'EKU 'Any Purpose' ou aucun EKU : le certificat peut donc servir à l'authentification client ou comme sous-AC (ESC2). Dans certtmpl.msc, corrigez le modèle : dans Extensions > Stratégies d'application, gardez seulement les EKU vraiment utiles ; ou retirez Inscrire aux groupes larges dans l'onglet Sécurité ; ou cochez l'approbation du gestionnaire de certificats de l'AC. S'il ne sert pas, retirez-le de l'AC."},"T-SIDFiltering":{"Fix":"For an external (domain) trust: netdom trust <YourDomain> /domain:<OtherDomain> /quarantine:yes. For a forest trust: netdom trust <YourForest> /domain:<OtherForest> /enablesidhistory:no. Never use /quarantine on a forest trust (it breaks transitivity). Finish any running migration first.","Check":"Get-ADTrust -Filter * | Select-Object Name, Direction, ForestTransitive, SIDFilteringQuarantined, SIDFilteringForestAware","Effort":"Low","Minutes":15,"Ref":"https://learn.microsoft.com/en-us/openspecs/windows_protocols/ms-pac/55fc19f2-55ba-4251-8a6a-103dd7c66280","FixFR":"Pour une approbation externe (de domaine) : netdom trust <VotreDomaine> /domain:<AutreDomaine> /quarantine:yes. Pour une approbation de forêt : netdom trust <VotreForêt> /domain:<AutreForêt> /enablesidhistory:no. N'utilisez jamais /quarantine sur une approbation de forêt (cela casse la transitivité). Terminez d'abord toute migration en cours."},"A-SHA0IntermediateCert":{"Fix":"A SHA-0 signed intermediate CA certificate is pushed by a GPO (Public Key Policies) or stored in NTAuth; the report gives the source and the subject. Remove it there. If it is still in use, replace it with a new certificate (SHA-256 signature, RSA 2048 bits or more) first, then reissue the certificates that depend on it.","Check":"Get-ChildItem Cert:\\LocalMachine\\Root, Cert:\\LocalMachine\\CA | Where-Object { $_.SignatureAlgorithm.FriendlyName -notmatch 'sha256|sha384|sha512|ecdsa' } | Select-Object PSParentPath, Subject, Thumbprint, NotAfter; certutil -enterprise -store NTAuth","Effort":"Medium","Minutes":120,"Ref":"https://tools.ietf.org/html/rfc6194","FixFR":"Un certificat d'AC intermédiaire signé en SHA-0 est poussé par une GPO (Public Key Policies) ou présent dans NTAuth ; le rapport donne la source et le sujet. Retirez-le à cet endroit. S'il sert encore, remplacez-le d'abord par un nouveau certificat (signature SHA-256, RSA 2048 bits ou plus), puis réémettez les certificats qui en dépendent."},"T-Inactive":{"Fix":"Check if the remote domain still exists and can be reached. If it is gone, delete the trust (Active Directory Domains and Trusts). If it still exists, fix the network or DNS so the trust password rotates again.","Check":"Get-ADObject -LDAPFilter '(objectClass=trustedDomain)' -Properties whenChanged | Select-Object Name, whenChanged","Effort":"Low","Minutes":15,"Ref":"","FixFR":"Vérifiez si le domaine distant existe encore et s'il est joignable. S'il a disparu, supprimez l'approbation (Active Directory Domains and Trusts). S'il existe encore, réparez le réseau ou le DNS pour que le mot de passe de l'approbation tourne à nouveau."},"A-DC-Spooler":{"Fix":"The Print Spooler runs on DCs, so anyone can force a DC to authenticate to another machine (PrinterBug) and abuse it. In a GPO linked to the Domain Controllers OU, set Computer Configuration > Policies > Windows Settings > Security Settings > System Services > Print Spooler to Disabled. The only loss is printer pruning, rarely used.","Check":"Get-CimInstance Win32_Service -Filter \"Name='Spooler'\" -ComputerName (Get-ADDomainController -Filter *).HostName | Select-Object PSComputerName, State, StartMode","Effort":"Low","Minutes":10,"Ref":"https://learn.microsoft.com/en-us/windows-server/security/windows-services/security-guidelines-for-disabling-system-services-in-windows-server","FixFR":"Le Spouleur d'impression tourne sur les DC : n'importe qui peut donc forcer un DC à s'authentifier sur une autre machine (PrinterBug) et en abuser. Dans une GPO liée à l'OU Domain Controllers, mettez Computer Configuration > Policies > Windows Settings > Security Settings > System Services > Print Spooler sur Disabled. La seule perte est le nettoyage des imprimantes publiées, rarement utilisé."},"P-SchemaAdmin":{"Fix":"Remove all members of Schema Admins. Add an account only for a planned schema update, then remove it right after.","Check":"$r = Get-ADDomain (Get-ADForest).RootDomain; Get-ADGroupMember -Identity \"$($r.DomainSID)-518\" -Server $r.PDCEmulator","Effort":"Low","Minutes":5,"Ref":"","FixFR":"Retirez tous les membres de Schema Admins. Ajoutez un compte seulement pour une mise à jour du schéma prévue, puis retirez-le juste après."},"P-LoginDCEveryone":{"Fix":"A GPO applied to DCs grants 'Allow log on locally' or 'Allow log on through Remote Desktop Services' to Everyone, Authenticated Users, Domain Users, Domain Computers or Users. Edit the GPO named in the report (Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > User Rights Assignment) and keep only Administrators (and Backup Operators if used) for these rights.","Check":"Get-GPO -All | Where-Object { (Get-GPOReport -Guid $_.Id -ReportType Xml) -match 'SeInteractiveLogonRight|SeRemoteInteractiveLogonRight' } | Select-Object DisplayName","Effort":"Low","Minutes":15,"Ref":"https://learn.microsoft.com/en-us/windows/security/threat-protection/security-policy-settings/allow-log-on-locally","FixFR":"Une GPO appliquée aux DC donne 'Allow log on locally' ou 'Allow log on through Remote Desktop Services' à Everyone, Authenticated Users, Domain Users, Domain Computers ou Users. Modifiez la GPO citée dans le rapport (Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > User Rights Assignment) et gardez seulement Administrators (et Backup Operators s'il sert) pour ces droits."},"P-DelegationKeyAdmin":{"Fix":"A Windows Server 2016 setup bug gave Enterprise Key Admins full control on the domain root instead of only read and write on msDS-KeyCredentialLink. On the domain root (ADUC > Security > Advanced), edit the Enterprise Key Admins entry so it only has Read and Write on msKeyCredentialLink for Descendant objects (or use the Microsoft script). Check first that Windows Hello for Business still works.","Check":"$s = (Get-ADDomain).DomainSID; $d = (Get-ADDomain).DistinguishedName; (Get-Acl -Path \"AD:\\$d\").Access | Where-Object { $(try { $_.IdentityReference.Translate([System.Security.Principal.SecurityIdentifier]).Value } catch { $_.IdentityReference.Value }) -eq \"$s-527\" } | Select-Object IdentityReference, ActiveDirectoryRights, ObjectType, InheritanceType","Effort":"Low","Minutes":20,"Ref":"https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/understand-security-groups#enterprise-key-admins","FixFR":"Un bug de l'installation de Windows Server 2016 a donné à Enterprise Key Admins le contrôle total sur la racine du domaine, au lieu de la seule lecture et écriture de msDS-KeyCredentialLink. Sur la racine du domaine (ADUC > Sécurité > Avancé), modifiez l'entrée Enterprise Key Admins pour qu'elle n'ait que Lecture et Écriture sur msKeyCredentialLink pour les objets descendants (ou utilisez le script Microsoft). Vérifiez d'abord que Windows Hello for Business marche toujours."},"S-DC-Inactive":{"Fix":"A DC hasn't logged on for 45+ days. If it still runs, fix it or demote it properly. If it is dead, delete its computer account from the 'Domain Controllers' OU in ADUC (this runs the metadata cleanup), then remove its leftover DNS records.","Check":"Get-ADDomainController -Filter * | ForEach-Object { Get-ADComputer $_.ComputerObjectDN -Properties LastLogonDate } | Select-Object Name, LastLogonDate","Effort":"Medium","Minutes":60,"Ref":"https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/deploy/ad-ds-metadata-cleanup","FixFR":"Un DC ne s'est pas connecté depuis plus de 45 jours. S'il tourne encore, réparez-le ou rétrogradez-le proprement. S'il est mort, supprimez son compte ordinateur de l'OU 'Domain Controllers' dans ADUC (cela lance le nettoyage des métadonnées), puis supprimez ses enregistrements DNS restants."},"S-PwdLastSet-DC":{"Fix":"A DC has not changed its machine password for more than 45 days while still active. A DC account password known by an attacker gives DCSync rights. Check the 'Domain member: Disable machine account password changes' and 'Domain controller: Refuse machine account password changes' settings and the Netlogon registry values on that DC (DisablePasswordChange 0 or absent, MaximumPasswordAge 30). If nothing explains it, treat it as a possible compromise and reset it (netdom resetpwd).","Check":"Get-ADComputer -LDAPFilter '(primaryGroupID=516)' -Properties PasswordLastSet, LastLogonDate | Select-Object Name, PasswordLastSet, LastLogonDate","Effort":"Low","Minutes":30,"Ref":"https://learn.microsoft.com/en-us/troubleshoot/windows-server/windows-security/disable-machine-account-password","FixFR":"Un DC n'a pas changé son mot de passe machine depuis plus de 45 jours alors qu'il est encore actif. Un mot de passe de compte DC connu d'un attaquant donne les droits DCSync. Vérifiez les paramètres 'Domain member: Disable machine account password changes' et 'Domain controller: Refuse machine account password changes' et les valeurs de registre Netlogon sur ce DC (DisablePasswordChange à 0 ou absente, MaximumPasswordAge à 30). Si rien ne l'explique, considérez-le comme une compromission possible et réinitialisez-le (netdom resetpwd)."},"P-RecoveryModeUnprotected":{"Fix":"A GPO turns on 'Recovery console: Allow automatic administrative logon', so anyone at the keyboard can open the recovery console as admin without a password. Edit the GPO named in the report (Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options) and set it to Disabled.","Check":"Get-GPO -All | Where-Object { (Get-GPOReport -Guid $_.Id -ReportType Xml) -match 'RecoveryConsole' } | Select-Object DisplayName","Effort":"Low","Minutes":10,"Ref":"https://learn.microsoft.com/en-us/windows/security/threat-protection/security-policy-settings/recovery-console-allow-automatic-administrative-logon","FixFR":"Une GPO active 'Recovery console: Allow automatic administrative logon' : n'importe qui devant le clavier peut donc ouvrir la console de récupération en admin, sans mot de passe. Modifiez la GPO citée dans le rapport (Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options) et mettez-le sur Disabled."},"A-CertWeakRsaComponent":{"Fix":"A RSA key with a weak public exponent (below 65537) certificate is pushed by a GPO (Public Key Policies) or stored in NTAuth; the report gives the source and the subject. Remove it there. If it is still in use, replace it with a new certificate (SHA-256 signature, RSA 2048 bits or more) first, then reissue the certificates that depend on it.","Check":"Get-ChildItem Cert:\\LocalMachine\\Root, Cert:\\LocalMachine\\CA | Where-Object { $_.PublicKey.Oid.FriendlyName -eq 'RSA' -and [System.Security.Cryptography.X509Certificates.RSACertificateExtensions]::GetRSAPublicKey($_).ExportParameters($false).Exponent.Length -lt 3 } | Select-Object PSParentPath, Subject, Thumbprint, NotAfter; certutil -enterprise -store NTAuth","Effort":"Medium","Minutes":120,"Ref":"","FixFR":"Un certificat à clé RSA avec un exposant public faible (moins de 65537) est poussé par une GPO (Public Key Policies) ou présent dans NTAuth ; le rapport donne la source et le sujet. Retirez-le à cet endroit. S'il sert encore, remplacez-le d'abord par un nouveau certificat (signature SHA-256, RSA 2048 bits ou plus), puis réémettez les certificats qui en dépendent."},"A-MinPwdLen":{"Fix":"A password policy (GPO or fine grained policy) allows passwords shorter than 8 characters. Raise the minimum to at least 12 (PingCastle only needs 8). The domain GPO can't go above 14; use a fine grained policy for longer. Users get the new rule at their next password change.","Check":"Get-ADDefaultDomainPasswordPolicy | Select-Object MinPasswordLength; Get-ADFineGrainedPasswordPolicy -Filter * | Select-Object Name, MinPasswordLength, AppliesTo","Effort":"Medium","Minutes":60,"Ref":"https://learn.microsoft.com/en-us/windows/security/threat-protection/security-policy-settings/minimum-password-length","FixFR":"Une stratégie de mot de passe (GPO ou stratégie affinée) autorise des mots de passe de moins de 8
