caractères. Montez le minimum à au moins 12 (PingCastle n'exige que 8). La GPO de domaine ne peut pas dépasser 14 : utilisez une stratégie de mot de passe affinée pour aller plus loin. Les utilisateurs reçoivent la nouvelle règle à leur prochain changement de mot de passe."},"A-WeakRSARootCert":{"Fix":"A weak RSA key (under 1024 bits; the check also lists keys under 2048 bits, to replace next) certificate is pushed by a GPO (Public Key Policies) or stored in NTAuth; the report gives the source and the subject. Remove it there. If it is still in use, replace it with a new certificate (SHA-256 signature, RSA 2048 bits or more) first, then reissue the certificates that depend on it.","Check":"Get-ChildItem Cert:\\LocalMachine\\Root, Cert:\\LocalMachine\\CA | Where-Object { $_.PublicKey.Oid.FriendlyName -eq 'RSA' -and [System.Security.Cryptography.X509Certificates.RSACertificateExtensions]::GetRSAPublicKey($_).KeySize -lt 2048 } | Select-Object PSParentPath, Subject, Thumbprint, NotAfter; certutil -enterprise -store NTAuth","Effort":"Medium","Minutes":120,"Ref":"https://media.defense.gov/2022/Sep/07/2003071836/-1/-1/0/CSI_CNSA_2.0_FAQ_.PDF","FixFR":"Un certificat à clé RSA faible (moins de 1024 bits ; la vérification liste aussi les clés de moins de 2048 bits, à remplacer ensuite) est poussé par une GPO (Public Key Policies) ou présent dans NTAuth ; le rapport donne la source et le sujet. Retirez-le à cet endroit. S'il sert encore, remplacez-le d'abord par un nouveau certificat (signature SHA-256, RSA 2048 bits ou plus), puis réémettez les certificats qui en dépendent."},"S-NoPreAuth":{"Fix":"These accounts do not require Kerberos pre-authentication, so anyone can ask for data encrypted with their password and crack it offline (AS-REP roasting). Untick 'Do not require Kerberos preauthentication' on the Account tab, or run Set-ADAccountControl <name> -DoesNotRequirePreAuth $false (it also works for computers).","Check":"Get-ADObject -LDAPFilter '(userAccountControl:1.2.840.113556.1.4.803:=4194304)' | Select-Object Name, ObjectClass","Effort":"Low","Minutes":10,"Ref":"http://www.harmj0y.net/blog/activedirectory/roasting-as-reps/","FixFR":"Ces comptes n'exigent pas la pré-authentification Kerberos : n'importe qui peut donc demander des données chiffrées avec leur mot de passe et les casser hors ligne (AS-REP roasting). Décochez 'Do not require Kerberos preauthentication' dans l'onglet Compte, ou lancez Set-ADAccountControl <nom> -DoesNotRequirePreAuth $false (cela marche aussi pour les ordinateurs)."},"A-MD5RootCert":{"Fix":"A MD5 signed root certificate is pushed by a GPO (Public Key Policies) or stored in NTAuth; the report gives the source and the subject. Remove it there. If it is still in use, replace it with a new certificate (SHA-256 signature, RSA 2048 bits or more) first, then reissue the certificates that depend on it.","Check":"Get-ChildItem Cert:\\LocalMachine\\Root, Cert:\\LocalMachine\\CA | Where-Object { $_.SignatureAlgorithm.FriendlyName -notmatch 'sha256|sha384|sha512|ecdsa' } | Select-Object PSParentPath, Subject, Thumbprint, NotAfter; certutil -enterprise -store NTAuth","Effort":"Medium","Minutes":120,"Ref":"https://www.kb.cert.org/vuls/id/836068","FixFR":"Un certificat racine signé en MD5 est poussé par une GPO (Public Key Policies) ou présent dans NTAuth ; le rapport donne la source et le sujet. Retirez-le à cet endroit. S'il sert encore, remplacez-le d'abord par un nouveau certificat (signature SHA-256, RSA 2048 bits ou plus), puis réémettez les certificats qui en dépendent."},"P-RecycleBin":{"Fix":"The AD Recycle Bin is off, so a deleted object (or OU) loses most of its attributes and is hard to restore. With a forest functional level of 2008 R2 or higher, run: Enable-ADOptionalFeature -Identity 'Recycle Bin Feature' -Scope ForestOrConfigurationSet -Target (Get-ADForest).Name. It can't be turned off afterwards and only helps for objects deleted after that.","Check":"Get-ADOptionalFeature -Filter \"Name -eq 'Recycle Bin Feature'\" | Select-Object Name, EnabledScopes","Effort":"Low","Minutes":5,"Ref":"https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/get-started/adac/introduction-to-active-directory-administrative-center-enhancements--level-100-#ad-recycle-bin","FixFR":"La corbeille AD est désactivée : un objet (ou une OU) supprimé perd donc la plupart de ses attributs et se restaure mal. Avec un niveau fonctionnel de forêt 2008 R2 ou plus, lancez : Enable-ADOptionalFeature -Identity 'Recycle Bin Feature' -Scope ForestOrConfigurationSet -Target (Get-ADForest).Name. Elle ne peut plus être désactivée ensuite et ne sert que pour les objets supprimés après."},"A-BadSuccessor":{"Fix":"Non admin accounts can create or control dMSA objects in these OUs (BadSuccessor). Install the August 2025 or later updates on all Windows Server 2025 DCs (CVE-2025-53779). Then on each OU listed, remove from non admin accounts the rights Create all child objects, Create msDS-DelegatedManagedServiceAccount objects, Full control, Modify permissions and Modify owner. Keep these rights for Tier 0 admins only.","Check":"Get-ADOrganizationalUnit -Filter * | ForEach-Object { $ou = $_.DistinguishedName; (Get-Acl -Path \"AD:\\$ou\").Access | Where-Object { $_.AccessControlType -eq 'Allow' -and $_.ActiveDirectoryRights -match 'CreateChild|GenericAll|WriteDacl|WriteOwner' -and $(try { $_.IdentityReference.Translate([System.Security.Principal.SecurityIdentifier]).Value } catch { 'unknown' }) -notmatch '^S-1-5-(18|9|32-544)$|-51[29]$' } | Select-Object @{ n = 'OU'; e = { $ou } }, IdentityReference, ActiveDirectoryRights }","Effort":"Medium","Minutes":60,"Ref":"https://www.akamai.com/blog/security-research/abusing-dmsa-for-privilege-escalation-in-active-directory","FixFR":"Des comptes non admin peuvent créer ou contrôler des objets dMSA dans ces OU (BadSuccessor). Installez les mises à jour d'août 2025 ou plus récentes sur tous les DC Windows Server 2025 (CVE-2025-53779). Ensuite, sur chaque OU listée, retirez aux comptes non admin les droits Create all child objects, Create msDS-DelegatedManagedServiceAccount objects, Full control, Modify permissions et Modify owner. Gardez ces droits pour les admins Tier 0 uniquement."},"S-PwdLastSet-Cluster":{"Fix":"These failover cluster name accounts have kept the same password for more than 3 years. Check the cluster event logs and that the cluster can still write to its AD objects. Then reset the password from Failover Cluster Manager (cluster name resource > More Actions > Repair) or with Update-ClusterNetworkNameResource on a cluster node.","Check":"Get-ADComputer -LDAPFilter '(servicePrincipalName=MSClusterVirtualServer/*)' -Properties PasswordLastSet | Select-Object Name, PasswordLastSet","Effort":"Low","Minutes":30,"Ref":"https://learn.microsoft.com/en-us/windows-server/failover-clustering/configure-ad-accounts","FixFR":"Ces comptes de nom de cluster de basculement ont le même mot de passe depuis plus de 3 ans. Vérifiez les journaux d'événements du cluster et que le cluster peut toujours écrire sur ses objets AD. Réinitialisez ensuite le mot de passe depuis le Gestionnaire du cluster de basculement (ressource nom du cluster > Plus d'actions > Réparer) ou avec Update-ClusterNetworkNameResource sur un nœud du cluster."},"P-DangerousExtendedRight":{"Fix":"A delegation gives one of these rare rights: Reanimate tombstones, Unexpire password or Migrate SID history. They can be used to bring back deleted admins, reuse expired passwords or inject SID History. Remove them unless you can explain why they exist (a migration in progress). If no one knows who added them, investigate.","Check":"$d = (Get-ADDomain).DistinguishedName; (Get-Acl -Path \"AD:\\$d\").Access | Where-Object { $_.ObjectType -in '45ec5156-db7e-47bb-b53f-dbeb2d03c40f', 'ccc2dc7d-a6ad-4a7a-8846-c04e3cc53501', 'ba33815a-4f93-4c76-87f3-57574bff8109' } | Select-Object IdentityReference, ObjectType, IsInherited","Effort":"Low","Minutes":15,"Ref":"https://learn.microsoft.com/en-us/windows/win32/adschema/extended-rights","FixFR":"Une délégation donne un de ces droits rares : Reanimate tombstones, Unexpire password ou Migrate SID history. Ils peuvent servir à faire revenir des admins supprimés, réutiliser des mots de passe expirés ou injecter du SID History. Retirez-les sauf si vous pouvez expliquer pourquoi ils existent (une migration en cours). Si personne ne sait qui les a ajoutés, enquêtez."},"T-FileDeployedOutOfDomain":{"Fix":"A GPO deploys a file stored in another domain. Whoever controls that other domain can change the file and run code in yours. Copy the file to a share of your own domain (SYSVOL or a share with admin only write), then update the path in the GPO named in the report.","Check":"Get-GPO -All | Where-Object { (Get-GPOReport -Guid $_.Id -ReportType Xml) -match 'Files|Software Installation|Shortcuts|msiPath' } | Select-Object DisplayName","Effort":"Low","Minutes":30,"Ref":"","FixFR":"Une GPO déploie un fichier stocké dans un autre domaine. Celui qui contrôle cet autre domaine peut modifier le fichier et lancer du code dans le vôtre. Copiez le fichier sur un partage de votre propre domaine (SYSVOL ou un partage où seuls les admins écrivent), puis mettez à jour le chemin dans la GPO citée dans le rapport."},"P-DelegationDCt2a4d":{"Fix":"These accounts have constrained delegation with protocol transition ('Use any authentication protocol') to a service of a DC. Anyone controlling them can get a ticket as any admin to the DC without a password. Remove the DC SPNs from msDS-AllowedToDelegateTo, untick protocol transition (Set-ADAccountControl <name> -TrustedToAuthForDelegation $false) and investigate why it was set.","Check":"$dcs = (Get-ADDomainController -Filter *).Name; Get-ADObject -LDAPFilter '(msDS-AllowedToDelegateTo=*)' -Properties msDS-AllowedToDelegateTo, userAccountControl | Where-Object { $o = $_; $dcs | Where-Object { $n = $_; $o.'msDS-AllowedToDelegateTo' | Where-Object { $_ -match \"/$n(\\.|$|:)\" } } } | Where-Object { $_.userAccountControl -band 0x1000000 } | Select-Object Name, @{ n = 'Protocol transition'; e = { [bool]($_.userAccountControl -band 0x1000000) } }, msDS-AllowedToDelegateTo","Effort":"Low","Minutes":30,"Ref":"https://learn.microsoft.com/en-us/windows-server/security/kerberos/kerberos-constrained-delegation-overview","FixFR":"Ces comptes ont une délégation contrainte avec transition de protocole ('Utiliser tout protocole d'authentification') vers un service d'un DC. Quiconque les contrôle peut obtenir un ticket au nom de n'importe quel admin auprès du DC, sans mot de passe. Retirez les SPN des DC de msDS-AllowedToDelegateTo, désactivez la transition de protocole (Set-ADAccountControl <nom> -TrustedToAuthForDelegation $false) et cherchez pourquoi elle a été mise."},"S-OS-2000":{"Fix":"Replace or upgrade the Windows 2000 machines to a supported version (Windows 11 for workstations, Windows Server 2022 or 2025 for servers). Until then, isolate them on the network and disable the accounts of the machines that are gone.","Check":"Get-ADComputer -Filter { Enabled -eq $true -and OperatingSystem -like '*Windows 2000*' } -Properties OperatingSystem, LastLogonDate | Select-Object Name, OperatingSystem, LastLogonDate","Effort":"High","Minutes":480,"Ref":"","FixFR":"Remplacez ou mettez à niveau les machines Windows 2000 vers une version supportée (Windows 11 pour les postes, Windows Server 2022 ou 2025 pour les serveurs). En attendant, isolez-les sur le réseau et désactivez les comptes des machines qui n'existent plus."},"A-SMB2SignatureNotRequired":{"Fix":"A DC does not require SMB signing, so SMB relay to the DC is possible. In the Default Domain Controllers Policy (or a GPO on the Domain Controllers OU), set 'Microsoft network server: Digitally sign communications (always)' to Enabled. It is the default on DCs, so also look for a GPO that disables it.","Check":"Invoke-Command -ComputerName (Get-ADDomainController -Filter *).HostName -ScriptBlock { Get-SmbServerConfiguration | Select-Object PSComputerName, EnableSecuritySignature, RequireSecuritySignature }","Effort":"Low","Minutes":15,"Ref":"https://learn.microsoft.com/en-us/openspecs/windows_protocols/ms-smb2/36172e53-ac81-48fb-b2e3-caa3761b9157","FixFR":"Un DC n'exige pas la signature SMB : un relais SMB vers le DC est donc possible. Dans la Default Domain Controllers Policy (ou une GPO sur l'OU Domain Controllers), mettez 'Microsoft network server: Digitally sign communications (always)' sur Enabled. C'est le comportement par défaut sur les DC : cherchez donc aussi une GPO qui la désactive."},"A-DCLdapsProtocol":{"Fix":"A DC still offers SSL 2.0 or SSL 3.0 on LDAPS (port 636). On each DC, create the SCHANNEL keys 'SSL 2.0\\Server' and 'SSL 3.0\\Server' with Enabled = 0 and DisabledByDefault = 1, then reboot the DC (in the check, an empty value means the Windows default). Plan to turn off TLS 1.0 and 1.1 too, after testing old clients.","Check":"'SSL 2.0','SSL 3.0' | % { [pscustomobject]@{ Protocol = $_; Enabled = (Get-ItemProperty \"HKLM:\\SYSTEM\\CurrentControlSet\\Control\\SecurityProviders\\SCHANNEL\\Protocols\\$_\\Server\" -ErrorAction SilentlyContinue).Enabled } }","Effort":"Medium","Minutes":60,"Ref":"https://learn.microsoft.com/en-us/dotnet/framework/network-programming/tls#configuring-schannel-protocols-in-the-windows-registry","FixFR":"Un DC propose encore SSL 2.0 ou SSL 3.0 en LDAPS (port 636). Sur chaque DC, créez les clés SCHANNEL 'SSL 2.0\\Server' et 'SSL 3.0\\Server' avec Enabled = 0 et DisabledByDefault = 1, puis redémarrez le DC (dans la vérification, une valeur vide signifie le comportement par défaut de Windows). Prévoyez aussi de désactiver TLS 1.0 et 1.1, après avoir testé les anciens clients."},"P-UnkownDelegation":{"Fix":"A permission is given to a SID that can't be resolved: the account was deleted or comes from a domain that is no longer trusted. If a new account gets the same SID (through SID History for example) it gets the rights. Remove these entries on the objects listed (ADUC > Security > Advanced).","Check":"$d = (Get-ADDomain).DistinguishedName; @($d) + @(Get-ADOrganizationalUnit -Filter *).DistinguishedName | ForEach-Object { $o = $_; (Get-Acl -Path \"AD:\\$o\").Access | Where-Object { $_.IdentityReference.Value -like 'S-1-5-21-*' } | Select-Object @{ n = 'Object'; e = { $o } }, IdentityReference, ActiveDirectoryRights }","Effort":"Low","Minutes":20,"Ref":"https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/understand-security-identifiers","FixFR":"Une permission est donnée à un SID qui ne se résout pas : le compte a été supprimé ou vient d'un domaine qui n'est plus approuvé. Si un nouveau compte obtient le même SID (par le SID History par exemple), il obtient les droits. Supprimez ces entrées sur les objets listés (ADUC > Sécurité > Avancé)."},"T-AlgsAES":{"Fix":"This trust does not allow AES for Kerberos, so it uses RC4, which is weak and being phased out. To keep RC4 during the transition run on both sides: ksetup /setenctypeattr <trust> RC4-HMAC-MD5 AES128-CTS-HMAC-SHA1-96 AES256-CTS-HMAC-SHA1-96. The checkbox 'The other domain supports Kerberos AES Encryption' in the trust properties turns on AES and turns off RC4 at once, so use it only when both sides are ready.","Check":"Get-ADTrust -Filter * -Properties msDS-SupportedEncryptionTypes | Select-Object Name, Direction, msDS-SupportedEncryptionTypes","Effort":"Low","Minutes":20,"Ref":"https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/ksetup-setenctypeattr","FixFR":"Cette approbation n'autorise pas AES pour Kerberos : elle utilise donc RC4, faible et en cours d'abandon. Pour garder RC4 pendant la transition, lancez des deux côtés : ksetup /setenctypeattr <approbation> RC4-HMAC-MD5 AES128-CTS-HMAC-SHA1-96 AES256-CTS-HMAC-SHA1-96. La case 'The other domain supports Kerberos AES Encryption' des propriétés de l'approbation active AES et désactive RC4 en même temps : utilisez-la seulement quand les deux côtés sont prêts."},"A-MD4IntermediateCert":{"Fix":"A MD4 signed intermediate CA certificate is pushed by a GPO (Public Key Policies) or stored in NTAuth; the report gives the source and the subject. Remove it there. If it is still in use, replace it with a new certificate (SHA-256 signature, RSA 2048 bits or more) first, then reissue the certificates that depend on it.","Check":"Get-ChildItem Cert:\\LocalMachine\\Root, Cert:\\LocalMachine\\CA | Where-Object { $_.SignatureAlgorithm.FriendlyName -notmatch 'sha256|sha384|sha512|ecdsa' } | Select-Object PSParentPath, Subject, Thumbprint, NotAfter; certutil -enterprise -store NTAuth","Effort":"Medium","Minutes":120,"Ref":"https://tools.ietf.org/html/rfc6150","FixFR":"Un certificat d'AC intermédiaire signé en MD4 est poussé par une GPO (Public Key Policies) ou présent dans NTAuth ; le rapport donne la source et le sujet. Retirez-le à cet endroit. S'il sert encore, remplacez-le d'abord par un nouveau certificat (signature SHA-256, RSA 2048 bits ou plus), puis réémettez les certificats qui en dépendent."},"P-ServiceDomainAdmin":{"Fix":"Some Domain Admins members have a password that never expires, often service accounts. Take service accounts out of Domain Admins and give them only the rights they need, ideally as gMSA (automatic password change). For real admins, untick 'Password never expires' and change the password.","Check":"$s = (Get-ADDomain).DomainSID; Get-ADGroupMember -Identity \"$s-512\" -Recursive | Where-Object objectClass -eq 'user' | Get-ADUser -Properties PasswordNeverExpires, PasswordLastSet | Where-Object PasswordNeverExpires | Select-Object SamAccountName, PasswordLastSet","Effort":"Medium","Minutes":120,"Ref":"https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/group-managed-service-accounts/group-managed-service-accounts/group-managed-service-accounts-overview","FixFR":"Certains membres de Domain Admins ont un mot de passe qui n'expire jamais, souvent des comptes de service. Sortez les comptes de service de Domain Admins et donnez-leur seulement les droits nécessaires, idéalement en gMSA (changement automatique du mot de passe). Pour les vrais admins, décochez 'Password never expires' et changez le mot de passe."},"S-FunctionalLevel4":{"Fix":"The domain or forest functional level is Windows Server 2012 R2. Make sure all DCs run Windows Server 2016 or later (ideally 2022 or 2025), then raise the domain level and after that the forest level: Set-ADDomainMode -Identity (Get-ADDomain) -DomainMode Windows2016Domain, then Set-ADForestMode -Identity (Get-ADForest) -ForestMode Windows2016Forest. Check replication before and after.","Check":"Get-ADDomain | Select-Object DomainMode; Get-ADForest | Select-Object ForestMode; Get-ADDomainController -Filter * | Select-Object Name, OperatingSystem","Effort":"Medium","Minutes":60,"Ref":"https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/active-directory-functional-levels","FixFR":"Le niveau fonctionnel du domaine ou de la forêt est Windows Server 2012 R2. Vérifiez que tous les DC tournent sous Windows Server 2016 ou plus récent (idéalement 2022 ou 2025), puis montez le niveau du domaine et ensuite celui de la forêt : Set-ADDomainMode -Identity (Get-ADDomain) -DomainMode Windows2016Domain, puis Set-ADForestMode -Identity (Get-ADForest) -ForestMode Windows2016Forest. Vérifiez la réplication avant et après."},"A-DCLdapSign":{"Fix":"This DC does not require LDAP signing. First turn on LDAP diagnostic logging on the DCs ('16 LDAP Interface Events' = 2) and fix the clients listed in event 2889. Then in a GPO linked to the Domain Controllers OU set 'Domain controller: LDAP server signing requirements' to Require signing (on Windows Server 2025, also 'LDAP server signing requirements Enforcement' to Enabled).","Check":"Invoke-Command -ComputerName (Get-ADDomainController -Filter *).HostName -ScriptBlock { Get-ItemProperty HKLM:\\SYSTEM\\CurrentControlSet\\Services\\NTDS\\Parameters | Select-Object PSComputerName, LDAPServerIntegrity }","Effort":"Medium","Minutes":120,"Ref":"https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/ldap-signing","FixFR":"Ce DC n'exige pas la signature LDAP. Activez d'abord la journalisation LDAP sur les DC ('16 LDAP Interface Events' = 2) et corrigez les clients listés dans l'événement 2889. Ensuite, dans une GPO liée à l'OU Domain Controllers, mettez 'Domain controller: LDAP server signing requirements' sur Require signing (sur Windows Server 2025, mettez aussi 'LDAP server signing requirements Enforcement' sur Enabled)."},"S-ADRegistrationSchema":{"Fix":"A schema class can be created under a computer or user object (possSuperiors), so any user can create objects under their own account (CVE-2021-34470, Exchange msExchStorageGroup). Install the Exchange security update or a supported CU and run Setup /PrepareSchema, or, if Exchange is gone, use the Microsoft script to remove 'computer' from the possSuperiors of msExchStorageGroup.","Check":"Get-ADObject -SearchBase (Get-ADRootDSE).schemaNamingContext -LDAPFilter '(lDAPDisplayName=msExchStorageGroup)' -Properties possSuperiors | Select-Object Name, possSuperiors","Effort":"Low","Minutes":30,"Ref":"https://msrc.microsoft.com/update-guide/vulnerability/CVE-2021-34470","FixFR":"Une classe du schéma peut être créée sous un objet ordinateur ou utilisateur (possSuperiors) : n'importe quel utilisateur peut donc créer des objets sous son propre compte (CVE-2021-34470, msExchStorageGroup d'Exchange). Installez la mise à jour de sécurité Exchange ou un CU supporté et lancez Setup /PrepareSchema, ou, si Exchange n'existe plus, utilisez le script Microsoft pour retirer 'computer' des possSuperiors de msExchStorageGroup."},"P-RODCSYSVOLWrite":{"Fix":"An RODC can write to SYSVOL, so a stolen RODC could push a malicious GPO to the whole domain. In ADSI Edit, open the RODC computer object > CN=DFSR-LocalSettings > CN=Domain System Volume > CN=SYSVOL Subscription and set msDFSR-ReadOnly to TRUE.","Check":"Get-ADDomainController -Filter { IsReadOnly -eq $true } | ForEach-Object { Get-ADObject -SearchBase $_.ComputerObjectDN -LDAPFilter '(objectClass=msDFSR-Subscription)' -Properties msDFSR-ReadOnly | Select-Object DistinguishedName, msDFSR-ReadOnly }","Effort":"Low","Minutes":10,"Ref":"https://learn.microsoft.com/en-us/openspecs/windows_protocols/ms-frs2/3588b343-4076-4776-b5c0-78e2b3d91ed3","FixFR":"Un RODC peut écrire dans SYSVOL : un RODC volé pourrait donc pousser une GPO malveillante sur tout le domaine. Dans ADSI Edit, ouvrez l'objet ordinateur du RODC > CN=DFSR-LocalSettings > CN=Domain System Volume > CN=SYSVOL Subscription et mettez msDFSR-ReadOnly à TRUE."},"A-LAPS-Not-Installed":{"Fix":"Deploy Windows LAPS (built into Windows since the April 2023 updates; legacy Microsoft LAPS is deprecated): run Update-LapsADSchema, give computers the right to write their password (Set-LapsADComputerSelfPermission on each OU), then turn on the LAPS policy by GPO.","Check":"Get-ADObject -SearchBase (Get-ADRootDSE).schemaNamingContext -LDAPFilter '(|(lDAPDisplayName=msLAPS-Password)(lDAPDisplayName=ms-Mcs-AdmPwd))' | Select-Object Name","Effort":"Medium","Minutes":240,"Ref":"https://learn.microsoft.com/en-us/windows-server/identity/laps/laps-overview","FixFR":"Déployez Windows LAPS (intégré à Windows depuis les mises à jour d'avril 2023 ; l'ancien Microsoft LAPS est obsolète) : lancez Update-LapsADSchema, donnez aux ordinateurs le droit d'écrire leur mot de passe (Set-LapsADComputerSelfPermission sur chaque OU), puis activez la stratégie LAPS par GPO."},"S-KerberosArmoringDC":{"Fix":"DCs do not offer Kerberos armoring (FAST). In a GPO linked to the Domain Controllers OU, enable Computer Configuration > Policies > Administrative Templates > System > KDC > KDC support for claims, compound authentication and Kerberos armoring, set to Supported. 'Fail unarmored authentication requests' is the safest value but only once every client supports it.","Check":"Get-GPO -All | Where-Object { (Get-GPOReport -Guid $_.Id -ReportType Xml) -match 'KDC support for claims|CbacAndArmorLevel' } | Select-Object DisplayName","Effort":"Low","Minutes":15,"Ref":"https://learn.microsoft.com/en-us/windows-server/security/kerberos/whats-new-in-kerberos-authentication","FixFR":"Les DC ne proposent pas le blindage Kerberos (FAST). Dans une GPO liée à l'OU Domain Controllers, activez Computer Configuration > Policies > Administrative Templates > System > KDC > KDC support for claims, compound authentication and Kerberos armoring, sur Supported. 'Fail unarmored authentication requests' est la valeur la plus sûre, mais seulement quand tous les clients le supportent."},"A-MembershipEveryone":{"Fix":"A GPO (Restricted Groups or Preferences > Local Users and Groups) adds Everyone, Authenticated Users, Domain Users or Domain Computers to a local group such as Administrators or Remote Desktop Users on many machines. Edit the GPO named in the report and replace that member with a small dedicated group.","Check":"Get-GPO -All | Where-Object { (Get-GPOReport -Guid $_.Id -ReportType Xml) -match 'RestrictedGroups|Local Users and Groups' } | Select-Object DisplayName","Effort":"Low","Minutes":20,"Ref":"https://learn.microsoft.com/en-us/archive/technet-wiki/20402.active-directory-group-policy-restricted-groups","FixFR":"Une GPO (Groupes restreints ou Préférences > Utilisateurs et groupes locaux) ajoute Everyone, Authenticated Users, Domain Users ou Domain Computers dans un groupe local comme Administrateurs ou Utilisateurs du Bureau à distance sur beaucoup de machines. Modifiez la GPO citée dans le rapport et remplacez ce membre par un petit groupe dédié."},"P-DelegationLoginScript":{"Fix":"Wide groups can modify logon scripts used by users (scriptPath or GPO scripts), so anyone can run code as these users, admins included. On each script file and its folder (NTFS and share), remove write rights for Everyone, Authenticated Users, Users, Domain Users and Domain Computers. Keep scripts in NETLOGON or SYSVOL.","Check":"$n = \"\\\\$((Get-ADDomain).DNSRoot)\\NETLOGON\"; Get-ADUser -LDAPFilter '(scriptPath=*)' -Properties scriptPath | Select-Object -ExpandProperty scriptPath -Unique | ForEach-Object { $p = if ($_ -like '\\\\*') { $_ } else { Join-Path $n $_ }; [pscustomobject]@{ Script = $p; Writers = ((Get-Acl -Path $p -ErrorAction SilentlyContinue).Access | Where-Object { $_.AccessControlType -eq 'Allow' -and $_.FileSystemRights -match 'Write|Modify|FullControl' }).IdentityReference -join ', ' } }","Effort":"Low","Minutes":30,"Ref":"","FixFR":"Des groupes larges peuvent modifier des scripts de connexion utilisés par des utilisateurs (scriptPath ou scripts de GPO) : n'importe qui peut donc lancer du code au nom de ces utilisateurs, admins compris. Sur chaque fichier de script et son dossier (NTFS et partage), retirez les droits d'écriture à Everyone, Authenticated Users, Users, Domain Users et Domain Computers. Gardez les scripts dans NETLOGON ou SYSVOL."},"A-AnonymousAuthorizedGPO":{"Fix":"A GPO lowers the anonymous access settings. Edit the GPO named in the report (Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options) and set 'Network access: Do not allow anonymous enumeration of SAM accounts' to Enabled and 'Network access: Do not allow anonymous enumeration of SAM accounts and shares' to Enabled (or remove the settings so the safe defaults apply).","Check":"Get-GPO -All | Where-Object { (Get-GPOReport -Guid $_.Id -ReportType Xml) -match 'RestrictAnonymous' } | Select-Object DisplayName","Effort":"Low","Minutes":15,"Ref":"https://learn.microsoft.com/en-us/windows/security/threat-protection/security-policy-settings/network-access-do-not-allow-anonymous-enumeration-of-sam-accounts-and-shares","FixFR":"Une GPO affaiblit les paramètres d'accès anonyme. Modifiez la GPO citée dans le rapport (Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options) et mettez 'Network access: Do not allow anonymous enumeration of SAM accounts' sur Enabled et 'Network access: Do not allow anonymous enumeration of SAM accounts and shares' sur Enabled (ou supprimez ces paramètres pour revenir aux valeurs sûres par défaut)."},"A-SHA1RootCert":{"Fix":"A SHA-1 signed root certificate is pushed by a GPO (Public Key Policies) or stored in NTAuth; the report gives the source. Remove it there. If it is still in use, replace the CA with a SHA-256 one first and reissue the certificates that depend on it.","Check":"Get-ChildItem Cert:\\LocalMachine\\Root | Where-Object { $_.Subject -eq $_.Issuer -and $_.SignatureAlgorithm.FriendlyName -eq 'sha1RSA' } | Select-Object Subject, Thumbprint, NotAfter","Effort":"Medium","Minutes":120,"Ref":"https://tools.ietf.org/html/rfc6194","FixFR":"Un certificat racine signé en SHA-1 est poussé par une GPO (Public Key Policies) ou présent dans NTAuth ; le rapport donne la source. Retirez-le à cet endroit. S'il sert encore, remplacez d'abord l'AC par une AC en SHA-256 puis réémettez les certificats qui en dépendent."},"P-DelegationEveryone":{"Fix":"A permission on the domain or an OU is given to Everyone, Authenticated Users, Domain Users, Domain Computers, Users or Anonymous, so any account can use it. On each object listed (ADUC > Security > Advanced), remove that permission. If it is needed, give it to a dedicated group instead.","Check":"$d = (Get-ADDomain).DistinguishedName; @($d) + @(Get-ADOrganizationalUnit -Filter *).DistinguishedName | ForEach-Object { $o = $_; (Get-Acl -Path \"AD:\\$o\").Access | Where-Object { $_.AccessControlType -eq 'Allow' -and $_.ActiveDirectoryRights -match 'GenericAll|GenericWrite|WriteDacl|WriteOwner|WriteProperty|CreateChild|DeleteChild|Delete' -and $(try { $_.IdentityReference.Translate([System.Security.Principal.SecurityIdentifier]).Value } catch { $_.IdentityReference.Value }) -match '^S-1-1-0$|^S-1-5-11$|^S-1-5-7$|^S-1-5-32-545$|-51[35]$' } | Select-Object @{ n = 'Object'; e = { $o } }, IdentityReference, ActiveDirectoryRights }","Effort":"Low","Minutes":30,"Ref":"https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/plan/delegating-administration-by-using-ou-objects","FixFR":"Une permission sur le domaine ou une OU est donnée à Everyone, Authenticated Users, Domain Users, Domain Computers, Users ou Anonymous : n'importe quel compte peut donc l'utiliser. Sur chaque objet listé (ADUC > Sécurité > Avancé), retirez cette permission. Si elle est nécessaire, donnez-la plutôt à un groupe dédié."},"A-SMB2SignatureNotEnabled":{"Fix":"A DC does not even offer SMB signing. In the Default Domain Controllers Policy, set 'Microsoft network server: Digitally sign communications (always)' to Enabled, and look for another GPO or registry change that turns it off (LanmanServer\\Parameters EnableSecuritySignature / RequireSecuritySignature).","Check":"Invoke-Command -ComputerName (Get-ADDomainController -Filter *).HostName -ScriptBlock { Get-SmbServerConfiguration | Select-Object PSComputerName, EnableSecuritySignature, RequireSecuritySignature }","Effort":"Low","Minutes":15,"Ref":"https://learn.microsoft.com/en-us/openspecs/windows_protocols/ms-smb2/36172e53-ac81-48fb-b2e3-caa3761b9157","FixFR":"Un DC ne propose même pas la signature SMB. Dans la Default Domain Controllers Policy, mettez 'Microsoft network server: Digitally sign communications (always)' sur Enabled, et cherchez une autre GPO ou un changement de registre qui la désactive (LanmanServer\\Parameters EnableSecuritySignature / RequireSecuritySignature)."},"T-SIDHistoryDangerous":{"Fix":"Some accounts have a privileged SID (built-in group or admin RID under 1000) in their SID History, which gives them these rights hidden from the normal group lists. This is a classic persistence trick. Remove the value with Set-ADUser <name> -Remove @{ sIDHistory = '<SID>' } (Set-ADGroup or Set-ADComputer for groups and computers). Then find out how it was added and reset the account's password.","Check":"Get-ADObject -LDAPFilter '(sIDHistory=*)' -Properties sIDHistory | ForEach-Object { $o = $_; $o.sIDHistory | Where-Object { $_.Value -like 'S-1-5-32-*' -or [int]($_.Value.Split('-')[-1]) -lt 1000 } | ForEach-Object { [pscustomobject]@{ Object = $o.Name; SID = $_.Value } } }","Effort":"Low","Minutes":30,"Ref":"https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/understand-security-identifiers","FixFR":"Des comptes ont un SID privilégié (groupe intégré ou RID d'admin inférieur à 1000) dans leur SID History, ce qui leur donne ces droits sans apparaître dans les listes de groupes normales. C'est une technique de persistance classique. Supprimez la valeur avec Set-ADUser <nom> -Remove @{ sIDHistory = '<SID>' } (Set-ADGroup ou Set-ADComputer pour les groupes et les ordinateurs). Cherchez ensuite comment il a été ajouté et réinitialisez le mot de passe du compte."},"T-SIDHistorySameDomain":{"Fix":"Some accounts have in their SID History a SID of your own domain. This can't happen with a normal migration (only A to B then back to A), so treat it as a sign of compromise. Find which account the SID belongs to, remove the value with Set-ADUser <name> -Remove @{ sIDHistory = '<SID>' } (Set-ADGroup or Set-ADComputer for groups and computers). Reset the password of the account and investigate.","Check":"$s = (Get-ADDomain).DomainSID.Value; Get-ADObject -LDAPFilter '(sIDHistory=*)' -Properties sIDHistory | ForEach-Object { $o = $_; $o.sIDHistory | Where-Object { $_.Value -like \"$s-*\" } | ForEach-Object { [pscustomobject]@{ Object = $o.Name; SID = $_.Value } } }","Effort":"Low","Minutes":30,"Ref":"https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/manage/understand-security-identifiers","FixFR":"Des comptes ont dans leur SID History un SID de votre propre domaine. Cela n'arrive pas avec une migration normale (seulement A vers B puis retour vers A) : considérez-le comme un signe de compromission. Trouvez à quel compte appartient le SID, supprimez la valeur avec Set-ADUser <nom> -Remove @{ sIDHistory = '<SID>' } (Set-ADGroup ou Set-ADComputer pour les groupes et les ordinateurs). Réinitialisez le mot de passe du compte et enquêtez."},"S-OS-Win7":{"Fix":"Replace or upgrade the Windows 7 machines to Windows 11 (Windows 10 support also ended on October 14, 2025, except with paid ESU). Until then, isolate them on the network.","Check":"Get-ADComputer -Filter {Enabled -eq $true -and OperatingSystem -like '*Windows 7*'} -Properties OperatingSystem | Select-Object Name, OperatingSystem","Effort":"High","Minutes":480,"Ref":"https://learn.microsoft.com/en-us/lifecycle/products/windows-7","FixFR":"Remplacez ou mettez à niveau les postes Windows 7 vers Windows 11 (le support de Windows 10 s'est aussi terminé le 14 octobre 2025, sauf avec l'ESU payant). En attendant, isolez-les sur le réseau."},"P-RODCKrbtgtOrphan":{"Fix":"A krbtgt_<number> account still exists while its RODC is gone. Check with Get-ADDomainController -Filter { IsReadOnly -eq $true } that no RODC uses it (msDS-KrbTgtLinkBl is empty), then delete the account. Disabling it is not enough.","Check":"Get-ADUser -LDAPFilter '(sAMAccountName=krbtgt_*)' -Properties msDS-KrbTgtLinkBl, whenCreated | Select-Object SamAccountName, whenCreated, msDS-KrbTgtLinkBl","Effort":"Low","Minutes":10,"Ref":"https://specterops.io/blog/2023/01/25/at-the-edge-of-tier-zero-the-curious-case-of-the-rodc/","FixFR":"Un compte krbtgt_<numéro> existe encore alors que son RODC a disparu. Vérifiez avec Get-ADDomainController -Filter { IsReadOnly -eq $true } qu'aucun RODC ne l'utilise (msDS-KrbTgtLinkBl est vide), puis supprimez le compte. Le désactiver ne suffit pas."},"S-OS-2008":{"Fix":"Upgrade or replace the Windows Server 2008 / 2008 R2 servers with a supported version (2022 or 2025). Until then, isolate them on the network.","Check":"Get-ADComputer -Filter {Enabled -eq $true -and OperatingSystem -like '*Server 2008*'} -Properties OperatingSystem | Select-Object Name, OperatingSystem","Effort":"High","Minutes":960,"Ref":"https://learn.microsoft.com/en-us/troubleshoot/windows-server/windows-server-eos-faq/end-of-support-windows-server-2008-2008r2","FixFR":"Mettez à niveau ou remplacez les serveurs Windows Server 2008 / 2008 R2 par une version supportée (2022 ou 2025). En attendant, isolez-les sur le réseau."},"A-LDAPSigningDisabled":{"Fix":"A GPO sets 'Network security: LDAP client signing requirements' to None. Edit that GPO (Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options) and set it to 'Negotiate signing' (the default) or 'Require signing', or remove the setting. Also make DCs require signing; new Windows Server 2025 forests do it by default.","Check":"Get-GPO -All | Where-Object { (Get-GPOReport -Guid $_.Id -ReportType Xml) -match 'LDAPClientIntegrity' } | Select-Object DisplayName","Effort":"Low","Minutes":15,"Ref":"https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/ldap-signing","FixFR":"Une GPO règle 'Network security: LDAP client signing requirements' sur None. Modifiez cette GPO (Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options) et mettez 'Negotiate signing' (valeur par défaut) ou 'Require signing', ou supprimez le paramètre. Faites aussi exiger la signature par les DC ; les nouvelles forêts Windows Server 2025 le font par défaut."},"P-DelegationKrbtgt":{"Fix":"An account has constrained delegation to the krbtgt service, which lets it get a TGT for any user, including admins. There is no legit use: treat it as a backdoor. Remove the krbtgt entry from msDS-AllowedToDelegateTo and untick protocol transition on that account, reset its password, reset the krbtgt password twice, and investigate how it was set.","Check":"Get-ADObject -LDAPFilter '(msDS-AllowedToDelegateTo=krbtgt*)' -Properties msDS-AllowedToDelegateTo, userAccountControl | Select-Object Name, ObjectClass, msDS-AllowedToDelegateTo","Effort":"Medium","Minutes":60,"Ref":"https://www.thehacker.recipes/ad/persistence/kerberos/delegation-to-krbtgt","FixFR":"Un compte a une délégation contrainte vers le service krbtgt, ce qui lui permet d'obtenir un TGT pour n'importe quel utilisateur, admins compris. Il n'y a aucun usage légitime : traitez-le comme une porte dérobée. Retirez l'entrée krbtgt de msDS-AllowedToDelegateTo et désactivez la transition de protocole sur ce compte, réinitialisez son mot de passe, réinitialisez deux fois celui de krbtgt et cherchez comment cela a été mis."},"S-DC-SubnetMissing":{"Fix":"The IP of a DC is not in any subnet declared in AD Sites and Services, so clients may pick a far DC and some security checks based on sites work badly. Add the missing subnet and link it to the right site: New-ADReplicationSubnet -Name <network/bits> -Site <site>. If the address is an unexpected IPv6, fix the network card setup.","Check":"Get-ADDomainController -Filter * | Select-Object Name, IPv4Address, IPv6Address, Site; Get-ADReplicationSubnet -Filter * | Select-Object Name, Site","Effort":"Low","Minutes":15,"Ref":"https://learn.microsoft.com/en-us/powershell/module/activedirectory/new-adreplicationsubnet","FixFR":"L'IP d'un DC n'est dans aucun sous-réseau déclaré dans Sites et services AD : les clients peuvent donc choisir un DC éloigné et certains contrôles de sécurité basés sur les sites fonctionnent mal. Ajoutez le sous-réseau manquant et liez-le au bon site : New-ADReplicationSubnet -Name <réseau/bits> -Site <site>. Si l'adresse est un IPv6 inattendu, corrigez la configuration de la carte réseau."},"S-OS-XP":{"Fix":"Replace or upgrade the Windows XP machines to a supported version (Windows 11 for workstations, Windows Server 2022 or 2025 for servers). Until then, isolate them on the network and disable the accounts of the machines that are gone.","Check":"Get-ADComputer -Filter { Enabled -eq $true -and OperatingSystem -like '*Windows XP*' } -Properties OperatingSystem, LastLogonDate | Select-Object Name, OperatingSystem, LastLogonDate","Effort":"High","Minutes":480,"Ref":"https://learn.microsoft.com/en-us/lifecycle/products/windows-xp","FixFR":"Remplacez ou mettez à niveau les machines Windows XP vers une version supportée (Windows 11 pour les postes, Windows Server 2022 ou 2025 pour les serveurs). En attendant, isolez-les sur le réseau et désactivez les comptes des machines qui n'existent plus."},"P-AdminNum":{"Fix":"There are too many admin accounts (more than 50, or more than 10% of active users). Review each member of the admin groups, remove those who do not need these rights and give them delegated rights on the OUs they manage instead.","Check":"'S-1-5-32-544', 'S-1-5-32-548', 'S-1-5-32-549', 'S-1-5-32-550', 'S-1-5-32-551' | ForEach-Object { [pscustomobject]@{ Group = (Get-ADGroup -Identity $_).Name; Members = @(Get-ADGroupMember -Identity $_ -Recursive).Count } }","Effort":"Medium","Minutes":120,"Ref":"https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/plan/security-best-practices/implementing-least-privilege-administrative-models","FixFR":"Il y a trop de comptes admin (plus de 50, ou plus de 10 % des utilisateurs actifs). Revoyez chaque membre des groupes d'admin, retirez ceux qui n'ont pas besoin de ces droits et donnez-leur plutôt des droits délégués sur les OU qu'ils gèrent."},"S-OldNtlm":{"Fix":"The DCs still accept NTLMv1 or LM (no GPO, or a GPO with a LAN Manager authentication level below 5). NTLMv1 can be cracked or relayed easily. First find who still uses NTLMv1 (event 4624 with 'NTLM V1' on the DCs). Then in a GPO linked to the Domain Controllers OU (and ideally the domain) set 'Network security: LAN Manager authentication level' to 'Send NTLMv2 response only. Refuse LM & NTLM'.","Check":"Get-GPO -All | Where-Object { (Get-GPOReport -Guid $_.Id -ReportType Xml) -match 'LmCompatibilityLevel' } | Select-Object DisplayName","Effort":"Medium","Minutes":120,"Ref":"https://learn.microsoft.com/en-us/troubleshoot/windows-server/windows-security/audit-domain-controller-ntlmv1","FixFR":"Les DC acceptent encore NTLMv1 ou LM (pas de GPO, ou une GPO avec un niveau d'authentification LAN Manager inférieur à 5). NTLMv1 se casse ou se relaie facilement. Trouvez d'abord qui utilise encore NTLMv1 (événement 4624 avec 'NTLM V1' sur les DC). Ensuite, dans une GPO liée à l'OU Domain Controllers (et idéalement au domaine), mettez 'Network security: LAN Manager authentication level' sur 'Send NTLMv2 response only. Refuse LM & NTLM'."},"A-CertTempNoSecurity":{"Fix":"This template has the CT_FLAG_NO_SECURITY_EXTENSION flag (0x80000), so its certificates do not carry the SID of the account and strong mapping can be bypassed (ESC9). Remove the flag: certutil -dstemplate <TemplateName> msPKI-Enrollment-Flag -0x00080000. Also make sure every DC enforces strong certificate mapping (StrongCertificateBindingEnforcement = 2, the default since 2025).","Check":"$cfg = (Get-ADRootDSE).configurationNamingContext; Get-ADObject -SearchBase \"CN=Certificate Templates,CN=Public Key Services,CN=Services,$cfg\" -Filter * -Properties msPKI-Enrollment-Flag | Select-Object Name, msPKI-Enrollment-Flag | Where-Object { $_.'msPKI-Enrollment-Flag' -band 0x80000 }","Effort":"Low","Minutes":15,"Ref":"https://support.microsoft.com/en-us/topic/kb5014754-certificate-based-authentication-changes-on-windows-domain-controllers-ad2c23b0-15d8-4340-a468-4d4f3b188f16","FixFR":"Ce modèle a le drapeau CT_FLAG_NO_SECURITY_EXTENSION (0x80000) : ses certificats ne portent donc pas le SID du compte et le mappage fort peut être contourné (ESC9). Retirez le drapeau : certutil -dstemplate <NomDuModèle> msPKI-Enrollment-Flag -0x00080000. Vérifiez aussi que chaque DC applique le mappage fort des certificats (StrongCertificateBindingEnforcement = 2, le comportement par défaut depuis 2025)."},"A-PwdGPO":{"Fix":"Treat the passwords found as known by attackers: change them now on every system that uses them. Then delete the Group Policy Preferences items that store them (cpassword in SYSVOL). For local admin passwords, use Windows LAPS instead.","Check":"Get-ChildItem \"\\\\$env:USERDNSDOMAIN\\SYSVOL\\$env:USERDNSDOMAIN\\Policies\" -Recurse -Include *.xml | Select-String -Pattern 'cpassword=\"[^\"]' -List | Select-Object Path","Effort":"Low","Minutes":30,"Ref":"https://learn.microsoft.com/en-us/openspecs/windows_protocols/ms-gppref/2c15cbf0-f086-4c74-8b70-1f2fa45dd4be","FixFR":"Considérez les mots de passe trouvés comme connus des attaquants : changez-les tout de suite sur tous les systèmes qui les utilisent. Supprimez ensuite les éléments Group Policy Preferences qui les contiennent (cpassword dans SYSVOL). Pour les mots de passe d'admin local, utilisez plutôt Windows LAPS."},"P-UnprotectedOU":{"Fix":"These OUs are not protected from accidental deletion, so one wrong click can delete an OU and everything inside it. Turn the protection on: Get-ADOrganizationalUnit -Filter * | Set-ADOrganizationalUnit -ProtectedFromAccidentalDeletion $true (or the checkbox on the Object tab in ADUC). Also turn on the AD Recycle Bin.","Check":"Get-ADOrganizationalUnit -Filter * -Properties ProtectedFromAccidentalDeletion | Where-Object { -not $_.ProtectedFromAccidentalDeletion } | Select-Object DistinguishedName","Effort":"Low","Minutes":5,"Ref":"https://learn.microsoft.com/en-us/powershell/module/activedirectory/set-adorganizationalunit","FixFR":"Ces OU ne sont pas protégées contre la suppression accidentelle : un seul mauvais clic peut donc supprimer une OU et tout son contenu. Activez la protection : Get-ADOrganizationalUnit -Filter * | Set-ADOrganizationalUnit -ProtectedFromAccidentalDeletion $true (ou la case de l'onglet Objet dans ADUC). Activez aussi la corbeille AD."},"A-NoGPOLLMNR":{"Fix":"No GPO turns off LLMNR, so an attacker on the network can answer name requests and capture hashes (Responder). In a GPO linked to the domain, enable Computer Configuration > Policies > Administrative Templates > Network > DNS Client > Turn off multicast name resolution. Also turn off NetBIOS over TCP/IP (DHCP option or network card settings) and mDNS.","Check":"Get-GPO -All | Where-Object { (Get-GPOReport -Guid $_.Id -ReportType Xml) -match 'Turn off multicast name resolution|EnableMulticast' } | Select-Object DisplayName","Effort":"Low","Minutes":15,"Ref":"https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-csp-admx-dnsclient","FixFR":"Aucune GPO ne désactive LLMNR : un attaquant sur le réseau peut donc répondre aux demandes de noms et capturer des hash (Responder). Dans une GPO liée au domaine, activez Computer Configuration > Policies > Administrative Templates > Network > DNS Client > Turn off multicast name resolution. Désactivez aussi NetBIOS sur TCP/IP (option DHCP ou paramètres de la carte réseau) et mDNS."},"A-NoNetSessionHardening":{"Fix":"Run the NetCease script on a reference server, then push its registry value (HKLM\\SYSTEM\\CurrentControlSet\\Services\\LanmanServer\\DefaultSecurity\\SrvsvcSessionInfo) to servers and DCs with a GPO Registry preference (Registry Wizard). Restart the Server service or reboot to apply.","Check":"Get-ItemProperty HKLM:\\SYSTEM\\CurrentControlSet\\Services\\LanmanServer\\DefaultSecurity -Name SrvsvcSessionInfo","Effort":"Low","Minutes":30,"Ref":"https://github.com/p0w3rsh3ll/NetCease","FixFR":"Lancez le script NetCease sur un serveur de référence, puis poussez sa valeur de registre (HKLM\\SYSTEM\\CurrentControlSet\\Services\\LanmanServer\\DefaultSecurity\\SrvsvcSessionInfo) vers les serveurs et les DC avec une préférence de registre GPO (Registry Wizard). Redémarrez le service Serveur ou la machine pour l'appliquer."},"S-C-Inactive":{"Fix":"Too many computer accounts are inactive (no logon for 6 months). Disable them, move them to a dedicated OU and delete them after a waiting period. Do it on a schedule.","Check":"Search-ADAccount -AccountInactive -ComputersOnly -TimeSpan 180.00:00:00 | Where-Object Enabled | Select-Object Name, LastLogonDate","Effort":"Low","Minutes":60,"Ref":"https://learn.microsoft.com/en-us/powershell/module/activedirectory/search-adaccount","FixFR":"Trop de comptes ordinateurs sont inactifs (aucune connexion depuis 6 mois). Désactivez-les, déplacez-les dans une OU dédiée et supprimez-les après un délai. Faites-le de façon régulière."},"P-DelegationFileDeployed":{"Fix":"A GPO deploys a file (Files preference, MSI package, shortcut...) from a place where wide groups can write, so anyone can replace it and get code run on many machines. Open the GPO named in the report, find the source path, and on that share and folder remove write rights (NTFS and share) for Everyone, Authenticated Users, Users and Domain Users.","Check":"Get-GPO -All | Where-Object { (Get-GPOReport -Guid $_.Id -ReportType Xml) -match 'Files|Software Installation|Shortcuts|msiPath' } | Select-Object DisplayName","Effort":"Low","Minutes":30,"Ref":"","FixFR":"Une GPO déploie un fichier (préférence Fichiers, paquet MSI, raccourci...) depuis un endroit où des groupes larges peuvent écrire : n'importe qui peut donc le remplacer et faire exécuter du code sur beaucoup de machines. Ouvrez la GPO citée dans le rapport, trouvez le chemin source, et sur ce partage et ce dossier retirez les droits d'écriture (NTFS et partage) à Everyone, Authenticated Users, Users et Domain Users."},"S-SIDHistory":{"Fix":"First update the permissions (shares, file ACLs, apps) that still use the old SIDs so they point to the new accounts. Then clear SID History on users, groups and computers. Once removed, it can't be added back.","Check":"Get-ADObject -LDAPFilter '(sIDHistory=*)' -Properties sIDHistory | Select-Object Name, ObjectClass","Effort":"Medium","Minutes":120,"Ref":"","FixFR":"Mettez d'abord à jour les permissions (partages, ACL de fichiers, applications) qui utilisent encore les anciens SID pour qu'elles pointent vers les nouveaux comptes. Videz ensuite le SID History des utilisateurs, groupes et ordinateurs. Une fois supprimé, il ne peut pas être remis."},"A-DnsHostnameMismatch":{"Fix":"These computers have a dNSHostName that does not match their sAMAccountName. This can be used to get a certificate for another machine, such as a DC (Certifried, CVE-2022-26923). For each one, check who changed it and set the right value or delete the account if it is not legitimate. Make sure DCs and CAs have the May 2022 or later updates with strong certificate mapping enforced, and set ms-DS-MachineAccountQuota to 0.","Check":"Get-ADComputer -Filter * -Properties dNSHostName | Where-Object { $_.dNSHostName -and $_.dNSHostName.Split('.')[0] -ne $_.SamAccountName.TrimEnd('$') } | Select-Object Name, SamAccountName, dNSHostName","Effort":"Low","Minutes":30,"Ref":"https://support.microsoft.com/en-us/topic/kb5014754-certificate-based-authentication-changes-on-windows-domain-controllers-ad2c23b0-15d8-4340-a468-4d4f3b188f16","FixFR":"Ces ordinateurs ont un dNSHostName qui ne correspond pas à leur sAMAccountName. Cela peut servir à obtenir un certificat pour une autre machine, par exemple un DC (Certifried, CVE-2022-26923). Pour chacun, vérifiez qui l'a modifié et remettez la bonne valeur, ou supprimez le compte s'il n'est pas légitime. Vérifiez que les DC et les AC ont les mises à jour de mai 2022 ou plus récentes avec le mappage fort des certificats appliqué, et mettez ms-DS-MachineAccountQuota à 0."},"A-FakePwdChangeAllUsers":{"Fix":"These accounts have a recent pwdLastSet but their real password (unicodePwd) did not change: someone used the 'User must change password' trick to fake a reset. The old password is still valid. Reset the password for real (or disable the account if unused), then find who did it (event 4738 on the DCs, replication metadata) and check if this was a cover up.","Check":"$dc = (Get-ADDomainController).HostName; Get-ADUser -Filter { Enabled -eq $true } | ForEach-Object { $m = Get-ADReplicationAttributeMetadata -Object $_.DistinguishedName -Server $dc -Properties pwdLastSet, unicodePwd; $p = ($m | Where-Object AttributeName -eq 'pwdLastSet').LastOriginatingChangeTime; $u = ($m | Where-Object AttributeName -eq 'unicodePwd').LastOriginatingChangeTime; if ($p -gt $u.AddDays(1)) { [pscustomobject]@{ User = $_.SamAccountName; pwdLastSet = $p; RealPasswordChange = $u } } }","Effort":"Medium","Minutes":60,"Ref":"https://learn.microsoft.com/en-us/powershell/module/activedirectory/get-adreplicationattributemetadata","FixFR":"Ces comptes ont un pwdLastSet récent mais leur vrai mot de passe (unicodePwd) n'a pas changé : quelqu'un a utilisé l'astuce 'L'utilisateur doit changer le mot de passe' pour simuler une réinitialisation. L'ancien mot de passe est toujours valable. Réinitialisez vraiment le mot de passe (ou désactivez le compte s'il ne sert plus), puis cherchez qui l'a fait (événement 4738 sur les DC, métadonnées de réplication) et vérifiez s'il s'agit d'une dissimulation."},"A-DsHeuristicsAllowAnonNSPI":{"Fix":"The 8th character of dSHeuristics allows anonymous NSPI (address book) access. Edit CN=Directory Service,CN=Windows NT,CN=Services,CN=Configuration,... with ADSI Edit and set the 8th character to 0. Keep the other characters as they are (the 10th must stay 1 and the 20th must stay 2 when the string is that long).","Check":"Get-ADObject \"CN=Directory Service,CN=Windows NT,CN=Services,$((Get-ADRootDSE).configurationNamingContext)\" -Properties dSHeuristics, msDS-Other-Settings | Select-Object dSHeuristics, msDS-Other-Settings","Effort":"Low","Minutes":10,"Ref":"https://learn.microsoft.com/en-us/openspecs/windows_protocols/ms-adts/e5899be4-862e-496f-9a38-33950617d2c5","FixFR":"Le 8e caractère de dSHeuristics autorise l'accès NSPI (carnet d'adresses) anonyme. Modifiez CN=Directory Service,CN=Windows NT,CN=Services,CN=Configuration,... avec ADSI Edit et mettez le 8e caractère à 0. Gardez les autres caractères tels quels (le 10e doit rester 1 et le 20e doit rester 2 si la chaîne est assez longue)."},"P-DsHeuristicsDoListObject":{"Fix":"Informative rule: the 3rd character of dSHeuristics turns on List Object mode, which changes how object visibility is checked. If you did not turn it on on purpose, set the 3rd character back to 0 with ADSI Edit (CN=Directory Service,CN=Windows NT,CN=Services,CN=Configuration,...).","Check":"Get-ADObject \"CN=Directory Service,CN=Windows NT,CN=Services,$((Get-ADRootDSE).configurationNamingContext)\" -Properties dSHeuristics, msDS-Other-Settings | Select-Object dSHeuristics, msDS-Other-Settings","Effort":"Low","Minutes":10,"Ref":"https://learn.microsoft.com/en-us/openspecs/windows_protocols/ms-adts/990fb975-ab31-4bc1-8b75-5da132cd4584","FixFR":"Règle informative : le 3e caractère de dSHeuristics active le mode List Object, qui change la façon dont la visibilité des objets est contrôlée. Si vous ne l'avez pas activé exprès, remettez le 3e caractère à 0 avec ADSI Edit (CN=Directory Service,CN=Windows NT,CN=Services,CN=Configuration,...)."},"P-OperatorsEmpty":{"Fix":"Empty Account Operators, Server Operators, Print Operators and Backup Operators. Put real admins in the right admin group, and give other people only delegated rights on the OUs they manage. Check first what each member really uses (backups, printers...).","Check":"'S-1-5-32-548', 'S-1-5-32-549', 'S-1-5-32-550', 'S-1-5-32-551' | ForEach-Object { $g = Get-ADGroup -Identity $_; Get-ADGroupMember -Identity $_ | Select-Object @{n = 'Group'; e = { $g.Name } }, Name }","Effort":"Low","Minutes":30,"Ref":"","FixFR":"Videz Account Operators, Server Operators, Print Operators et Backup Operators. Mettez les vrais admins dans le bon groupe admin, et donnez aux autres seulement des droits délégués sur les OU qu'ils gèrent. Vérifiez d'abord ce que chaque membre utilise vraiment (sauvegardes, imprimantes...)."},"S-DC-2012":{"Fix":"Add new DCs on a supported Windows Server version (2022 or 2025), move the FSMO roles, then demote and remove the Windows Server 2012 / 2012 R2 DC. On old versions you may need an intermediate DC version first. Raise the functional levels when all old DCs are gone.","Check":"Get-ADComputer -Filter { PrimaryGroupID -eq 516 -and OperatingSystem -like '*2012*' } -Properties OperatingSystem, LastLogonDate | Select-Object Name, OperatingSystem, LastLogonDate","Effort":"High","Minutes":960,"Ref":"https://learn.microsoft.com/en-us/lifecycle/products/windows-server-2012-r2","FixFR":"Ajoutez de nouveaux DC sur une version de Windows Server supportée (2022 ou 2025), transférez les rôles FSMO, puis rétrogradez et retirez le DC Windows Server 2012 / 2012 R2. Avec les très anciennes versions, il faut parfois passer d'abord par une version intermédiaire. Montez les niveaux fonctionnels quand tous les anciens DC sont partis."},"S-PrimaryGroup":{"Fix":"These users have an unusual primary group. Membership through primaryGroupID is hidden from the normal member list, so it can hide admin rights. Unless there is a good reason, set it back to Domain Users (513): in ADUC > Member Of, add Domain Users, select it and click Set Primary Group, then remove the old group if not needed.","Check":"Get-ADUser -LDAPFilter '(!(|(primaryGroupID=513)(primaryGroupID=514)))' -Properties primaryGroupID | Select-Object SamAccountName, primaryGroupID","Effort":"Low","Minutes":15,"Ref":"https://learn.microsoft.com/en-us/windows/win32/adschema/a-primarygroupid","FixFR":"Ces utilisateurs ont un groupe principal inhabituel. L'appartenance via primaryGroupID n'apparaît pas dans la liste normale des membres : elle peut donc cacher des droits d'admin. Sauf bonne raison, remettez Domain Users (513) : dans ADUC > Membre de, ajoutez Domain Users, sélectionnez-le et cliquez sur Définir le groupe principal, puis retirez l'ancien groupe s'il ne sert pas."},"A-MD2IntermediateCert":{"Fix":"A MD2 signed intermediate CA certificate is pushed by a GPO (Public Key Policies) or stored in NTAuth; the report gives the source and the subject. Remove it there. If it is still in use, replace it with a new certificate (SHA-256 signature, RSA 2048 bits or more) first, then reissue the certificates that depend on it.","Check":"Get-ChildItem Cert:\\LocalMachine\\Root, Cert:\\LocalMachine\\CA | Where-Object { $_.SignatureAlgorithm.FriendlyName -notmatch 'sha256|sha384|sha512|ecdsa' } | Select-Object PSParentPath, Subject, Thumbprint, NotAfter; certutil -enterprise -store NTAuth","Effort":"Medium","Minutes":120,"Ref":"https://tools.ietf.org/html/rfc6149","FixFR":"Un certificat d'AC intermédiaire signé en MD2 est poussé par une GPO (Public Key Policies) ou présent dans NTAuth ; le rapport donne la source et le sujet. Retirez-le à cet endroit. S'il sert encore, remplacez-le d'abord par un nouveau certificat (signature SHA-256, RSA 2048 bits ou plus), puis réémettez les certificats qui en dépendent."},"S-ADRegistration":{"Fix":"Set ms-DS-MachineAccountQuota to 0 on the domain (Set-ADDomain (Get-ADDomain) -Replace @{'ms-DS-MachineAccountQuota' = 0}). Then let only a dedicated group join computers, with a delegation on the target OU.","Check":"Get-ADObject (Get-ADDomain).DistinguishedName -Properties ms-DS-MachineAccountQuota | Select-Object ms-DS-MachineAccountQuota","Effort":"Low","Minutes":5,"Ref":"https://learn.microsoft.com/troubleshoot/windows-server/identity/default-workstation-numbers-join-domain","FixFR":"Mettez ms-DS-MachineAccountQuota à 0 sur le domaine (Set-ADDomain (Get-ADDomain) -Replace @{'ms-DS-MachineAccountQuota' = 0}). Laissez ensuite seulement un groupe dédié joindre des ordinateurs, avec une délégation sur l'OU cible."},"P-AdminEmailOn":{"Fix":"These admin accounts have an email address, which suggests they are also used for mail and web browsing, the main way admins get phished. Give each admin a separate normal account for mail and internet, then clear the mail attribute of the admin account (Set-ADUser <name> -Clear mail). Clearing the field alone silences the alert but not the risk.","Check":"Get-ADGroupMember -Identity 'S-1-5-32-544' -Recursive | Where-Object objectClass -eq 'user' | Get-ADUser -Properties mail | Where-Object { $_.Enabled -and $_.mail } | Select-Object SamAccountName, mail","Effort":"Medium","Minutes":60,"Ref":"https://learn.microsoft.com/en-us/security/privileged-access-workstations/privileged-access-accounts","FixFR":"Ces comptes admin ont une adresse mail, ce qui laisse penser qu'ils servent aussi pour la messagerie et la navigation web, la voie principale d'hameçonnage des admins. Donnez à chaque admin un compte normal séparé pour la messagerie et Internet, puis videz l'attribut mail du compte admin (Set-ADUser <nom> -Clear mail). Vider le champ seul fait taire l'alerte mais pas le risque."},"P-RODCAdminRevealed":{"Fix":"The password of an admin account is cached on an RODC. If the RODC is stolen or compromised, that password is exposed. Reset the password of each account listed, then make sure it can't be cached again: add it (or its group) to 'Denied RODC Password Replication Group' and check the RODC allowed list.","Check":"Get-ADDomainController -Filter { IsReadOnly -eq $true } | ForEach-Object { Get-ADDomainControllerPasswordReplicationPolicyUsage -Identity $_ -RevealedAccounts | Select-Object @{ n = 'RODC'; e = { $_.Name } }, SamAccountName }","Effort":"Low","Minutes":30,"Ref":"https://learn.microsoft.com/en-us/openspecs/windows_protocols/ms-adts/8dfc81be-7461-48f2-8caf-07402bccb0ea","FixFR":"Le mot de passe d'un compte admin est en cache sur un RODC. Si le RODC est volé ou compromis, ce mot de passe est exposé. Réinitialisez le mot de passe de chaque compte listé, puis vérifiez qu'il ne pourra plus être mis en cache : ajoutez-le (ou son groupe) à 'Denied RODC Password Replication Group' et vérifiez la liste autorisée du RODC."},"A-PreWin2000Other":{"Fix":"Remove the extra members added to the 'Pre-Windows 2000 Compatible Access' group and keep only 'Authenticated Users' (its default). Then reboot each DC.","Check":"(Get-ADGroup -Identity 'S-1-5-32-554' -Properties member).member","Effort":"Low","Minutes":10,"Ref":"https://learn.microsoft.com/en-us/openspecs/windows_protocols/ms-adts/7a76a403-ed8d-4c39-adb7-a3255cab82c5","FixFR":"Retirez les membres ajoutés au groupe 'Pre-Windows 2000 Compatible Access' et ne gardez que 'Authenticated Users' (Utilisateurs authentifiés), son membre par défaut. Redémarrez ensuite chaque DC."},"S-FolderOptions":{"Fix":"Script files (.js, .jse, .vbs, .vbe, .vb, .wsh, .wsf) still run when a user double clicks them, a common malware entry point. In a GPO, go to User or Computer Configuration > Preferences > Control Panel Settings > Folder Options and add a File Type for each extension (action Replace) with an 'open' action that uses C:\\Windows\\System32\\notepad.exe.","Check":"Get-GPO -All | Where-Object { (Get-GPOReport -Guid $_.Id -ReportType Xml) -match 'FolderOptions|Folder Options' } | Select-Object DisplayName","Effort":"Low","Minutes":30,"Ref":"https://isc.sans.edu/diary/Controlling+JavaScript+Malware+Before+it+Runs/21171","FixFR":"Les fichiers de script (.js, .jse, .vbs, .vbe, .vb, .wsh, .wsf) se lancent encore quand un utilisateur double-clique dessus, une porte d'entrée courante des malwares. Dans une GPO, allez dans User ou Computer Configuration > Preferences > Control Panel Settings > Folder Options et ajoutez un Type de fichier pour chaque extension (action Remplacer) avec une action 'open' qui utilise C:\\Windows\\System32\\notepad.exe."},"A-DC-Coerce":{"Fix":"Anyone can force a DC to authenticate to a machine they control (PetitPotam, PrinterBug, DFSCoerce...) and relay it. Pick one: in a GPO linked to the Domain Controllers OU, set 'Network security: Restrict NTLM: Outgoing NTLM traffic to remote servers' to Deny all (first use Audit all and add needed servers in 'Add remote server exceptions'); or block the listed RPC interfaces with RPC filters (netsh rpc filter) or an RPC firewall. Also turn off the Print Spooler on DCs and require LDAP signing, SMB signing and EPA on AD CS.","Check":"Get-CimInstance Win32_Service -Filter \"Name='Spooler'\" -ComputerName (Get-ADDomainController -Filter *).HostName | Select-Object PSComputerName, State, StartMode","Effort":"Medium","Minutes":120,"Ref":"https://learn.microsoft.com/en-us/windows/security/threat-protection/security-policy-settings/network-security-restrict-ntlm-outgoing-ntlm-traffic-to-remote-servers","FixFR":"N'importe qui peut forcer un DC à s'authentifier sur une machine qu'il contrôle (PetitPotam, PrinterBug, DFSCoerce...) puis relayer cette authentification. Au choix : dans une GPO liée à l'OU Domain Controllers, mettez 'Network security: Restrict NTLM: Outgoing NTLM traffic to remote servers' sur Deny all (passez d'abord par Audit all et ajoutez les serveurs nécessaires dans 'Add remote server exceptions') ; ou bloquez les interfaces RPC listées avec des filtres RPC (netsh rpc filter) ou un pare-feu RPC. Désactivez aussi le Spouleur d'impression sur les DC et exigez la signature LDAP, la signature SMB et l'EPA sur AD CS."},"S-Duplicate":{"Fix":"There are duplicate objects (CNF conflict objects or $DUPLICATE accounts), created when the same object was made on two DCs at once. They show a process or replication problem and can confuse permissions. Compare each pair, keep the good one (check group membership and last logon) and delete the conflict object.","Check":"Get-ADObject -LDAPFilter '(|(cn=*CNF:*)(sAMAccountName=$DUPLICATE-*))' -Properties whenCreated | Select-Object Name, ObjectClass, whenCreated, DistinguishedName","Effort":"Low","Minutes":30,"Ref":"","FixFR":"Il existe des objets en double (objets de conflit CNF ou comptes $DUPLICATE), créés quand le même objet a été fait sur deux DC en même temps. Ils révèlent un problème de processus ou de réplication et peuvent fausser les permissions. Comparez chaque paire, gardez le bon (vérifiez les groupes et la dernière connexion) et supprimez l'objet de conflit."},"P-Kerberoasting":{"Fix":"For each admin account with an SPN: if it is a person, remove the SPN. If it is a service account, take it out of the admin groups and give it only the rights it needs, or move it to a gMSA. If that's not possible, set a long random password (25+ characters) and change it regularly. PingCastle ignores accounts whose password changed in the last 40 days.","Check":"Get-ADUser -Filter {ServicePrincipalName -like '*' -and AdminCount -eq 1} -Properties ServicePrincipalName, PasswordLastSet | Select-Object SamAccountName, PasswordLastSet, ServicePrincipalName","Effort":"Medium","Minutes":120,"Ref":"https://adsecurity.org/?p=3466","FixFR":"Pour chaque compte admin avec un SPN : si c'est une personne, retirez le SPN. Si c'est un compte de service, sortez-le des groupes admin et donnez-lui seulement les droits nécessaires, ou passez-le en gMSA. Si ce n'est pas possible, mettez un long mot de passe aléatoire (25+ caractères) et changez-le régulièrement. PingCastle ignore les comptes dont le mot de passe a changé dans les 40 derniers jours."},"S-OS-2003":{"Fix":"Replace or upgrade the Windows Server 2003 (and XP 64 bit) machines to a supported version (Windows 11 for workstations, Windows Server 2022 or 2025 for servers). Until then, isolate them on the network and disable the accounts of the machines that are gone.","Check":"Get-ADComputer -Filter { Enabled -eq $true -and OperatingSystem -like '*2003*' } -Properties OperatingSystem, LastLogonDate | Select-Object Name, OperatingSystem, LastLogonDate","Effort":"High","Minutes":480,"Ref":"","FixFR":"Remplacez ou mettez à niveau les machines Windows Server 2003 (et XP 64 bits) vers une version supportée (Windows 11 pour les postes, Windows Server 2022 ou 2025 pour les serveurs). En attendant, isolez-les sur le réseau et désactivez les comptes des machines qui n'existent plus."},"S-PwdNotRequired":{"Fix":"These accounts have the PASSWD_NOTREQD flag, so they can have an empty password even with a password policy. Set a strong password on each, then remove the flag: Set-ADUser <name> -PasswordNotRequired $false. Leave the flag on trust accounts.","Check":"Get-ADUser -LDAPFilter '(userAccountControl:1.2.840.113556.1.4.803:=32)' -Properties PasswordLastSet | Select-Object SamAccountName, Enabled, PasswordLastSet","Effort":"Low","Minutes":30,"Ref":"https://learn.microsoft.com/troubleshoot/windows-server/identity/useraccountcontrol-manipulate-account-properties","FixFR":"Ces comptes ont le drapeau PASSWD_NOTREQD : ils peuvent donc avoir un mot de passe vide malgré la stratégie de mot de passe. Mettez un mot de passe fort sur chacun, puis retirez le drapeau : Set-ADUser <nom> -PasswordNotRequired $false. Laissez le drapeau sur les comptes d'approbation."},"S-DefenderASR":{"Fix":"No GPO turns on the main Microsoft Defender Attack Surface Reduction rules. In a GPO, enable Computer Configuration > Policies > Administrative Templates > Windows Components > Microsoft Defender Antivirus > Microsoft Defender Exploit Guard > Attack Surface Reduction > Configure Attack Surface Reduction rules, and add the rule GUIDs listed in the report with value 2 (Audit) first, then 1 (Block) after checking the events. Start with 'Block credential stealing from lsass.exe'.","Check":"Get-GPO -All | Where-Object { (Get-GPOReport -Guid $_.Id -ReportType Xml) -match 'Attack Surface Reduction|ExploitGuard_ASR_Rules' } | Select-Object DisplayName","Effort":"Medium","Minutes":120,"Ref":"https://learn.microsoft.com/en-us/defender-endpoint/attack-surface-reduction-rules-reference","FixFR":"Aucune GPO n'active les principales règles de réduction de la surface d'attaque (ASR) de Microsoft Defender. Dans une GPO, activez Computer Configuration > Policies > Administrative Templates > Windows Components > Microsoft Defender Antivirus > Microsoft Defender Exploit Guard > Attack Surface Reduction > Configure Attack Surface Reduction rules, et ajoutez les GUID de règles listés dans le rapport avec la valeur 2 (Audit) d'abord, puis 1 (Bloquer) après avoir vérifié les événements. Commencez par 'Block credential stealing from lsass.exe'."},"P-DisplaySpecifier":{"Fix":"A display specifier adds an admin context menu (adminContextMenu) that runs a program from outside SYSVOL. When an admin uses ADUC, that program can run with their rights. Remove the entry from the display specifier listed (ADSI Edit, Configuration partition > CN=DisplaySpecifiers) or move the script into SYSVOL with only admins allowed to write.","Check":"$cfg = (Get-ADRootDSE).configurationNamingContext; Get-ADObject -SearchBase \"CN=DisplaySpecifiers,$cfg\" -LDAPFilter '(adminContextMenu=*)' -Properties adminContextMenu, whenChanged | Select-Object DistinguishedName, adminContextMenu, whenChanged","Effort":"Low","Minutes":20,"Ref":"https://learn.microsoft.com/en-us/windows/win32/ad/display-specifiers","FixFR":"Un display specifier ajoute un menu contextuel d'admin (adminContextMenu) qui lance un programme situé hors de SYSVOL. Quand un admin utilise ADUC, ce programme peut tourner avec ses droits. Supprimez l'entrée du display specifier listé (ADSI Edit, partition Configuration > CN=DisplaySpecifiers) ou déplacez le script dans SYSVOL avec seulement les admins autorisés en écriture."},"A-DnsZoneTransfert":{"Fix":"A DNS zone allows zone transfers to any server, so anyone can download the full list of names and IPs. In DNS Manager > zone > Properties > Zone Transfers, untick 'Allow zone transfers' or choose 'Only to the following servers'. In PowerShell: Set-DnsServerPrimaryZone -Name <zone> -SecureSecondaries NoTransfer. AD integrated zones do not need transfers between DCs.","Check":"Get-DnsServerZone | Where-Object { -not $_.IsAutoCreated } | Select-Object ZoneName, ZoneType, IsDsIntegrated, SecureSecondaries","Effort":"Low","Minutes":10,"Ref":"https://learn.microsoft.com/en-us/powershell/module/dnsserver/set-dnsserverprimaryzone","FixFR":"Une zone DNS autorise les transferts de zone vers n'importe quel serveur : n'importe qui peut donc télécharger la liste complète des noms et des IP. Dans le Gestionnaire DNS > zone > Propriétés > Transferts de zone, décochez 'Autoriser les transferts de zone' ou choisissez 'Uniquement vers les serveurs suivants'. En PowerShell : Set-DnsServerPrimaryZone -Name <zone> -SecureSecondaries NoTransfer. Les zones intégrées à l'AD n'ont pas besoin de transferts entre DC."},"S-DC-2003":{"Fix":"Add new DCs on a supported Windows Server version (2022 or 2025), move the FSMO roles, then demote and remove the Windows Server 2003 DC. On old versions you may need an intermediate DC version first. Raise the functional levels when all old DCs are gone.","Check":"Get-ADComputer -Filter { PrimaryGroupID -eq 516 -and OperatingSystem -like '*2003*' } -Properties OperatingSystem, LastLogonDate | Select-Object Name, OperatingSystem, LastLogonDate","Effort":"High","Minutes":960,"Ref":"","FixFR":"Ajoutez de nouveaux DC sur une version de Windows Server supportée (2022 ou 2025), transférez les rôles FSMO, puis rétrogradez et retirez le DC Windows Server 2003. Avec les très anciennes versions, il faut parfois passer d'abord par une version intermédiaire. Montez les niveaux fonctionnels quand tous les anciens DC sont partis."},"A-SpnUnicodeCollision":{"Fix":"An SPN contains invisible Unicode characters to get around the SPN uniqueness check. There is no legit reason for this: treat it as an attack. Disable the account that holds it, remove the bad SPN (Set-ADUser/Set-ADComputer <name> -ServicePrincipalNames @{ Remove = '<spn>' }), reset its password, then find who added it and what was done with it.","Check":"Get-ADObject -LDAPFilter '(servicePrincipalName=*)' -Properties servicePrincipalName | ForEach-Object { $o = $_; $o.servicePrincipalName | Where-Object { $_ -match '[^\\x21-\\x7E]' } | ForEach-Object { [pscustomobject]@{ Object = $o.Name; SPN = $_ } } }","Effort":"Medium","Minutes":60,"Ref":"https://www.semperis.com/blog/identity-crisis-novel-vulnerabilities-leading-to-kerberos-downgrade-dos-and-full-domain-takeover/","FixFR":"Un SPN contient des caractères Unicode invisibles pour contourner le contrôle d'unicité des SPN. Il n'y a aucune raison légitime à cela : traitez-le comme une attaque. Désactivez le compte qui le porte, supprimez le mauvais SPN (Set-ADUser/Set-ADComputer <nom> -ServicePrincipalNames @{ Remove = '<spn>' }), réinitialisez son mot de passe, puis cherchez qui l'a ajouté et ce qui a été fait avec."},"A-SmartCardPwdRotation":{"Fix":"The domain is at functional level 2016 or higher but smart card only accounts keep the same hidden password hash forever, which works like a never expiring password. Turn on automatic rotation: Set-ADObject (Get-ADDomain).DistinguishedName -Replace @{ 'msDS-ExpirePasswordsOnSmartCardOnlyAccounts' = $true }. The hash then rotates when the password policy max age is reached.","Check":"Get-ADObject (Get-ADDomain).DistinguishedName -Properties msDS-ExpirePasswordsOnSmartCardOnlyAccounts | Select-Object msDS-ExpirePasswordsOnSmartCardOnlyAccounts","Effort":"Low","Minutes":5,"Ref":"","FixFR":"Le domaine est au niveau fonctionnel 2016 ou plus mais les comptes à carte à puce obligatoire gardent le même hash de mot de passe caché pour toujours, comme un mot de passe qui n'expire jamais. Activez la rotation automatique : Set-ADObject (Get-ADDomain).DistinguishedName -Replace @{ 'msDS-ExpirePasswordsOnSmartCardOnlyAccounts' = $true }. Le hash change alors quand l'âge maximal de la stratégie de mot de passe est atteint."},"S-DesEnabled":{"Fix":"These accounts allow Kerberos DES, which is broken and removed from Windows Server 2025 and Windows 11 24H2. Untick 'Use only Kerberos DES encryption types for this account' and remove the DES bits (1 and 2) from msDS-SupportedEncryptionTypes, enable AES, then reset the password so AES keys are created.","Check":"Get-ADObject -LDAPFilter '(|(userAccountControl:1.2.840.113556.1.4.803:=2097152)(msDS-SupportedEncryptionTypes:1.2.840.113556.1.4.804:=3))' -Properties userAccountControl, msDS-SupportedEncryptionTypes | Select-Object Name, ObjectClass, msDS-SupportedEncryptionTypes","Effort":"Low","Minutes":30,"Ref":"https://learn.microsoft.com/en-us/services-hub/unified/health/remediation-steps-ad/remove-the-highly-insecure-des-encryption-from-user-accounts","FixFR":"Ces comptes autorisent Kerberos DES, qui est cassé et retiré de Windows Server 2025 et Windows 11 24H2. Décochez 'Use only Kerberos DES encryption types for this account' et retirez les bits DES (1 et 2) de msDS-SupportedEncryptionTypes, activez AES, puis réinitialisez le mot de passe pour créer les clés AES."},"A-DnsZoneAUCreateChild":{"Fix":"Informative rule: Authenticated Users can create records in the AD DNS zones (the default), so any user can add a record such as a wildcard to catch traffic. To harden it, make sure DHCP registers records with a dedicated account, then on each zone (DNS Manager > zone > Properties > Security) remove 'Create all child objects' from Authenticated Users and give it to Domain Computers and the DHCP account. Test before doing it on all zones.","Check":"$d = (Get-ADDomain).DistinguishedName; Get-ADObject -SearchBase \"CN=MicrosoftDNS,DC=DomainDnsZones,$d\" -LDAPFilter '(objectClass=dnsZone)' | ForEach-Object { $z = $_.Name; (Get-Acl -Path \"AD:\\$($_.DistinguishedName)\").Access | Where-Object { $_.ActiveDirectoryRights -match 'CreateChild' -and $(try { $_.IdentityReference.Translate([System.Security.Principal.SecurityIdentifier]).Value } catch { '' }) -eq 'S-1-5-11' } | Select-Object @{ n = 'Zone'; e = { $z } }, IdentityReference, ActiveDirectoryRights }","Effort":"Medium","Minutes":60,"Ref":"https://www.netspi.com/blog/technical/network-penetration-testing/exploiting-adidns/","FixFR":"Règle informative : Authenticated Users peut créer des enregistrements dans les zones DNS AD (le comportement par défaut) : n'importe quel utilisateur peut donc ajouter un enregistrement, par exemple un wildcard, pour capter du trafic. Pour durcir, vérifiez que le DHCP enregistre les noms avec un compte dédié, puis sur chaque zone (Gestionnaire DNS > zone > Propriétés > Sécurité) retirez 'Créer tous les objets enfants' à Authenticated Users et donnez-le à Domain Computers et au compte DHCP. Testez avant de le faire sur toutes les zones."},"P-PrivilegeEveryone":{"Fix":"A GPO grants a dangerous privilege (Debug programs, Load drivers, Act as part of the OS, Backup, Restore, Take ownership, Impersonate...) to Everyone, Authenticated Users, Domain Users or another wide group. Any user can use it to become SYSTEM. Edit the GPO named in the report (User Rights Assignment) and remove the wide group from that privilege.","Check":"Get-GPO -All | Where-Object { (Get-GPOReport -Guid $_.Id -ReportType Xml) -match 'SeDebugPrivilege|SeLoadDriverPrivilege|SeTcbPrivilege|SeBackupPrivilege|SeRestorePrivilege|SeTakeOwnershipPrivilege|SeImpersonatePrivilege|SeAssignPrimaryTokenPrivilege|SeCreateTokenPrivilege|SeSecurityPrivilege|SeManageVolumePrivilege' } | Select-Object DisplayName","Effort":"Low","Minutes":15,"Ref":"https://learn.microsoft.com/en-us/windows/security/threat-protection/security-policy-settings/user-rights-assignment","FixFR":"Une GPO donne un privilège dangereux (Déboguer des programmes, Charger des pilotes, Agir en tant que partie du système, Sauvegarde, Restauration, Prendre possession, Emprunt d'identité...) à Everyone, Authenticated Users, Domain Users ou un autre groupe large. N'importe quel utilisateur peut s'en servir pour devenir SYSTEM. Modifiez la GPO citée dans le rapport (User Rights Assignment) et retirez le groupe large de ce privilège."},"A-CertTempAnyone":{"Fix":"Wide groups (Domain Users, Domain Computers, Authenticated Users, Everyone...) can modify this certificate template, so they can make it vulnerable and request a certificate as an admin (ESC4). In certtmpl.msc > template > Security, remove Write, Full Control, Write owner and Write permissions from these groups. Only PKI admins should keep them.","Check":"$cfg = (Get-ADRootDSE).configurationNamingContex
